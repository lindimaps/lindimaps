<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LindiBank - Financat e Mia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .animate-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .account-carousel {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 12px;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }
        .account-carousel::-webkit-scrollbar { display: none; }
        .account-card {
            flex: 0 0 85%;
            scroll-snap-align: center;
        }
        
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; padding: 0; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-24">

    <!-- Auth Guard Layer -->
    <div id="authOverlay" class="fixed inset-0 bg-white z-[100] flex items-center justify-center p-4 no-print">
        <div class="w-full max-w-md space-y-8 text-center">
            <div class="bg-indigo-600 w-20 h-20 rounded-3xl flex items-center justify-center mx-auto shadow-xl text-white">
                <i data-lucide="wallet" class="w-10 h-10"></i>
            </div>
            <div id="authContent">
                <h1 class="text-3xl font-black text-slate-800">LindiBank</h1>
                <p class="text-slate-500 mt-2">Identifikohuni për të menaxhuar financat</p>
                <div class="mt-8 space-y-4">
                    <input type="email" id="loginEmail" placeholder="Email" class="w-full p-4 bg-slate-100 rounded-2xl border-none outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
                    <input type="password" id="loginPass" placeholder="Fjalëkalimi" class="w-full p-4 bg-slate-100 rounded-2xl border-none outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
                    <button id="authBtn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-lg hover:bg-indigo-700 transition-all active:scale-95">HYNI NË LLOGARI</button>
                </div>
            </div>
            <div id="authLoading" class="hidden">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto"></div>
                <p class="mt-4 font-bold text-slate-400">Duke u lidhur...</p>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <!-- Header -->
        <header class="bg-white border-b p-4 sticky top-0 z-20 no-print">
            <div class="max-w-2xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div class="bg-indigo-600 p-2 rounded-xl text-white">
                        <i data-lucide="wallet" class="w-6 h-6"></i>
                    </div>
                    <h1 class="font-bold text-xl">LindiBank</h1>
                </div>
                <div class="flex gap-2">
                    <button id="openManageBtn" class="p-2 bg-slate-100 rounded-full text-slate-600 active:scale-95">
                        <i data-lucide="settings-2" class="w-5 h-5"></i>
                    </button>
                    <button id="logoutBtn" class="p-2 bg-red-50 rounded-full text-red-500 active:scale-95">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </header>

        <div class="max-w-2xl mx-auto p-4 space-y-6">
            <!-- Përmbledhja Neto -->
            <div class="bg-slate-900 rounded-3xl p-6 text-white shadow-xl relative overflow-hidden no-print">
                <p class="text-[10px] font-bold uppercase opacity-60 tracking-widest mb-1">Gjendja Neto (Total)</p>
                <h2 class="text-3xl font-black mb-4" id="netBalance">0 ALL</h2>
                <div class="grid grid-cols-2 gap-4 border-t border-white/10 pt-4">
                    <div>
                        <p class="text-[9px] uppercase opacity-60">Gjendja Cash</p>
                        <p class="font-bold text-sm" id="cashOnly">0</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[9px] uppercase opacity-60">Limite të Lira</p>
                        <p class="font-bold text-sm" id="limitsOnly">0</p>
                    </div>
                </div>
            </div>

            <!-- Carousel i Llogarive -->
            <div id="accountCarousel" class="account-carousel no-print">
                <!-- Cards will be injected here -->
            </div>

            <!-- Content Tabs -->
            <div id="tabOverview" class="space-y-6">
                <div id="budgetStatus" class="bg-white border border-slate-100 rounded-2xl p-4 shadow-sm hidden animate-in no-print">
                    <div class="flex justify-between items-end mb-2">
                        <div>
                            <p class="text-[10px] font-black text-slate-400 uppercase">Limit Shpenzimi (Buxheti)</p>
                            <p id="budgetLabel" class="text-sm font-bold text-slate-700">0 / 0 ALL</p>
                        </div>
                        <p id="budgetPercent" class="text-xs font-black text-indigo-600">0%</p>
                    </div>
                    <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                        <div id="budgetBar" class="h-full bg-indigo-500 transition-all duration-700" style="width: 0%"></div>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2 my-6 no-print">
                    <button id="openIncomeBtn" class="bg-white p-3 rounded-2xl flex flex-col items-center gap-1 border shadow-sm border-slate-200 active:bg-emerald-50">
                        <i data-lucide="arrow-up-circle" class="text-emerald-500"></i>
                        <span class="font-bold text-[10px] uppercase">Të Ardhura</span>
                    </button>
                    <button id="openExpenseBtn" class="bg-white p-3 rounded-2xl flex flex-col items-center gap-1 border shadow-sm border-slate-200 active:bg-red-50">
                        <i data-lucide="trending-down" class="text-red-500"></i>
                        <span class="font-bold text-[10px] uppercase">Shpenzim</span>
                    </button>
                    <button id="openTransferBtn" class="bg-white p-3 rounded-2xl flex flex-col items-center gap-1 border shadow-sm border-slate-200 active:bg-blue-50">
                        <i data-lucide="arrow-right-left" class="text-blue-500"></i>
                        <span class="font-bold text-[10px] uppercase">Transfertë</span>
                    </button>
                </div>
            </div>

            <div id="tabHistory" class="hidden space-y-4 no-print">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-slate-500 text-sm uppercase tracking-wider">Historiku i Lëvizjeve</h3>
                </div>
                <div id="transactionsList" class="space-y-3"></div>
            </div>

            <div id="tabReports" class="hidden space-y-6 no-print">
                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
                    <h3 class="font-black text-lg">Raportet Financiare</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <select id="reportMonth" class="p-3 bg-slate-50 rounded-xl border-none font-bold text-sm">
                            <option value="all">Gjithë Koha</option>
                            <option value="0">Janar</option><option value="1">Shkurt</option>
                            <option value="2">Mars</option><option value="3">Prill</option>
                            <option value="4">Maj</option><option value="5">Qershor</option>
                            <option value="6">Korrik</option><option value="7">Gusht</option>
                            <option value="8">Shtator</option><option value="9">Tetor</option>
                            <option value="10">Nëntor</option><option value="11">Dhjetor</option>
                        </select>
                        <select id="reportYear" class="p-3 bg-slate-50 rounded-xl border-none font-bold text-sm">
                            <!-- Vitet do shtohen dinamikisht -->
                        </select>
                    </div>
                    <button id="printReportBtn" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black flex items-center justify-center gap-2">
                        <i data-lucide="printer" class="w-5 h-5"></i>
                        PRINTONI RAPORTIN
                    </button>
                </div>
                <div id="categoryStats" class="space-y-3">
                    <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Shpenzimet sipas Kategorisë</h4>
                    <div id="statsList" class="space-y-2"></div>
                </div>
            </div>
        </div>

        <!-- Navigation Bar -->
        <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t flex justify-around p-4 z-30 shadow-[0_-5px_20px_rgba(0,0,0,0.05)] no-print">
            <button onclick="switchTab('overview')" id="navOverview" class="nav-item flex flex-col items-center gap-1 text-indigo-600">
                <i data-lucide="layout-dashboard"></i>
                <span class="text-[9px] font-black uppercase">Kreu</span>
            </button>
            <button onclick="switchTab('history')" id="navHistory" class="nav-item flex flex-col items-center gap-1 text-slate-400">
                <i data-lucide="history"></i>
                <span class="text-[9px] font-black uppercase">Lëvizjet</span>
            </button>
            <button onclick="switchTab('reports')" id="navReports" class="nav-item flex flex-col items-center gap-1 text-slate-400">
                <i data-lucide="pie-chart"></i>
                <span class="text-[9px] font-black uppercase">Raporte</span>
            </button>
        </nav>
    </div>

    <!-- Print Area -->
    <div id="printArea" class="print-only p-8">
        <div id="printContent"></div>
    </div>

    <!-- Modal Container -->
    <div id="modalContainer" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] hidden flex items-end sm:items-center justify-center p-4 no-print" onclick="handleOutsideClick(event)">
        <div id="modalBox" class="bg-white w-full max-w-md rounded-[32px] p-8 space-y-4 animate-in overflow-y-auto max-h-[90vh]" onclick="event.stopPropagation()"></div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirmModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-md z-[100] hidden flex items-center justify-center p-6 no-print" onclick="closeConfirm()">
        <div class="bg-white w-full max-w-sm rounded-[32px] p-8 space-y-4 animate-in shadow-2xl" onclick="event.stopPropagation()">
            <h3 id="confirmTitle" class="text-xl font-black text-center">Konfirmim</h3>
            <p id="confirmMessage" class="text-slate-500 text-center text-sm">Dëshironi të vazhdoni?</p>
            <div class="flex gap-3 pt-4">
                <button id="confirmCancel" class="flex-1 py-4 font-bold text-slate-400 bg-slate-100 rounded-2xl">Jo</button>
                <button id="confirmYes" class="flex-1 py-4 bg-red-600 text-white rounded-2xl font-bold">Po</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, addDoc, deleteDoc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD6laDM0cnLjqvZu1ZV9Or9IuguGwRK4b4",
            authDomain: "lindibank-72a9f.firebaseapp.com",
            projectId: "lindibank-72a9f",
            storageBucket: "lindibank-72a9f.firebasestorage.app",
            messagingSenderId: "267454156254",
            appId: "1:267454156254:web:646d45c4c12e01323c214f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let accounts = [];
        let categories = [];
        let transactions = [];
        let monthlyBudget = 0;
        let activeTab = 'overview';
        let editingId = null;

        const modalContainer = document.getElementById('modalContainer');
        const modalBox = document.getElementById('modalBox');

        window.handleOutsideClick = (e) => { if (e.target === modalContainer) closeModal(); };
        window.closeConfirm = () => document.getElementById('confirmModal').classList.add('hidden');
        window.closeModal = () => { modalContainer.classList.add('hidden'); editingId = null; };

        document.getElementById('authBtn').onclick = async () => {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            if(!email || !pass) return;
            document.getElementById('authLoading').classList.remove('hidden');
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (err) {
                try { await createUserWithEmailAndPassword(auth, email, pass); }
                catch(e) { alert("Gabim: " + e.message); document.getElementById('authLoading').classList.add('hidden'); }
            }
        };

        document.getElementById('logoutBtn').onclick = () => signOut(auth);

        onAuthStateChanged(auth, user => {
            if (user) {
                document.getElementById('authOverlay').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                initData(user.uid);
            } else {
                document.getElementById('authOverlay').classList.remove('hidden');
                document.getElementById('mainApp').classList.add('hidden');
            }
        });

        function initData(uid) {
            const userPath = `artifacts/lindibank/users/${uid}`;
            onSnapshot(collection(db, `${userPath}/accounts`), snap => {
                accounts = snap.docs.map(d => ({id: d.id, ...d.data()}));
                renderAll();
                if(modalContainer.classList.contains('manage-open')) renderManageContent();
            });
            onSnapshot(collection(db, `${userPath}/categories`), snap => {
                categories = snap.docs.map(d => ({id: d.id, ...d.data()}));
                if(modalContainer.classList.contains('manage-open')) renderManageContent();
            });
            onSnapshot(collection(db, `${userPath}/transactions`), snap => {
                transactions = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => b.timestamp - a.timestamp);
                updateYearFilter();
                renderAll();
            });
            onSnapshot(doc(db, `${userPath}/settings`, 'budget'), snap => {
                monthlyBudget = snap.exists() ? Number(snap.data().amount) : 0;
                renderAll();
            });
        }

        function updateYearFilter() {
            const yearSelect = document.getElementById('reportYear');
            const currentYearValue = yearSelect.value;
            const years = [...new Set(transactions.map(t => new Date(t.timestamp).getFullYear()))];
            if (years.length === 0) years.push(new Date().getFullYear());
            years.sort((a,b) => b-a);
            
            yearSelect.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join('');
            if (years.includes(Number(currentYearValue))) {
                yearSelect.value = currentYearValue;
            } else {
                yearSelect.value = years[0];
            }
        }

        window.switchTab = (tab) => {
            activeTab = tab;
            ['tabOverview', 'tabHistory', 'tabReports'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.replace('text-indigo-600', 'text-slate-400'));
            document.getElementById('nav' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.replace('text-slate-400', 'text-indigo-600');
            renderAll();
        };

        function renderAll() {
            const cashOnly = accounts.filter(a => a.type === 'asset' && a.balance > 0).reduce((s, a) => s + Number(a.balance), 0);
            const debtsOnly = accounts.filter(a => a.type === 'debt').reduce((s, a) => s + Math.abs(Number(a.balance)), 0);
            const limitsOnly = accounts.filter(a => a.type === 'debt').reduce((s, a) => s + (Number(a.limit) + Number(a.balance)), 0);
            const netBalance = cashOnly - debtsOnly;

            document.getElementById('netBalance').innerText = netBalance.toLocaleString() + " ALL";
            document.getElementById('cashOnly').innerText = cashOnly.toLocaleString();
            document.getElementById('limitsOnly').innerText = limitsOnly.toLocaleString();

            renderCarousel();
            if (activeTab === 'overview') renderOverview();
            if (activeTab === 'history') renderHistory();
            if (activeTab === 'reports') renderReports();
            lucide.createIcons();
        }

        function renderCarousel() {
            const carousel = document.getElementById('accountCarousel');
            carousel.innerHTML = '';
            accounts.forEach((acc, idx) => {
                const card = document.createElement('div');
                card.className = "account-card";
                const mbetja = acc.type === 'debt' ? (Number(acc.limit) + Number(acc.balance)) : acc.balance;
                const isDebt = acc.type === 'debt';
                card.onclick = () => openDirectEditAccount(acc);
                card.innerHTML = `
                    <div class="bg-indigo-600 rounded-[28px] p-6 text-white h-44 shadow-lg flex flex-col justify-between relative overflow-hidden cursor-pointer active:scale-95 transition-transform">
                        <div class="z-10">
                            <p class="text-[9px] font-black uppercase opacity-60">${acc.name}</p>
                            <h4 class="text-2xl font-black mt-1">${Number(acc.balance).toLocaleString()} ALL</h4>
                        </div>
                        <div class="z-10">
                            <p class="text-[8px] font-bold opacity-60">${isDebt ? 'Limit i Lirë' : 'Gjendja'}</p>
                            <p class="text-sm font-black">${mbetja.toLocaleString()} ALL</p>
                        </div>
                        <div class="absolute -bottom-4 -right-4 opacity-10">
                            <i data-lucide="${isDebt ? 'credit-card' : 'banknote'}" class="w-24 h-24"></i>
                        </div>
                        <div class="absolute top-4 right-4 bg-white/10 p-2 rounded-full">
                            <i data-lucide="pencil" class="w-3 h-3"></i>
                        </div>
                    </div>
                `;
                carousel.appendChild(card);
            });
        }

        function renderOverview() {
            if (monthlyBudget > 0) {
                const now = new Date();
                const spent = transactions.filter(t => t.type === 'expense' && new Date(t.timestamp).getMonth() === now.getMonth()).reduce((s, t) => s + Number(t.amount), 0);
                const p = Math.min((spent/monthlyBudget)*100, 100);
                document.getElementById('budgetStatus').classList.remove('hidden');
                document.getElementById('budgetLabel').innerText = `${spent.toLocaleString()} / ${monthlyBudget.toLocaleString()} ALL`;
                document.getElementById('budgetPercent').innerText = `${Math.round(p)}%`;
                document.getElementById('budgetBar').style.width = p + '%';
            } else {
                document.getElementById('budgetStatus').classList.add('hidden');
            }
        }

        function renderHistory() {
            const list = document.getElementById('transactionsList');
            list.innerHTML = '';
            transactions.forEach(t => {
                const cat = categories.find(c => c.id === t.catId);
                const d = new Date(t.timestamp);
                const div = document.createElement('div');
                div.className = "bg-white p-4 rounded-2xl border border-slate-100 flex items-center justify-between cursor-pointer active:scale-95 transition-all";
                div.onclick = () => openEditTransaction(t);
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="p-2 rounded-lg ${t.type === 'expense' ? 'bg-red-50 text-red-500' : (t.type === 'income' ? 'bg-emerald-50 text-emerald-500' : 'bg-blue-50 text-blue-500')}">
                            <i data-lucide="${t.type === 'expense' ? 'trending-down' : (t.type === 'income' ? 'trending-up' : 'arrow-right-left')}" class="w-4 h-4"></i>
                        </div>
                        <div>
                            <p class="font-bold text-sm">${t.desc || cat?.name || (t.type === 'transfer' ? 'Transfertë' : 'Veprim')}</p>
                            <p class="text-[9px] text-slate-400 font-bold uppercase">${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</p>
                        </div>
                    </div>
                    <p class="font-black ${t.type === 'expense' ? 'text-red-500' : (t.type === 'income' ? 'text-emerald-600' : 'text-blue-500')}">${t.type === 'expense' ? '-' : (t.type === 'income' ? '+' : '')}${Number(t.amount).toLocaleString()}</p>
                `;
                list.appendChild(div);
            });
            lucide.createIcons();
        }

        function renderReports() {
            const statsList = document.getElementById('statsList');
            statsList.innerHTML = '';
            const m = document.getElementById('reportMonth').value;
            const y = document.getElementById('reportYear').value;
            
            const filtered = transactions.filter(t => {
                const d = new Date(t.timestamp);
                return (m === 'all' || d.getMonth() == m) && d.getFullYear() == y && t.type === 'expense';
            });
            
            const catTotals = {};
            filtered.forEach(t => {
                const c = categories.find(cat => cat.id === t.catId)?.name || 'Të tjera';
                catTotals[c] = (catTotals[c] || 0) + Number(t.amount);
            });
            
            const sortedCats = Object.entries(catTotals).sort((a,b) => b[1] - a[1]);
            const total = Object.values(catTotals).reduce((a,b)=>a+b, 0);

            sortedCats.forEach(([name, amt]) => {
                const p = (amt/total)*100;
                const div = document.createElement('div');
                div.className = "bg-white p-4 rounded-xl border border-slate-100 flex items-center justify-between";
                div.innerHTML = `
                    <div class="flex-1 mr-4">
                        <div class="flex justify-between text-xs font-black mb-1">
                            <span>${name}</span>
                            <span class="text-indigo-600">${amt.toLocaleString()} ALL</span>
                        </div>
                        <div class="w-full bg-slate-50 h-1.5 rounded-full overflow-hidden">
                            <div class="h-full bg-indigo-500 transition-all duration-500" style="width:${p}%"></div>
                        </div>
                    </div>
                    <span class="text-[10px] font-black text-slate-400">${Math.round(p)}%</span>
                `;
                statsList.appendChild(div);
            });
            
            if(sortedCats.length === 0) {
                statsList.innerHTML = '<p class="text-center py-8 text-slate-400 text-xs font-bold">Nuk ka shpenzime për këtë periudhë</p>';
            }
        }

        window.openDirectEditAccount = (acc) => {
            showModal(`
                <h2 class="text-xl font-black">Edito Llogarinë</h2>
                <div class="space-y-4 pt-2">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase text-slate-400">Emri i Llogarisë</label>
                        <input id="directEditName" type="text" value="${acc.name}" class="w-full p-4 bg-slate-50 rounded-2xl font-bold border-none outline-none">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase text-slate-400">Lloji</label>
                        <select id="directEditType" class="w-full p-4 bg-slate-50 rounded-2xl font-bold border-none outline-none">
                            <option value="asset" ${acc.type==='asset'?'selected':''}>Cash</option>
                            <option value="debt" ${acc.type==='debt'?'selected':''}>Borxh / Overdraft</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase text-slate-400">Balanca Aktuale (ALL)</label>
                        <input id="directEditBal" type="number" value="${acc.balance}" class="w-full p-4 bg-slate-50 rounded-2xl font-black border-none outline-none">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase text-slate-400">Limiti (nëse është borxh)</label>
                        <input id="directEditLimit" type="number" value="${acc.limit || 0}" class="w-full p-4 bg-slate-50 rounded-2xl font-bold border-none outline-none">
                    </div>
                    <div class="flex gap-2">
                        <button onclick="closeModal()" class="flex-1 py-4 font-bold text-slate-400 bg-slate-100 rounded-2xl">Anulo</button>
                        <button onclick="saveDirectAcc('${acc.id}')" class="flex-[2] bg-indigo-600 text-white py-4 rounded-2xl font-black">RUAJ NDRYSHIMET</button>
                    </div>
                </div>
            `);
        };

        window.saveDirectAcc = async (id) => {
            const name = document.getElementById('directEditName').value;
            const type = document.getElementById('directEditType').value;
            const balance = Number(document.getElementById('directEditBal').value);
            const limit = Number(document.getElementById('directEditLimit').value);
            
            await updateDoc(doc(db, `artifacts/lindibank/users/${auth.currentUser.uid}/accounts`, id), {
                name, type, balance, limit
            });
            closeModal();
        };

        window.openEditTransaction = (t) => {
            showModal(`
                <h2 class="text-xl font-black">Edito Transaksionin</h2>
                <div class="space-y-4 pt-2">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase text-slate-400">Shuma</label>
                        <input id="editTransAmt" type="number" value="${t.amount}" class="w-full text-3xl font-black p-4 bg-slate-50 rounded-2xl outline-none">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase text-slate-400">Shënimi</label>
                        <input id="editTransDesc" type="text" value="${t.desc || ''}" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none font-bold">
                    </div>
                    <div class="flex gap-2">
                        <button onclick="closeModal()" class="flex-1 py-4 font-bold text-slate-400 bg-slate-100 rounded-2xl">Mbyll</button>
                        <button onclick="saveTransaction('${t.id}', '${t.accId}', ${t.amount})" class="flex-[2] bg-indigo-600 text-white py-4 rounded-2xl font-black">RUAJ</button>
                    </div>
                    <button onclick="deleteTransaction('${t.id}', '${t.accId}', ${t.amount}, '${t.type}')" class="w-full text-red-500 font-bold text-[10px] uppercase py-2">FSHI TRANSAKSIONIN</button>
                </div>
            `);
        };

        window.saveTransaction = async (tid, accId, oldAmt) => {
            const newAmt = Number(document.getElementById('editTransAmt').value);
            const desc = document.getElementById('editTransDesc').value;
            const diff = newAmt - oldAmt;
            const userPath = `artifacts/lindibank/users/${auth.currentUser.uid}`;
            const accRef = doc(db, `${userPath}/accounts`, accId);
            const accSnap = await getDoc(accRef);
            if(accSnap.exists()){
                await updateDoc(accRef, { balance: Number(accSnap.data().balance) - diff });
                await updateDoc(doc(db, `${userPath}/transactions`, tid), { amount: newAmt, desc });
            }
            closeModal();
        };

        window.deleteTransaction = (tid, accId, amt, type) => {
            askConfirm("Fshirje", "Dëshironi ta fshini këtë lëvizje?", async () => {
                const userPath = `artifacts/lindibank/users/${auth.currentUser.uid}`;
                const accRef = doc(db, `${userPath}/accounts`, accId);
                const accSnap = await getDoc(accRef);
                if(accSnap.exists()){
                    const currentBalance = Number(accSnap.data().balance);
                    const restoreBal = type === 'expense' ? currentBalance + Number(amt) : currentBalance - Number(amt);
                    await updateDoc(accRef, { balance: restoreBal });
                }
                await deleteDoc(doc(db, `${userPath}/transactions`, tid));
                closeModal();
            });
        };

        document.getElementById('openManageBtn').onclick = () => {
            showModal(`
                <div class="flex justify-between items-center border-b pb-4">
                    <h2 class="text-xl font-black">Konfigurime</h2>
                    <button onclick="closeModal()"><i data-lucide="x"></i></button>
                </div>
                <div class="space-y-6 pt-4 pb-10">
                    <section class="space-y-3">
                        <h3 class="text-[10px] font-black text-indigo-600 uppercase">Limit Shpenzimi (Buxheti)</h3>
                        <div class="flex gap-2">
                            <input id="mBudget" type="number" value="${monthlyBudget}" class="flex-1 p-4 bg-slate-50 rounded-2xl font-bold border-none outline-none" placeholder="Vendos limitin (0 për ta fshirë)">
                            <button onclick="saveGlobalBudget()" class="bg-indigo-600 text-white px-6 rounded-2xl font-black">OK</button>
                        </div>
                    </section>
                    
                    <section class="space-y-3">
                        <h3 class="text-[10px] font-black text-indigo-600 uppercase">Menaxho Llogaritë</h3>
                        <div id="mAccList" class="space-y-2"></div>
                        <button id="showNewAcc" class="w-full py-3 border-2 border-dashed border-slate-200 rounded-xl text-slate-400 font-bold text-xs hover:border-indigo-300 transition-colors">+ SHTO LLOGARI TË RE</button>
                        <div id="newAccBox" class="hidden p-4 bg-slate-50 rounded-2xl space-y-2 animate-in">
                            <input id="nAccName" placeholder="Emri i llogarisë" class="w-full p-3 rounded-lg font-bold border-none">
                            <select id="nAccType" class="w-full p-3 rounded-lg font-bold border-none"><option value="asset">Llogari Cash</option><option value="debt">Borxh / Overdraft</option></select>
                            <input id="nAccLimit" type="number" placeholder="Limiti (nëse ka)" class="w-full p-3 rounded-lg font-bold border-none">
                            <button onclick="submitNewAcc()" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-black">KRIJO</button>
                        </div>
                    </section>

                    <section class="space-y-3">
                        <h3 class="text-[10px] font-black text-indigo-600 uppercase">Menaxho Kategoritë</h3>
                        <div id="mCatList" class="space-y-2"></div>
                        <div class="bg-slate-50 p-4 rounded-2xl space-y-2">
                            <input id="nCatName" placeholder="Emri i Kategorisë" class="w-full p-3 rounded-lg font-bold border-none">
                            <select id="nCatType" class="w-full p-3 rounded-lg font-bold border-none"><option value="expense">Kategori Shpenzimi</option><option value="income">Kategori Të Ardhura</option></select>
                            <button onclick="submitNewCat()" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-black">SHTO KATEGORI</button>
                        </div>
                    </section>
                </div>
            `, true);
            renderManageContent();
        };

        function renderManageContent() {
            const accList = document.getElementById('mAccList');
            const catList = document.getElementById('mCatList');
            if(!accList || !catList) return;

            accList.innerHTML = '';
            accounts.forEach(acc => {
                const div = document.createElement('div');
                div.className = "bg-white p-3 rounded-xl border border-slate-100 flex justify-between items-center";
                div.innerHTML = `
                    <div><p class="font-bold text-sm">${acc.name}</p><p class="text-[9px] text-slate-400 font-black">${acc.type.toUpperCase()}</p></div>
                    <div class="flex gap-1">
                        <button onclick="openDirectEditAccount(${JSON.stringify(acc).replace(/"/g, '&quot;')})" class="p-2 text-indigo-500"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                        <button onclick="delAcc('${acc.id}', '${acc.name}')" class="p-2 text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                `;
                accList.appendChild(div);
            });

            catList.innerHTML = '';
            categories.forEach(cat => {
                const div = document.createElement('div');
                div.className = "bg-white p-3 rounded-xl border border-slate-100 flex justify-between items-center";
                div.innerHTML = `
                    <div><p class="font-bold text-sm">${cat.name}</p><p class="text-[9px] text-slate-400 font-black">${cat.type.toUpperCase()}</p></div>
                    <div class="flex gap-1">
                        <button onclick="openEditCat('${cat.id}')" class="p-2 text-indigo-500"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                        <button onclick="delCat('${cat.id}')" class="p-2 text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                `;
                catList.appendChild(div);
            });
            
            document.getElementById('showNewAcc').onclick = () => document.getElementById('newAccBox').classList.toggle('hidden');
            lucide.createIcons();
        }

        window.openEditCat = (id) => {
            const cat = categories.find(c => c.id === id);
            showModal(`
                <h2 class="text-xl font-black">Edito Kategorinë</h2>
                <div class="space-y-4 pt-2">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase text-slate-400">Emri i Kategorisë</label>
                        <input id="editCatName" type="text" value="${cat.name}" class="w-full p-4 bg-slate-50 rounded-2xl font-bold border-none outline-none">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase text-slate-400">Lloji</label>
                        <select id="editCatType" class="w-full p-4 bg-slate-50 rounded-2xl font-bold border-none outline-none">
                            <option value="expense" ${cat.type==='expense'?'selected':''}>Shpenzim</option>
                            <option value="income" ${cat.type==='income'?'selected':''}>Ardhura</option>
                        </select>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="closeModal()" class="flex-1 py-4 font-bold text-slate-400 bg-slate-100 rounded-2xl">Anulo</button>
                        <button onclick="saveEditedCat('${id}')" class="flex-[2] bg-indigo-600 text-white py-4 rounded-2xl font-black">RUAJ</button>
                    </div>
                </div>
            `);
        };

        window.saveEditedCat = async (id) => {
            const name = document.getElementById('editCatName').value;
            const type = document.getElementById('editCatType').value;
            if(!name) return;
            await updateDoc(doc(db, `artifacts/lindibank/users/${auth.currentUser.uid}/categories`, id), { name, type });
            closeModal();
        };

        window.delAcc = (id, name) => {
            askConfirm("Fshirje", `Fshini llogarinë ${name}? Të dhënat do të humbasin.`, async () => {
                await deleteDoc(doc(db, `artifacts/lindibank/users/${auth.currentUser.uid}/accounts`, id));
            });
        };

        window.submitNewAcc = async () => {
            const name = document.getElementById('nAccName').value;
            const type = document.getElementById('nAccType').value;
            const limit = Number(document.getElementById('nAccLimit').value) || 0;
            if(!name) return;
            await addDoc(collection(db, `artifacts/lindibank/users/${auth.currentUser.uid}/accounts`), { name, type, limit, balance: 0 });
            document.getElementById('newAccBox').classList.add('hidden');
        };

        window.submitNewCat = async () => {
            const name = document.getElementById('nCatName').value;
            const type = document.getElementById('nCatType').value;
            if(!name) return;
            await addDoc(collection(db, `artifacts/lindibank/users/${auth.currentUser.uid}/categories`), { name, type });
            document.getElementById('nCatName').value = '';
        };

        window.delCat = (id) => {
            askConfirm("Fshirje", "Dëshironi të fshini këtë kategori?", async () => {
                await deleteDoc(doc(db, `artifacts/lindibank/users/${auth.currentUser.uid}/categories`, id));
            });
        };

        window.saveGlobalBudget = async () => {
            const amt = Number(document.getElementById('mBudget').value);
            await setDoc(doc(db, `artifacts/lindibank/users/${auth.currentUser.uid}/settings`, 'budget'), { amount: amt });
            closeModal();
        };

        window.handleTransaction = async (type) => {
            const amt = Number(document.getElementById('mAmt').value);
            const catId = document.getElementById('mCat').value;
            const accId = document.getElementById('mAcc').value;
            const desc = document.getElementById('mDesc').value;
            if(!amt || !accId) return;
            const acc = accounts.find(a => a.id === accId);
            const userPath = `artifacts/lindibank/users/${auth.currentUser.uid}`;
            const newBal = type === 'income' ? Number(acc.balance) + amt : Number(acc.balance) - amt;
            await updateDoc(doc(db, `${userPath}/accounts`, accId), { balance: newBal });
            await addDoc(collection(db, `${userPath}/transactions`), { type, amount: amt, catId, accId, desc, timestamp: Date.now() });
            closeModal();
        };

        window.handleTransferInternal = async () => {
            const amt = Number(document.getElementById('mAmt').value);
            const fromId = document.getElementById('mAccFrom').value;
            const toId = document.getElementById('mAccTo').value;
            if(!amt || !fromId || !toId) return;
            const userPath = `artifacts/lindibank/users/${auth.currentUser.uid}`;
            const fromAcc = accounts.find(a => a.id === fromId);
            const toAcc = accounts.find(a => a.id === toId);
            await updateDoc(doc(db, `${userPath}/accounts`, fromId), { balance: Number(fromAcc.balance) - amt });
            await updateDoc(doc(db, `${userPath}/accounts`, toId), { balance: Number(toAcc.balance) + amt });
            await addDoc(collection(db, `${userPath}/transactions`), { type: 'transfer', amount: amt, fromId, toId, desc: 'Transfertë', timestamp: Date.now() });
            closeModal();
        };

        window.askConfirm = (title, msg, onYes) => {
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmMessage').innerText = msg;
            document.getElementById('confirmModal').classList.remove('hidden');
            document.getElementById('confirmYes').onclick = () => { onYes(); document.getElementById('confirmModal').classList.add('hidden'); };
            document.getElementById('confirmCancel').onclick = () => document.getElementById('confirmModal').classList.add('hidden');
        };

        window.showModal = (content, isManage = false) => {
            modalBox.innerHTML = content;
            modalContainer.classList.remove('hidden');
            if (isManage) modalContainer.classList.add('manage-open');
            else modalContainer.classList.remove('manage-open');
            lucide.createIcons();
        };

        document.getElementById('openIncomeBtn').onclick = () => {
            const incCats = categories.filter(c => c.type === 'income');
            showModal(`
                <h2 class="text-xl font-black text-emerald-600">Ardhura</h2>
                <div class="space-y-4 pt-2">
                    <input id="mAmt" type="number" placeholder="0.00" class="w-full text-4xl font-black bg-slate-50 p-6 rounded-2xl outline-none">
                    <div class="grid grid-cols-2 gap-3">
                        <select id="mCat" class="bg-slate-100 p-4 rounded-2xl font-bold border-none outline-none">${incCats.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}</select>
                        <select id="mAcc" class="bg-slate-100 p-4 rounded-2xl font-bold border-none outline-none">${accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('')}</select>
                    </div>
                    <input id="mDesc" type="text" placeholder="Shënim" class="w-full bg-slate-50 p-4 rounded-2xl font-bold border-none outline-none">
                    <div class="flex gap-2">
                        <button onclick="closeModal()" class="flex-1 py-4 font-bold text-slate-400 bg-slate-100 rounded-2xl">Mbyll</button>
                        <button onclick="handleTransaction('income')" class="flex-[2] bg-emerald-600 text-white py-4 rounded-2xl font-black">REGJISTRO</button>
                    </div>
                </div>
            `);
        };

        document.getElementById('openExpenseBtn').onclick = () => {
            const expCats = categories.filter(c => c.type === 'expense');
            showModal(`
                <h2 class="text-xl font-black text-red-600">Shpenzim</h2>
                <div class="space-y-4 pt-2">
                    <input id="mAmt" type="number" placeholder="0.00" class="w-full text-4xl font-black bg-slate-50 p-6 rounded-2xl outline-none">
                    <div class="grid grid-cols-2 gap-3">
                        <select id="mCat" class="bg-slate-100 p-4 rounded-2xl font-bold border-none outline-none">${expCats.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}</select>
                        <select id="mAcc" class="bg-slate-100 p-4 rounded-2xl font-bold border-none outline-none">${accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('')}</select>
                    </div>
                    <input id="mDesc" type="text" placeholder="Shënim" class="w-full bg-slate-50 p-4 rounded-2xl font-bold border-none outline-none">
                    <div class="flex gap-2">
                        <button onclick="closeModal()" class="flex-1 py-4 font-bold text-slate-400 bg-slate-100 rounded-2xl">Mbyll</button>
                        <button onclick="handleTransaction('expense')" class="flex-[2] bg-red-600 text-white py-4 rounded-2xl font-black">RUAJ</button>
                    </div>
                </div>
            `);
        };

        document.getElementById('openTransferBtn').onclick = () => {
            showModal(`
                <h2 class="text-xl font-black text-blue-600">Transfertë</h2>
                <div class="space-y-4 pt-2">
                    <input id="mAmt" type="number" placeholder="0.00" class="w-full text-4xl font-black bg-slate-50 p-6 rounded-2xl outline-none">
                    <div class="grid grid-cols-2 gap-3">
                        <select id="mAccFrom" class="bg-slate-100 p-4 rounded-2xl font-bold border-none outline-none"><option value="">NGA</option>${accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('')}</select>
                        <select id="mAccTo" class="bg-slate-100 p-4 rounded-2xl font-bold border-none outline-none"><option value="">TEK</option>${accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('')}</select>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="closeModal()" class="flex-1 py-4 font-bold text-slate-400 bg-slate-100 rounded-2xl">Mbyll</button>
                        <button onclick="handleTransferInternal()" class="flex-[2] bg-blue-600 text-white py-4 rounded-2xl font-black">OK</button>
                    </div>
                </div>
            `);
        };

        document.getElementById('printReportBtn').onclick = () => {
            const m = document.getElementById('reportMonth').value;
            const y = document.getElementById('reportYear').value;
            const periodText = m === 'all' ? `Gjithë Kohës - ${y}` : `Muaji ${Number(m)+1}/${y}`;
            
            const filtered = transactions.filter(t => {
                const d = new Date(t.timestamp);
                return (m === 'all' || d.getMonth() == m) && d.getFullYear() == y;
            }).sort((a,b) => b.timestamp - a.timestamp);

            let totalIn = 0;
            let totalOut = 0;

            let html = `
                <div class="mb-10 text-center">
                    <h1 class="text-3xl font-black uppercase tracking-tighter">Raporti Financiar LindiBank</h1>
                    <p class="text-slate-500 font-bold">${periodText}</p>
                </div>
                
                <h2 class="text-lg font-black mb-4 border-b-2 border-slate-900 pb-1">Gjendja e Llogarive</h2>
                <table class="w-full border-collapse mb-10">
                    <tr class="bg-slate-50">
                        <th class="border p-3 text-left font-black uppercase text-[10px]">Llogaria</th>
                        <th class="border p-3 text-right font-black uppercase text-[10px]">Balanca</th>
                    </tr>
            `;
            
            accounts.forEach(a => {
                html += `<tr><td class="border p-3 font-bold">${a.name}</td><td class="border p-3 text-right font-black">${a.balance.toLocaleString()} ALL</td></tr>`;
            });
            
            html += `
                </table>
                <h2 class="text-lg font-black mb-4 border-b-2 border-slate-900 pb-1">Historiku i Lëvizjeve</h2>
                <table class="w-full border-collapse">
                    <tr class="bg-slate-50">
                        <th class="border p-2 text-left font-black uppercase text-[10px]">Data & Ora</th>
                        <th class="border p-2 text-left font-black uppercase text-[10px]">Përshkrimi</th>
                        <th class="border p-2 text-left font-black uppercase text-[10px]">Kategoria</th>
                        <th class="border p-2 text-right font-black uppercase text-[10px]">Shuma</th>
                    </tr>
            `;
            
            filtered.forEach(t => {
                const d = new Date(t.timestamp);
                const dateStr = d.toLocaleDateString('sq-AL');
                const timeStr = d.toLocaleTimeString('sq-AL', {hour: '2-digit', minute:'2-digit'});
                const catName = categories.find(c => c.id === t.catId)?.name || (t.type === 'transfer' ? 'Transfertë' : '-');
                const isOut = t.type === 'expense';
                const isIn = t.type === 'income';
                
                if (isOut) totalOut += Number(t.amount);
                if (isIn) totalIn += Number(t.amount);

                html += `
                    <tr>
                        <td class="border p-2 text-[11px] font-medium">${dateStr} ${timeStr}</td>
                        <td class="border p-2 text-[11px] font-bold">${t.desc || '-'}</td>
                        <td class="border p-2 text-[11px] uppercase font-black opacity-60">${catName}</td>
                        <td class="border p-2 text-right font-black ${isOut ? 'text-red-600' : (isIn ? 'text-emerald-600' : 'text-blue-600')}">
                            ${isOut ? '-' : (isIn ? '+' : '')}${Number(t.amount).toLocaleString()}
                        </td>
                    </tr>
                `;
            });
            
            html += `
                </table>
                <div class="mt-10 border-t-4 border-slate-900 pt-6">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-black uppercase text-xs">Total të Ardhura:</span>
                        <span class="text-emerald-600 font-black text-xl">+ ${totalIn.toLocaleString()} ALL</span>
                    </div>
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-black uppercase text-xs">Total Shpenzime:</span>
                        <span class="text-red-600 font-black text-xl">- ${totalOut.toLocaleString()} ALL</span>
                    </div>
                    <div class="flex justify-between items-center bg-slate-900 text-white p-4 rounded-xl mt-4">
                        <span class="font-black uppercase text-sm">Bilanci i Periudhës:</span>
                        <span class="font-black text-2xl">${(totalIn - totalOut).toLocaleString()} ALL</span>
                    </div>
                </div>
                <p class="text-[9px] text-center mt-20 opacity-40 font-bold uppercase">Gjeneruar nga LindiBank - ${new Date().toLocaleString()}</p>
            `;
            
            document.getElementById('printContent').innerHTML = html;
            window.print();
        };

        lucide.createIcons();
    </script>
</body>
</html>
