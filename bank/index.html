<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LindiBank - Financat e Mia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .animate-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-24">

    <!-- Auth Guard Layer -->
    <div id="authOverlay" class="fixed inset-0 bg-white z-[100] flex items-center justify-center p-4">
        <div class="w-full max-w-md space-y-8 text-center">
            <div class="bg-indigo-600 w-20 h-20 rounded-3xl flex items-center justify-center mx-auto shadow-xl text-white">
                <i data-lucide="wallet" class="w-10 h-10"></i>
            </div>
            <div id="authContent">
                <h1 class="text-3xl font-black text-slate-800">LindiBank</h1>
                <p class="text-slate-500 mt-2">Identifikohuni për të menaxhuar financat</p>
                <div class="mt-8 space-y-4">
                    <input type="email" id="loginEmail" placeholder="Email" class="w-full p-4 bg-slate-100 rounded-2xl border-none outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
                    <input type="password" id="loginPass" placeholder="Fjalëkalimi" class="w-full p-4 bg-slate-100 rounded-2xl border-none outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
                    <button id="authBtn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-lg hover:bg-indigo-700 transition-all active:scale-95">HYNI NË LLOGARI</button>
                    <button id="toggleAuthMode" class="text-indigo-600 font-bold text-sm">Nuk keni llogari? Regjistrohuni</button>
                </div>
            </div>
            <div id="authLoading" class="hidden">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto"></div>
                <p class="mt-4 font-bold text-slate-400">Duke u lidhur...</p>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <!-- Header -->
        <header class="bg-white border-b p-4 sticky top-0 z-20">
            <div class="max-w-2xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div class="bg-indigo-600 p-2 rounded-xl text-white">
                        <i data-lucide="wallet" class="w-6 h-6"></i>
                    </div>
                    <h1 class="font-bold text-xl">Financat e Mia</h1>
                </div>
                <div class="flex gap-2">
                    <button id="openManageBtn" class="p-2 bg-slate-100 rounded-full text-slate-600 active:scale-95">
                        <i data-lucide="settings-2" class="w-5 h-5"></i>
                    </button>
                    <button id="logoutBtn" class="p-2 bg-red-50 rounded-full text-red-500 active:scale-95">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </header>

        <div class="max-w-2xl mx-auto p-4 space-y-6">
            <!-- Bilanci Përmbledhës -->
            <div class="bg-indigo-600 rounded-3xl p-6 text-white shadow-xl shadow-indigo-100 relative overflow-hidden">
                <div class="relative z-10">
                    <p class="text-xs font-bold uppercase opacity-70">Gjendja Neto</p>
                    <h2 class="text-3xl font-black mb-4" id="netBalance">0 ALL</h2>
                    <div class="flex justify-between border-t border-indigo-500 pt-4">
                        <div>
                            <p class="text-[10px] uppercase opacity-70">Pasuri</p>
                            <p class="font-bold" id="assetTotal">0</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] uppercase opacity-70">Detyrime</p>
                            <p class="font-bold" id="debtTotal">0</p>
                        </div>
                    </div>
                </div>
                <div class="absolute top-0 right-0 p-4 opacity-10">
                    <i data-lucide="wallet" class="w-32 h-32"></i>
                </div>
            </div>

            <div id="tabOverview">
                <!-- Buxheti Status -->
                <div id="budgetStatus" class="bg-white border border-slate-100 rounded-2xl p-4 shadow-sm hidden animate-in">
                    <div class="flex justify-between items-end mb-2">
                        <div>
                            <p class="text-[10px] font-black text-slate-400 uppercase">Buxheti Mujor</p>
                            <p id="budgetLabel" class="text-sm font-bold text-slate-700">Shpenzuar: 0 / 0 ALL</p>
                        </div>
                        <p id="budgetPercent" class="text-xs font-black text-indigo-600">0%</p>
                    </div>
                    <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                        <div id="budgetBar" class="h-full bg-indigo-500 transition-all duration-700" style="width: 0%"></div>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2 my-6">
                    <button id="openIncomeBtn" class="bg-white p-3 rounded-2xl flex flex-col items-center gap-1 border shadow-sm border-slate-200 active:bg-emerald-50">
                        <i data-lucide="arrow-up-circle" class="text-emerald-500"></i>
                        <span class="font-bold text-[10px] uppercase">Të Ardhura</span>
                    </button>
                    <button id="openExpenseBtn" class="bg-white p-3 rounded-2xl flex flex-col items-center gap-1 border shadow-sm border-slate-200 active:bg-red-50">
                        <i data-lucide="trending-down" class="text-red-500"></i>
                        <span class="font-bold text-[10px] uppercase">Shpenzim</span>
                    </button>
                    <button id="openTransferBtn" class="bg-white p-3 rounded-2xl flex flex-col items-center gap-1 border shadow-sm border-slate-200 active:bg-blue-50">
                        <i data-lucide="arrow-right-left" class="text-blue-500"></i>
                        <span class="font-bold text-[10px] uppercase">Transfertë</span>
                    </button>
                </div>

                <section class="space-y-3">
                    <h3 class="font-bold flex items-center gap-2 text-slate-500 text-sm uppercase tracking-wider">Llogaritë</h3>
                    <div id="accountsList" class="space-y-3"></div>
                </section>
            </div>

            <div id="tabHistory" class="hidden">
                <section class="space-y-3">
                    <h3 class="font-bold text-slate-500 text-sm uppercase tracking-wider">Lëvizjet</h3>
                    <div id="transactionsList" class="space-y-3"></div>
                </section>
            </div>
        </div>

        <!-- Navigation Bar -->
        <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t flex justify-around p-4 z-30 shadow-[0_-5px_20px_rgba(0,0,0,0.05)]">
            <button id="navOverview" class="flex flex-col items-center gap-1 text-indigo-600 transition-colors">
                <i data-lucide="layout-dashboard"></i>
                <span class="text-[9px] font-black uppercase tracking-tighter">Kreu</span>
            </button>
            <button id="navHistory" class="flex flex-col items-center gap-1 text-slate-400 transition-colors">
                <i data-lucide="history"></i>
                <span class="text-[9px] font-black uppercase tracking-tighter">Lëvizjet</span>
            </button>
        </div>
    </div>

    <!-- Main Modals Container -->
    <div id="modalContainer" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] hidden flex items-end sm:items-center justify-center p-4">
        <div id="modalBox" class="bg-white w-full max-w-md rounded-[32px] p-8 space-y-4 animate-in overflow-y-auto max-h-[90vh]"></div>
    </div>

    <!-- Confirmation Modal (Alert) -->
    <div id="confirmModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-md z-[100] hidden flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-[32px] p-8 space-y-4 animate-in zoom-in-95 duration-200 shadow-2xl">
            <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="alert-triangle" class="w-8 h-8"></i>
            </div>
            <h3 id="confirmTitle" class="text-xl font-black text-center">Titulli</h3>
            <p id="confirmMessage" class="text-slate-500 text-center text-sm leading-relaxed">Mesazhi</p>
            <div class="flex gap-3 pt-4">
                <button id="confirmCancel" class="flex-1 py-4 font-bold text-slate-400 bg-slate-100 rounded-2xl">Anulo</button>
                <button id="confirmYes" class="flex-1 py-4 bg-red-600 text-white rounded-2xl font-bold">Po, fshije</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, addDoc, deleteDoc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD6laDM0cnLjqvZu1ZV9Or9IuguGwRK4b4",
            authDomain: "lindibank-72a9f.firebaseapp.com",
            projectId: "lindibank-72a9f",
            storageBucket: "lindibank-72a9f.firebasestorage.app",
            messagingSenderId: "267454156254",
            appId: "1:267454156254:web:646d45c4c12e01323c214f",
            measurementId: "G-7SW8XSHWLK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State Management
        let accounts = [];
        let categories = [];
        let transactions = [];
        let monthlyBudget = 0;
        let isLoginMode = true;
        let editingAccId = null;
        let editingCatId = null;

        // UI Handlers
        const authOverlay = document.getElementById('authOverlay');
        const mainApp = document.getElementById('mainApp');
        const modalContainer = document.getElementById('modalContainer');
        const modalBox = document.getElementById('modalBox');
        const confirmModal = document.getElementById('confirmModal');

        // --- AUTH LOGIC ---
        document.getElementById('toggleAuthMode').onclick = () => {
            isLoginMode = !isLoginMode;
            document.getElementById('authBtn').innerText = isLoginMode ? 'HYNI NË LLOGARI' : 'KRIJONI LLOGARI';
            document.getElementById('toggleAuthMode').innerText = isLoginMode ? 'Nuk keni llogari? Regjistrohuni' : 'Keni llogari? Identifikohuni';
        };

        document.getElementById('authBtn').onclick = async () => {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            if(!email || !pass) return;
            document.getElementById('authContent').classList.add('hidden');
            document.getElementById('authLoading').classList.remove('hidden');
            try {
                if(isLoginMode) await signInWithEmailAndPassword(auth, email, pass);
                else await createUserWithEmailAndPassword(auth, email, pass);
            } catch (err) {
                alert("Gabim: " + err.message);
                document.getElementById('authContent').classList.remove('hidden');
                document.getElementById('authLoading').classList.add('hidden');
            }
        };

        document.getElementById('logoutBtn').onclick = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                authOverlay.classList.add('hidden');
                mainApp.classList.remove('hidden');
                initData(user.uid);
            } else {
                authOverlay.classList.remove('hidden');
                mainApp.classList.add('hidden');
            }
        });

        // --- DATA SYNC ---
        function initData(uid) {
            const userPath = `artifacts/lindibank/users/${uid}`;
            
            // Accounts
            onSnapshot(collection(db, `${userPath}/accounts`), (snap) => {
                accounts = snap.docs.map(d => ({id: d.id, ...d.data()}));
                if (accounts.length === 0) {
                    const defaults = [{ name: 'Debit Card', balance: 0, type: 'asset', limit: 0 }, { name: 'Cash', balance: 0, type: 'asset', limit: 0 }];
                    defaults.forEach(acc => addDoc(collection(db, `${userPath}/accounts`), acc));
                }
                renderUI();
                if (modalContainer.classList.contains('manage-open')) renderManageContent();
            });

            // Categories
            onSnapshot(collection(db, `${userPath}/categories`), (snap) => {
                categories = snap.docs.map(d => ({id: d.id, ...d.data()}));
                if (categories.length === 0) {
                    const defaultCats = [
                        { name: 'Ushqim', type: 'expense' },
                        { name: 'Qira', type: 'expense' },
                        { name: 'Transport', type: 'expense' },
                        { name: 'Paga', type: 'income' }
                    ];
                    defaultCats.forEach(c => addDoc(collection(db, `${userPath}/categories`), c));
                }
                if (modalContainer.classList.contains('manage-open')) renderManageContent();
            });

            // Budget
            onSnapshot(doc(db, `${userPath}/settings`, 'budget'), (snap) => {
                monthlyBudget = snap.exists() ? snap.data().amount : 0;
                renderUI();
            });

            // Transactions
            onSnapshot(collection(db, `${userPath}/transactions`), (snap) => {
                transactions = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => b.timestamp - a.timestamp);
                renderUI();
            });
        }

        // --- RENDER ENGINE ---
        function renderUI() {
            const assets = accounts.filter(a => a.type === 'asset').reduce((s, a) => s + Number(a.balance), 0);
            const debts = accounts.filter(a => a.type === 'debt').reduce((s, a) => s + Number(a.balance), 0);
            document.getElementById('netBalance').innerText = (assets + debts).toLocaleString() + " ALL";
            document.getElementById('assetTotal').innerText = assets.toLocaleString();
            document.getElementById('debtTotal').innerText = debts.toLocaleString();

            // Budget Bar Logic
            if (monthlyBudget > 0) {
                const now = new Date();
                const currentMonthTrans = transactions.filter(t => {
                    const d = new Date(t.timestamp);
                    return t.type === 'expense' && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                });
                const spent = currentMonthTrans.reduce((s, t) => s + Number(t.amount), 0);
                const percent = Math.min((spent / monthlyBudget) * 100, 100);
                
                document.getElementById('budgetStatus').classList.remove('hidden');
                document.getElementById('budgetLabel').innerText = `Shpenzuar: ${spent.toLocaleString()} / ${monthlyBudget.toLocaleString()} ALL`;
                document.getElementById('budgetPercent').innerText = `${Math.round(percent)}%`;
                document.getElementById('budgetBar').style.width = `${percent}%`;
            } else {
                document.getElementById('budgetStatus').classList.add('hidden');
            }

            const accList = document.getElementById('accountsList');
            accList.innerHTML = '';
            accounts.forEach(acc => {
                const div = document.createElement('div');
                div.className = "bg-white p-4 rounded-2xl border border-slate-100 shadow-sm animate-in";
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <span class="font-bold text-slate-700">${acc.name}</span>
                        <span class="font-black ${acc.balance < 0 ? 'text-red-500' : 'text-emerald-600'}">
                            ${Number(acc.balance).toLocaleString()} ALL
                        </span>
                    </div>
                    ${acc.type === 'debt' ? `
                        <div class="mt-2">
                            <div class="flex justify-between text-[10px] text-slate-400 font-bold mb-1 uppercase">
                                <span>LIMITI: ${acc.limit.toLocaleString()}</span>
                                <span>I LIRË: ${(Number(acc.limit) + Number(acc.balance)).toLocaleString()}</span>
                            </div>
                            <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                                <div class="h-full bg-red-400 transition-all duration-500" style="width: ${Math.min((Math.abs(acc.balance) / acc.limit) * 100, 100)}%"></div>
                            </div>
                        </div>
                    ` : ''}
                `;
                accList.appendChild(div);
            });

            const transList = document.getElementById('transactionsList');
            transList.innerHTML = transactions.length === 0 ? '<p class="text-center py-10 text-slate-400 text-sm italic">Nuk ka transaksione ende.</p>' : '';
            transactions.forEach(t => {
                const div = document.createElement('div');
                div.className = "bg-white p-4 rounded-2xl border border-slate-100 flex items-center justify-between animate-in";
                const isExp = t.type === 'expense';
                const isInc = t.type === 'income';
                const cat = categories.find(c => c.id === t.catId);
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="p-2 rounded-lg ${isExp ? 'bg-red-50 text-red-500' : isInc ? 'bg-emerald-50 text-emerald-500' : 'bg-blue-50 text-blue-500'}">
                            <i data-lucide="${isExp ? 'trending-down' : isInc ? 'trending-up' : 'arrow-right-left'}" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <p class="font-bold text-sm">${t.desc || cat?.name || 'Transfertë'}</p>
                            <p class="text-[10px] text-slate-400 font-bold uppercase">${new Date(t.timestamp).toLocaleDateString('sq-AL')}</p>
                        </div>
                    </div>
                    <p class="font-black ${isExp ? 'text-red-500' : isInc ? 'text-emerald-600' : 'text-blue-500'}">
                        ${isExp ? '-' : isInc ? '+' : ''}${Number(t.amount).toLocaleString()}
                    </p>
                `;
                transList.appendChild(div);
            });
            lucide.createIcons();
        }

        // --- NAVIGATION ---
        const navOverview = document.getElementById('navOverview');
        const navHistory = document.getElementById('navHistory');
        const tabOverview = document.getElementById('tabOverview');
        const tabHistory = document.getElementById('tabHistory');

        navOverview.onclick = () => {
            tabOverview.classList.remove('hidden');
            tabHistory.classList.add('hidden');
            navOverview.className = "flex flex-col items-center gap-1 text-indigo-600 transition-colors";
            navHistory.className = "flex flex-col items-center gap-1 text-slate-400 transition-colors";
        };

        navHistory.onclick = () => {
            tabOverview.classList.add('hidden');
            tabHistory.classList.remove('hidden');
            navHistory.className = "flex flex-col items-center gap-1 text-indigo-600 transition-colors";
            navOverview.className = "flex flex-col items-center gap-1 text-slate-400 transition-colors";
        };

        // --- MODAL & CONFIRMATION ---
        function showModal(content, isManage = false) {
            modalBox.innerHTML = content;
            modalContainer.classList.remove('hidden');
            if (isManage) modalContainer.classList.add('manage-open');
            else modalContainer.classList.remove('manage-open');
            lucide.createIcons();
        }

        window.closeModal = () => {
            modalContainer.classList.add('hidden');
            modalContainer.classList.remove('manage-open');
            editingAccId = null;
            editingCatId = null;
        };

        window.askConfirm = (title, message, onYes) => {
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmMessage').innerText = message;
            confirmModal.classList.remove('hidden');
            document.getElementById('confirmYes').onclick = () => {
                onYes();
                confirmModal.classList.add('hidden');
            };
            document.getElementById('confirmCancel').onclick = () => confirmModal.classList.add('hidden');
            lucide.createIcons();
        };

        // --- CORE ACTIONS ---
        document.getElementById('openIncomeBtn').onclick = () => {
            const incomeCats = categories.filter(c => c.type === 'income');
            showModal(`
                <h2 class="text-xl font-black text-emerald-600">Regjistro të Ardhura</h2>
                <div class="space-y-4 pt-2">
                    <div class="relative"><input id="mAmt" type="number" placeholder="0.00" class="w-full text-4xl font-black bg-slate-50 rounded-2xl p-6 outline-none text-emerald-600 placeholder-emerald-200"><span class="absolute right-6 top-1/2 -translate-y-1/2 font-black text-emerald-300">ALL</span></div>
                    <div class="grid grid-cols-2 gap-3">
                        <select id="mCat" class="bg-slate-100 p-4 rounded-2xl outline-none text-xs font-black uppercase">${incomeCats.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}</select>
                        <select id="mAcc" class="bg-slate-100 p-4 rounded-2xl outline-none text-xs font-black uppercase">${accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('')}</select>
                    </div>
                    <input id="mDesc" type="text" placeholder="Shënim" class="w-full bg-slate-50 p-4 rounded-2xl outline-none border border-slate-100 text-sm font-bold">
                    <div class="flex gap-2 pt-4"><button onclick="closeModal()" class="flex-1 py-4 font-bold text-slate-400">Anulo</button><button id="mSubmit" class="flex-[2] bg-emerald-600 text-white py-4 rounded-2xl font-black">KRYEJ</button></div>
                </div>
            `);
            document.getElementById('mSubmit').onclick = () => handleTransaction('income');
        };

        document.getElementById('openExpenseBtn').onclick = () => {
            const expCats = categories.filter(c => c.type === 'expense');
            showModal(`
                <h2 class="text-xl font-black text-red-600">Shpenzim i Ri</h2>
                <div class="space-y-4 pt-2">
                    <div class="relative"><input id="mAmt" type="number" placeholder="0.00" class="w-full text-4xl font-black bg-slate-50 rounded-2xl p-6 outline-none text-red-600 placeholder-red-200"><span class="absolute right-6 top-1/2 -translate-y-1/2 font-black text-red-300">ALL</span></div>
                    <div class="grid grid-cols-2 gap-3">
                        <select id="mCat" class="bg-slate-100 p-4 rounded-2xl outline-none text-xs font-black uppercase">${expCats.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}</select>
                        <select id="mAcc" class="bg-slate-100 p-4 rounded-2xl outline-none text-xs font-black uppercase">${accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('')}</select>
                    </div>
                    <input id="mDesc" type="text" placeholder="Ku u shpenzuan?" class="w-full bg-slate-50 p-4 rounded-2xl outline-none border border-slate-100 text-sm font-bold">
                    <div class="flex gap-2 pt-4"><button onclick="closeModal()" class="flex-1 py-4 font-bold text-slate-400">Anulo</button><button id="mSubmit" class="flex-[2] bg-red-600 text-white py-4 rounded-2xl font-black">RUAJ</button></div>
                </div>
            `);
            document.getElementById('mSubmit').onclick = () => handleTransaction('expense');
        };

        document.getElementById('openTransferBtn').onclick = () => {
            showModal(`
                <h2 class="text-xl font-black text-blue-600 text-center">Transfertë / Larje Borxhi</h2>
                <div class="space-y-4 pt-2">
                    <div class="relative"><input id="mAmt" type="number" placeholder="0.00" class="w-full text-4xl font-black bg-slate-50 rounded-2xl p-6 outline-none text-blue-600"></div>
                    <div class="grid grid-cols-2 gap-3">
                        <select id="mAccFrom" class="bg-slate-100 p-4 rounded-2xl outline-none text-[10px] font-black uppercase"><option value="">Nga</option>${accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('')}</select>
                        <select id="mAccTo" class="bg-slate-100 p-4 rounded-2xl outline-none text-[10px] font-black uppercase"><option value="">Tek Borxhi</option>${accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('')}</select>
                    </div>
                    <div class="flex gap-2 pt-4"><button onclick="closeModal()" class="flex-1 py-4 font-bold text-slate-400">Anulo</button><button id="mSubmit" class="flex-[2] bg-blue-600 text-white py-4 rounded-2xl font-black">TRANSFERO</button></div>
                </div>
            `);
            document.getElementById('mSubmit').onclick = handleTransfer;
        };

        async function handleTransaction(type) {
            const amt = Number(document.getElementById('mAmt').value);
            const catId = document.getElementById('mCat').value;
            const accId = document.getElementById('mAcc').value;
            const desc = document.getElementById('mDesc').value;
            const uid = auth.currentUser.uid;
            if (!amt || !accId) return;
            const acc = accounts.find(a => a.id === accId);
            const newBalance = type === 'income' ? Number(acc.balance) + amt : Number(acc.balance) - amt;
            const userPath = `artifacts/lindibank/users/${uid}`;
            await updateDoc(doc(db, `${userPath}/accounts`, accId), { balance: newBalance });
            await addDoc(collection(db, `${userPath}/transactions`), { type, amount: amt, catId, accId, desc, timestamp: Date.now() });
            closeModal();
        }

        async function handleTransfer() {
            const amt = Number(document.getElementById('mAmt').value);
            const fromId = document.getElementById('mAccFrom').value;
            const toId = document.getElementById('mAccTo').value;
            const uid = auth.currentUser.uid;
            if(!amt || !fromId || !toId) return;
            const fromAcc = accounts.find(a => a.id === fromId);
            const toAcc = accounts.find(a => a.id === toId);
            const userPath = `artifacts/lindibank/users/${uid}`;
            await updateDoc(doc(db, `${userPath}/accounts`, fromId), { balance: Number(fromAcc.balance) - amt });
            await updateDoc(doc(db, `${userPath}/accounts`, toId), { balance: Number(toAcc.balance) + amt });
            await addDoc(collection(db, `${userPath}/transactions`), { type: 'transfer', amount: amt, fromId, toId, timestamp: Date.now() });
            closeModal();
        }

        // --- MANAGE SYSTEM ---
        document.getElementById('openManageBtn').onclick = () => {
            showModal(`
                <div class="flex justify-between items-center pb-4 border-b">
                    <h2 class="text-xl font-black">Konfigurimet</h2>
                    <button onclick="closeModal()" class="text-slate-400 p-2"><i data-lucide="x"></i></button>
                </div>
                <div class="space-y-8 pt-6 pb-12">
                    <!-- Section: Budget -->
                    <section class="space-y-3">
                        <h3 class="text-[10px] font-black text-indigo-600 uppercase tracking-[0.2em]">Plani i Buxhetit</h3>
                        <div class="flex gap-2">
                            <input id="budgetInput" type="number" value="${monthlyBudget}" placeholder="Limiti mujor..." class="flex-1 p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none font-bold">
                            <button id="saveBudget" class="bg-indigo-600 text-white px-6 rounded-2xl font-black">RUAJ</button>
                        </div>
                    </section>

                    <!-- Section: Accounts -->
                    <section class="space-y-3">
                        <h3 class="text-[10px] font-black text-indigo-600 uppercase tracking-[0.2em]">Llogaritë e Parasë</h3>
                        <div id="mAccList" class="space-y-2"></div>
                        <button id="showAddAcc" class="w-full py-3 bg-slate-100 rounded-xl text-slate-500 font-bold text-xs uppercase">+ Shto Llogari</button>
                        <div id="addAccForm" class="hidden p-4 bg-indigo-50/50 border border-indigo-100 rounded-2xl space-y-3">
                            <input id="newAccName" placeholder="Emri..." class="w-full p-3 rounded-xl border-none font-bold text-sm">
                            <div class="grid grid-cols-2 gap-2">
                                <select id="newAccType" class="p-3 rounded-xl border-none bg-white text-xs font-bold">
                                    <option value="asset">Pasuri</option>
                                    <option value="debt">Borxh</option>
                                </select>
                                <input id="newAccLimit" type="number" placeholder="Limit borxhi" class="p-3 rounded-xl border-none text-sm font-bold">
                            </div>
                            <button id="submitAcc" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-black text-sm">KRIJO</button>
                        </div>
                    </section>

                    <!-- Section: Categories -->
                    <section class="space-y-3">
                        <h3 class="text-[10px] font-black text-indigo-600 uppercase tracking-[0.2em]">Kategoritë e Shpenzimeve</h3>
                        <div id="mCatList" class="space-y-2"></div>
                        <div class="flex gap-2">
                            <input id="newCatName" placeholder="Emër kategorie..." class="flex-1 p-3 bg-slate-50 border border-slate-100 rounded-xl outline-none font-bold text-sm">
                            <button id="submitCat" class="bg-indigo-600 text-white px-5 rounded-xl font-black"><i data-lucide="plus"></i></button>
                        </div>
                    </section>
                </div>
            `, true);
            renderManageContent();
            
            // Event Listeners for Manage
            document.getElementById('saveBudget').onclick = async () => {
                const amt = Number(document.getElementById('budgetInput').value);
                await setDoc(doc(db, `artifacts/lindibank/users/${auth.currentUser.uid}/settings`, 'budget'), { amount: amt });
                alert("Buxheti u ruajt!");
            };

            document.getElementById('showAddAcc').onclick = () => document.getElementById('addAccForm').classList.toggle('hidden');
            
            document.getElementById('submitAcc').onclick = async () => {
                const name = document.getElementById('newAccName').value;
                const type = document.getElementById('newAccType').value;
                const limit = Number(document.getElementById('newAccLimit').value) || 0;
                if(!name) return;
                await addDoc(collection(db, `artifacts/lindibank/users/${auth.currentUser.uid}/accounts`), { name, type, limit, balance: 0 });
                document.getElementById('addAccForm').classList.add('hidden');
            };

            document.getElementById('submitCat').onclick = async () => {
                const name = document.getElementById('newCatName').value;
                if(!name) return;
                await addDoc(collection(db, `artifacts/lindibank/users/${auth.currentUser.uid}/categories`), { name, type: 'expense' });
                document.getElementById('newCatName').value = '';
            };
        };

        function renderManageContent() {
            // Render Accounts in Manage
            const accList = document.getElementById('mAccList');
            if(accList) {
                accList.innerHTML = '';
                accounts.forEach(acc => {
                    const div = document.createElement('div');
                    div.className = "flex items-center gap-2 bg-white p-3 rounded-xl border border-slate-100 shadow-sm animate-in";
                    if (editingAccId === acc.id) {
                        div.innerHTML = `
                            <div class="flex flex-col gap-2 w-full">
                                <input id="edit-acc-name-${acc.id}" class="p-2 border rounded-lg font-bold" value="${acc.name}">
                                <div class="flex gap-2">
                                    <button onclick="window.saveAcc('${acc.id}', '${acc.type}')" class="flex-1 bg-emerald-500 text-white p-2 rounded-lg font-bold"><i data-lucide="check" class="mx-auto"></i></button>
                                    <button onclick="window.cancelEdit()" class="flex-1 bg-slate-300 text-white p-2 rounded-lg font-bold"><i data-lucide="x" class="mx-auto"></i></button>
                                </div>
                            </div>
                        `;
                    } else {
                        div.innerHTML = `
                            <div class="flex-1"><p class="font-bold text-sm">${acc.name}</p></div>
                            <button onclick="window.editAcc('${acc.id}')" class="p-2 text-blue-500"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                            <button onclick="window.delAcc('${acc.id}', '${acc.name}')" class="p-2 text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        `;
                    }
                    accList.appendChild(div);
                });
            }

            // Render Categories in Manage
            const catList = document.getElementById('mCatList');
            if(catList) {
                catList.innerHTML = '';
                categories.filter(c => c.type === 'expense').forEach(cat => {
                    const div = document.createElement('div');
                    div.className = "flex items-center gap-2 bg-white p-3 rounded-xl border border-slate-100 shadow-sm animate-in";
                    if (editingCatId === cat.id) {
                        div.innerHTML = `
                            <input id="edit-cat-name-${cat.id}" class="flex-1 p-2 border rounded-lg font-bold" value="${cat.name}">
                            <button onclick="window.saveCat('${cat.id}')" class="p-2 text-emerald-500"><i data-lucide="check"></i></button>
                            <button onclick="window.cancelEdit()" class="p-2 text-slate-400"><i data-lucide="x"></i></button>
                        `;
                    } else {
                        div.innerHTML = `
                            <p class="flex-1 font-bold text-sm text-slate-600">${cat.name}</p>
                            <button onclick="window.editCat('${cat.id}')" class="p-2 text-blue-400"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                            <button onclick="window.delCat('${cat.id}', '${cat.name}')" class="p-2 text-red-300"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        `;
                    }
                    catList.appendChild(div);
                });
            }
            lucide.createIcons();
        }

        // Global functions for Manage dynamic buttons
        window.editAcc = (id) => { editingAccId = id; renderManageContent(); };
        window.editCat = (id) => { editingCatId = id; renderManageContent(); };
        window.cancelEdit = () => { editingAccId = null; editingCatId = null; renderManageContent(); };

        window.saveAcc = async (id, type) => {
            const name = document.getElementById(`edit-acc-name-${id}`).value;
            if(!name) return;
            await updateDoc(doc(db, `artifacts/lindibank/users/${auth.currentUser.uid}/accounts`, id), { name });
            editingAccId = null;
        };

        window.saveCat = async (id) => {
            const name = document.getElementById(`edit-cat-name-${id}`).value;
            if(!name) return;
            await updateDoc(doc(db, `artifacts/lindibank/users/${auth.currentUser.uid}/categories`, id), { name });
            editingCatId = null;
        };

        window.delAcc = (id, name) => {
            askConfirm("Fshij Llogarinë", `Dëshironi të fshini "${name}"?`, async () => {
                await deleteDoc(doc(db, `artifacts/lindibank/users/${auth.currentUser.uid}/accounts`, id));
            });
        };

        window.delCat = (id, name) => {
            askConfirm("Fshij Kategorinë", `Dëshironi të fshini kategorinë "${name}"?`, async () => {
                await deleteDoc(doc(db, `artifacts/lindibank/users/${auth.currentUser.uid}/categories`, id));
            });
        };

        lucide.createIcons();
    </script>
</body>
</html>
