<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LindiBank Pro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK v8 (Më i thjeshti për GitHub Pages) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- React Production Build -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #4f46e5; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error-box { background: #fee2e2; color: #b91c1c; padding: 1rem; border-radius: 1rem; border: 1px solid #fecaca; margin: 20px; text-align: center; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root">
        <div class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
            <div class="spinner mb-4"></div>
            <p id="loading-text" class="text-slate-400 font-bold text-xs uppercase tracking-widest">Po inicializohet LindiBank...</p>
        </div>
    </div>

    <script>
        // Konfigurimi i saktë i Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDYBGLntW97ZXLORlpLqcORfNHB0l13rIQ",
            authDomain: "lindibank-a0e78.firebaseapp.com",
            projectId: "lindibank-a0e78",
            storageBucket: "lindibank-a0e78.firebasestorage.app",
            messagingSenderId: "90807575787",
            appId: "1:90807575787:web:82fbd5320e056f8b1d0aae",
            measurementId: "G-105LE2EWQ8"
        };

        // Funksioni për të nisur aplikacionin
        function startApp() {
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                const auth = firebase.auth();
                const db = firebase.firestore();
                renderReactApp(auth, db);
            } catch (err) {
                document.getElementById('root').innerHTML = `
                    <div class="error-box">
                        <p class="font-bold">Gabim në lidhjen me Firebase!</p>
                        <p class="text-xs mt-2">${err.message}</p>
                    </div>
                `;
            }
        }

        function renderReactApp(auth, db) {
            const { useState, useEffect, useMemo } = React;
            const appId = "finance-manager-v1";

            const App = () => {
                const [user, setUser] = useState(null);
                const [loading, setLoading] = useState(true);
                const [authMode, setAuthMode] = useState('login');
                const [email, setEmail] = useState('');
                const [password, setPassword] = useState('');
                const [error, setError] = useState('');
                
                const [accounts, setAccounts] = useState([]);
                const [transactions, setTransactions] = useState([]);
                const [activeTab, setActiveTab] = useState('overview');

                useEffect(() => {
                    return auth.onAuthStateChanged(u => {
                        setUser(u);
                        setLoading(false);
                        setTimeout(() => lucide.createIcons(), 100);
                    });
                }, []);

                useEffect(() => {
                    if (!user) return;
                    const path = `artifacts/${appId}/users/${user.uid}`;
                    
                    const unsubAcc = db.collection(`${path}/accounts`).onSnapshot(s => {
                        setAccounts(s.docs.map(d => ({id: d.id, ...d.data()})));
                    });
                    const unsubTrans = db.collection(`${path}/transactions`).onSnapshot(s => {
                        setTransactions(s.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => b.timestamp - a.timestamp));
                    });

                    return () => { unsubAcc(); unsubTrans(); };
                }, [user]);

                const handleAuth = async (e) => {
                    e.preventDefault();
                    setError('');
                    try {
                        if (authMode === 'login') await auth.signInWithEmailAndPassword(email, password);
                        else if (authMode === 'register') await auth.createUserWithEmailAndPassword(email, password);
                        else { await auth.sendPasswordResetEmail(email); alert("Email u dërgua!"); }
                    } catch (err) { setError("Veprimi dështoi. Kontrolloni kredencialet."); }
                };

                const totals = useMemo(() => {
                    const a = accounts.filter(x => x.type === 'asset').reduce((s, x) => s + (Number(x.balance) || 0), 0);
                    const d = accounts.filter(x => x.type === 'debt').reduce((s, x) => s + (Number(x.balance) || 0), 0);
                    return { a, d, net: a + d };
                }, [accounts]);

                if (loading) return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6">
                        <div className="spinner mb-4"></div>
                        <p className="text-slate-400 font-bold text-[10px] uppercase">Po ngarkon profilin...</p>
                    </div>
                );

                if (!user) return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-indigo-600">
                        <div className="bg-white w-full max-w-sm rounded-[32px] p-10 shadow-2xl">
                            <div className="flex flex-col items-center mb-8">
                                <div className="bg-indigo-600 p-3 rounded-2xl text-white mb-3">
                                    <i data-lucide="wallet"></i>
                                </div>
                                <h2 className="text-2xl font-black text-slate-800 tracking-tight">LindiBank</h2>
                            </div>
                            <form onSubmit={handleAuth} className="space-y-3">
                                <input type="email" placeholder="Email" required className="w-full p-4 bg-slate-50 rounded-2xl font-bold text-sm outline-none" value={email} onChange={e => setEmail(e.target.value)} />
                                {authMode !== 'reset' && <input type="password" placeholder="Fjalëkalimi" required className="w-full p-4 bg-slate-50 rounded-2xl font-bold text-sm outline-none" value={password} onChange={e => setPassword(e.target.value)} />}
                                {error && <p className="text-red-500 text-[10px] font-bold text-center">{error}</p>}
                                <button className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black text-sm shadow-lg active:scale-95 transition-all uppercase">
                                    {authMode === 'login' ? 'Kyçu' : authMode === 'register' ? 'Regjistrohu' : 'Dërgo'}
                                </button>
                            </form>
                            <div className="mt-6 flex flex-col items-center gap-2">
                                <button onClick={() => setAuthMode(authMode==='login'?'register':'login')} className="text-[11px] font-bold text-indigo-600">
                                    {authMode === 'login' ? 'Krijo llogari' : 'Kthehu prapa'}
                                </button>
                            </div>
                        </div>
                    </div>
                );

                return (
                    <div className="min-h-screen pb-20 bg-slate-50">
                        <div className="bg-white border-b p-4 sticky top-0 z-30 flex justify-between items-center px-6">
                            <div className="flex items-center gap-2 font-black text-indigo-600 text-lg uppercase tracking-tighter">
                                <i data-lucide="wallet" size="20"></i> LindiBank
                            </div>
                            <button onClick={() => auth.signOut()} className="p-2 bg-red-50 text-red-500 rounded-full active:scale-90 transition-all">
                                <i data-lucide="log-out" size="18"></i>
                            </button>
                        </div>

                        <div className="p-6 max-w-lg mx-auto space-y-6">
                            <div className="bg-indigo-600 rounded-[35px] p-8 text-white shadow-xl shadow-indigo-100">
                                <p className="text-[10px] font-bold uppercase opacity-60 tracking-widest">Gjendja Neto</p>
                                <h2 className="text-4xl font-black mt-2 tracking-tight">{totals.net.toLocaleString()} ALL</h2>
                                <div className="flex justify-between mt-8 pt-6 border-t border-indigo-500/30">
                                    <div><p className="text-[9px] opacity-60 uppercase font-black">Pasuri</p><p className="font-bold text-sm">{totals.a.toLocaleString()}</p></div>
                                    <div className="text-right"><p className="text-[9px] opacity-60 uppercase font-black">Borxhe</p><p className="font-bold text-sm text-indigo-200">{totals.d.toLocaleString()}</p></div>
                                </div>
                            </div>

                            {activeTab === 'overview' ? (
                                <div className="space-y-3">
                                    <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Llogaritë</h3>
                                    {accounts.map(a => (
                                        <div key={a.id} className="bg-white p-5 rounded-[28px] border border-slate-100 flex justify-between items-center shadow-sm">
                                            <span className="font-bold text-slate-700 text-sm">{a.name}</span>
                                            <span className={`font-black ${a.balance < 0 ? 'text-red-500' : 'text-emerald-600'}`}>{a.balance.toLocaleString()} ALL</span>
                                        </div>
                                    ))}
                                    {accounts.length === 0 && <p className="text-center text-slate-400 text-xs py-10 font-bold uppercase">Nuk ka të dhëna.</p>}
                                </div>
                            ) : (
                                <div className="space-y-2">
                                    {transactions.map(t => (
                                        <div key={t.id} className="bg-white p-4 rounded-2xl border border-slate-100 flex justify-between items-center">
                                            <div>
                                                <p className="text-xs font-bold text-slate-700">{t.desc || 'Transaksion'}</p>
                                                <p className="text-[9px] text-slate-400 font-black uppercase">{t.date}</p>
                                            </div>
                                            <div className={`font-black text-sm ${t.type==='expense'?'text-red-500':'text-emerald-600'}`}>
                                                {t.type==='expense'?'-':'+'}{t.amount.toLocaleString()}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        <div className="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-4 z-40">
                            <button onClick={() => setActiveTab('overview')} className={`flex flex-col items-center gap-1 ${activeTab==='overview'?'text-indigo-600':'text-slate-300'}`}>
                                <i data-lucide="layout-grid" size="24"></i>
                                <span className="text-[9px] font-black uppercase tracking-tighter">Kreu</span>
                            </button>
                            <button onClick={() => setActiveTab('history')} className={`flex flex-col items-center gap-1 ${activeTab==='history'?'text-indigo-600':'text-slate-300'}`}>
                                <i data-lucide="list" size="24"></i>
                                <span className="text-[9px] font-black uppercase tracking-tighter">Historia</span>
                            </button>
                        </div>
                    </div>
                );
            };

            const root = ReactDOM.createRoot(document.getElementById("root"));
            root.render(React.createElement(App));
        }

        // Nisje e kontrolluar: Pret që dritarja të ngarkohet plotësisht
        window.onload = startApp;
    </script>
</body>
</html>
