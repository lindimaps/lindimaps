<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financat e Mia - Full App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.321.0/dist/umd/lucide.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // Firebase Mock/Stub for the Environment
        // Në projektin tuaj në GitHub, zëvendësoni këto me importet reale të Firebase nëse përdorni module
        // Ose përdorni scriptet e Firebase CDN nëse doni ta mbani në një skedar.
        
        const App = () => {
            // --- STATE ---
            const [activeTab, setActiveTab] = useState('overview');
            const [isLoading, setIsLoading] = useState(false);
            
            // Data State
            const [accounts, setAccounts] = useState([
                { id: '1', name: 'Debit Card', balance: 45000, type: 'asset', limit: 0 },
                { id: '2', name: 'Overdraft', balance: -12000, type: 'debt', limit: 50000 },
                { id: '3', name: 'Credit Card', balance: -34000, type: 'debt', limit: 100000 },
                { id: '4', name: 'Kursime', balance: 120000, type: 'asset', limit: 0 },
                { id: '5', name: 'Cash', balance: 5400, type: 'asset', limit: 0 },
            ]);

            const [expenseCategories, setExpenseCategories] = useState([
                { id: 'ec1', name: 'Shtëpiake' },
                { id: 'ec2', name: 'Shëndet' },
                { id: 'ec3', name: 'Ushqim' },
                { id: 'ec4', name: 'Transport' },
            ]);

            const [incomeCategories, setIncomeCategories] = useState([
                { id: 'ic1', name: 'Rroga' },
                { id: 'ic2', name: 'Qira' },
                { id: 'ic3', name: 'Bonuse' },
            ]);

            const [transactions, setTransactions] = useState([
                { id: 1, type: 'expense', amount: 2500, catId: 'ec3', accId: '1', desc: 'Market', date: '15/05/2024' },
                { id: 2, type: 'income', amount: 85000, catId: 'ic1', accId: '1', desc: 'Rroga Prill', date: '01/05/2024' }
            ]);
            
            // UI State
            const [editingAcc, setEditingAcc] = useState(null);
            const [showExpenseModal, setShowExpenseModal] = useState(false);
            const [showIncomeModal, setShowIncomeModal] = useState(false);
            const [showTransferModal, setShowTransferModal] = useState(false);
            const [showManageModal, setShowManageModal] = useState(false);
            const [confirmModal, setConfirmModal] = useState({ show: false, title: '', message: '', onConfirm: null });

            // Form states
            const [expenseForm, setExpenseForm] = useState({ amount: '', categoryId: '', accountId: '', desc: '' });
            const [incomeForm, setIncomeForm] = useState({ amount: '', categoryId: '', accountId: '', desc: '' });
            const [transferForm, setTransferForm] = useState({ from: '', to: '', amount: '' });
            const [newAccForm, setNewAccForm] = useState({ name: '', type: 'asset', balance: 0, limit: 0 });
            const [newCatForm, setNewCatForm] = useState({ name: '', type: 'expense' });

            // --- CALCULATIONS ---
            const totals = useMemo(() => {
                const assets = accounts.filter(a => a.type === 'asset').reduce((s, a) => s + a.balance, 0);
                const debts = accounts.filter(a => a.type === 'debt').reduce((s, a) => s + a.balance, 0);
                return { assets, debts, net: assets + debts };
            }, [accounts]);

            // --- HANDLERS ---
            const askConfirmation = (title, message, onConfirm) => {
                setConfirmModal({ show: true, title, message, onConfirm });
            };

            const handleAddAccount = () => {
                if (!newAccForm.name.trim()) return;
                setAccounts([...accounts, { 
                    ...newAccForm, 
                    id: Date.now().toString(), 
                    balance: Number(newAccForm.balance), 
                    limit: Number(newAccForm.limit) 
                }]);
                setNewAccForm({ name: '', type: 'asset', balance: 0, limit: 0 });
            };

            const handleDeleteAccount = (id, name) => {
                askConfirmation(
                    "Fshij Llogarinë",
                    `A jeni i sigurt që dëshironi të fshini llogarinë "${name}"?`,
                    () => setAccounts(accounts.filter(a => a.id !== id))
                );
            };

            const handleIncome = (e) => {
                e.preventDefault();
                const amt = parseFloat(incomeForm.amount);
                if (!amt || !incomeForm.accountId) return;
                setAccounts(accounts.map(a => a.id === incomeForm.accountId ? { ...a, balance: a.balance + amt } : a));
                setTransactions([{ id: Date.now(), type: 'income', amount: amt, catId: incomeForm.categoryId, accId: incomeForm.accountId, desc: incomeForm.desc, date: new Date().toLocaleDateString('sq-AL') }, ...transactions]);
                setShowIncomeModal(false);
                setIncomeForm({ amount: '', categoryId: '', accountId: '', desc: '' });
            };

            const handleExpense = (e) => {
                e.preventDefault();
                const amt = parseFloat(expenseForm.amount);
                if (!amt || !expenseForm.accountId) return;
                setAccounts(accounts.map(a => a.id === expenseForm.accountId ? { ...a, balance: a.balance - amt } : a));
                setTransactions([{ id: Date.now(), type: 'expense', amount: amt, catId: expenseForm.categoryId, accId: expenseForm.accountId, desc: expenseForm.desc, date: new Date().toLocaleDateString('sq-AL') }, ...transactions]);
                setShowExpenseModal(false);
                setExpenseForm({ amount: '', categoryId: '', accountId: '', desc: '' });
            };

            // Helpers for Icons
            const Icon = ({ name, size = 20, ...props }) => {
                const LucideIcon = lucide[name.charAt(0).toUpperCase() + name.slice(1)];
                return LucideIcon ? <LucideIcon size={size} {...props} /> : null;
            };

            return (
                <div className="min-h-screen pb-24">
                    {/* Header */}
                    <div className="bg-white border-b p-4 sticky top-0 z-20 shadow-sm">
                        <div className="max-w-2xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <div className="bg-indigo-600 p-2.5 rounded-2xl text-white">
                                    <Icon name="Wallet" />
                                </div>
                                <h1 className="font-bold text-lg">Financat e Mia</h1>
                            </div>
                            <button onClick={() => setShowManageModal(true)} className="p-3 bg-slate-100 rounded-full text-slate-600">
                                <Icon name="Settings2" />
                            </button>
                        </div>
                    </div>

                    <div className="max-w-2xl mx-auto p-4 space-y-6">
                        {/* Card Përmbledhëse */}
                        <div className="bg-gradient-to-br from-indigo-600 to-slate-900 rounded-[36px] p-8 text-white shadow-xl relative overflow-hidden">
                            <div className="relative z-10">
                                <p className="text-[10px] font-bold uppercase opacity-60 tracking-widest">Gjendja Neto</p>
                                <h2 className="text-4xl font-black mt-2 mb-8">{totals.net.toLocaleString()} ALL</h2>
                                <div className="flex justify-between border-t border-white/10 pt-6">
                                    <div>
                                        <p className="text-[9px] font-bold uppercase opacity-40 mb-1">Pasuri</p>
                                        <p className="font-extrabold text-xl">{totals.assets.toLocaleString()}</p>
                                    </div>
                                    <div className="text-right">
                                        <p className="text-[9px] font-bold uppercase opacity-40 mb-1">Detyrime</p>
                                        <p className="font-extrabold text-xl">{totals.debts.toLocaleString()}</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {activeTab === 'overview' ? (
                            <div className="space-y-6 animate-in">
                                <div className="grid grid-cols-3 gap-3">
                                    <button onClick={() => setShowIncomeModal(true)} className="bg-white p-5 rounded-3xl flex flex-col items-center gap-2 border border-slate-100 shadow-sm">
                                        <div className="p-3 bg-emerald-50 rounded-2xl text-emerald-500"><Icon name="ArrowUpCircle" size={24} /></div>
                                        <span className="font-bold text-[9px] uppercase text-slate-500">Hyrje</span>
                                    </button>
                                    <button onClick={() => setShowExpenseModal(true)} className="bg-white p-5 rounded-3xl flex flex-col items-center gap-2 border border-slate-100 shadow-sm">
                                        <div className="p-3 bg-red-50 rounded-2xl text-red-500"><Icon name="TrendingDown" size={24} /></div>
                                        <span className="font-bold text-[9px] uppercase text-slate-500">Dalje</span>
                                    </button>
                                    <button onClick={() => setShowTransferModal(true)} className="bg-white p-5 rounded-3xl flex flex-col items-center gap-2 border border-slate-100 shadow-sm">
                                        <div className="p-3 bg-blue-50 rounded-2xl text-blue-500"><Icon name="ArrowRightLeft" size={24} /></div>
                                        <span className="font-bold text-[9px] uppercase text-slate-500">Transfertë</span>
                                    </button>
                                </div>

                                <section className="space-y-3">
                                    <h3 className="font-bold text-slate-400 text-[10px] uppercase tracking-widest px-1">Llogaritë</h3>
                                    {accounts.map(acc => (
                                        <div key={acc.id} className="bg-white p-6 rounded-[28px] border border-slate-100 flex justify-between items-center shadow-sm">
                                            <div className="flex items-center gap-3">
                                                <div className={`p-2.5 rounded-xl ${acc.type === 'asset' ? 'bg-indigo-50 text-indigo-600' : 'bg-slate-50 text-slate-500'}`}>
                                                    <Icon name={acc.type === 'asset' ? "Wallet" : "CreditCard"} size={18} />
                                                </div>
                                                <div>
                                                    <span className="font-bold text-sm text-slate-800 block">{acc.name}</span>
                                                    <span className="text-[9px] font-bold text-slate-400 uppercase">{acc.type === 'asset' ? 'Pasuri' : 'Detyrim'}</span>
                                                </div>
                                            </div>
                                            <span className={`font-black text-base ${acc.balance < 0 ? 'text-red-500' : 'text-emerald-600'}`}>
                                                {acc.balance.toLocaleString()} ALL
                                            </span>
                                        </div>
                                    ))}
                                </section>
                            </div>
                        ) : (
                            <section className="space-y-3 animate-in">
                                <h3 className="font-bold text-slate-400 text-[10px] uppercase tracking-widest px-1">Lëvizjet e Fundit</h3>
                                {transactions.map(t => (
                                    <div key={t.id} className="bg-white p-5 rounded-3xl border border-slate-100 flex items-center justify-between">
                                        <div className="flex items-center gap-4">
                                            <div className={`p-3 rounded-2xl ${t.type === 'expense' ? 'bg-red-50 text-red-500' : 'bg-emerald-50 text-emerald-500'}`}>
                                                <Icon name={t.type === 'expense' ? 'TrendingDown' : 'TrendingUp'} />
                                            </div>
                                            <div>
                                                <p className="font-bold text-sm text-slate-800">{t.desc || 'Transaksion'}</p>
                                                <p className="text-[9px] text-slate-400 uppercase tracking-widest">{t.date}</p>
                                            </div>
                                        </div>
                                        <p className={`font-black ${t.type === 'expense' ? 'text-red-500' : 'text-emerald-600'}`}>
                                            {t.type === 'expense' ? '-' : '+'}{t.amount.toLocaleString()}
                                        </p>
                                    </div>
                                ))}
                            </section>
                        )}
                    </div>

                    {/* Bottom Nav */}
                    <div className="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-md border-t flex justify-around p-5 z-30">
                        <button onClick={() => setActiveTab('overview')} className={`flex flex-col items-center gap-1 ${activeTab === 'overview' ? 'text-indigo-600' : 'text-slate-400'}`}>
                            <Icon name="LayoutDashboard" size={24} />
                            <span className="text-[8px] font-bold uppercase">Dashboard</span>
                        </button>
                        <button onClick={() => setActiveTab('history')} className={`flex flex-col items-center gap-1 ${activeTab === 'history' ? 'text-indigo-600' : 'text-slate-400'}`}>
                            <Icon name="History" size={24} />
                            <span className="text-[8px] font-bold uppercase">Aktiviteti</span>
                        </button>
                    </div>

                    {/* Simple Modals - Shfaqen sipas State */}
                    {showIncomeModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-sm rounded-[40px] p-8 space-y-6 animate-in">
                                <h2 className="text-xl font-black text-center text-emerald-600">Shto të Ardhura</h2>
                                <form onSubmit={handleIncome} className="space-y-4">
                                    <input type="number" required placeholder="Shuma (ALL)" className="w-full p-4 bg-slate-50 rounded-2xl font-bold" value={incomeForm.amount} onChange={e => setIncomeForm({...incomeForm, amount: e.target.value})} />
                                    <select className="w-full p-4 bg-slate-50 rounded-2xl font-bold" required value={incomeForm.accountId} onChange={e => setIncomeForm({...incomeForm, accountId: e.target.value})}>
                                        <option value="">Zgjidh Llogarinë</option>
                                        {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                                    </select>
                                    <button type="submit" className="w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold">KONFIRMO</button>
                                    <button type="button" onClick={() => setShowIncomeModal(false)} className="w-full text-slate-400 font-bold text-xs uppercase">Anulo</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {showExpenseModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-sm rounded-[40px] p-8 space-y-6 animate-in">
                                <h2 className="text-xl font-black text-center text-red-600">Shto Shpenzim</h2>
                                <form onSubmit={handleExpense} className="space-y-4">
                                    <input type="number" required placeholder="Shuma (ALL)" className="w-full p-4 bg-slate-50 rounded-2xl font-bold" value={expenseForm.amount} onChange={e => setExpenseForm({...expenseForm, amount: e.target.value})} />
                                    <select className="w-full p-4 bg-slate-50 rounded-2xl font-bold" required value={expenseForm.accountId} onChange={e => setExpenseForm({...expenseForm, accountId: e.target.value})}>
                                        <option value="">Nga Llogaria</option>
                                        {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                                    </select>
                                    <button type="submit" className="w-full bg-red-600 text-white py-4 rounded-2xl font-bold">KONFIRMO</button>
                                    <button type="button" onClick={() => setShowExpenseModal(false)} className="w-full text-slate-400 font-bold text-xs uppercase">Anulo</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
