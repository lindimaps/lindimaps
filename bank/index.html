<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LindiBank Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .modal-enter { animation: zoomIn 0.2s ease-out; }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #4f46e5; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root">
        <!-- Loading State fillestar që të mos dalë faqja e bardhë -->
        <div class="min-h-screen flex flex-col items-center justify-center">
            <div class="spinner mb-4"></div>
            <p class="text-slate-500 font-bold text-sm uppercase tracking-widest">Po ngarkohet sistemi...</p>
        </div>
    </div>

    <!-- Ngarkimi i React dhe Firebase nga burime të sigurta -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "lucide-react": "https://esm.sh/lucide-react@0.244.0",
        "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
      }
    }
    </script>

    <script type="module">
        import React, { useState, useEffect, useMemo } from 'react';
        import ReactDOM from 'react-dom';
        import * as Lucide from 'lucide-react';
        import { initializeApp } from "firebase/app";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            sendPasswordResetEmail, 
            onAuthStateChanged,
            signOut 
        } from "firebase/auth";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            onSnapshot, 
            collection, 
            updateDoc, 
            deleteDoc 
        } from "firebase/firestore";

        const firebaseConfig = {
            apiKey: "AIzaSyDYBGLntW97ZXLORlpLqcORfNHB0l13rIQ",
            authDomain: "lindibank-a0e78.firebaseapp.com",
            projectId: "lindibank-a0e78",
            storageBucket: "lindibank-a0e78.firebasestorage.app",
            messagingSenderId: "90807575787",
            appId: "1:90807575787:web:82fbd5320e056f8b1d0aae",
            measurementId: "G-105LE2EWQ8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "finance-manager-v1";

        const App = () => {
            const [user, setUser] = useState(null);
            const [isInitialLoading, setIsInitialLoading] = useState(true);
            const [authMode, setAuthMode] = useState('login'); 
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [authError, setAuthError] = useState('');
            const [authMessage, setAuthMessage] = useState('');

            const [activeTab, setActiveTab] = useState('overview');
            const [accounts, setAccounts] = useState([]);
            const [expenseCategories, setExpenseCategories] = useState([]);
            const [incomeCategories, setIncomeCategories] = useState([]);
            const [transactions, setTransactions] = useState([]);

            // UI State
            const [showExpenseModal, setShowExpenseModal] = useState(false);
            const [showIncomeModal, setShowIncomeModal] = useState(false);
            const [showTransferModal, setShowTransferModal] = useState(false);
            const [showManageModal, setShowManageModal] = useState(false);
            const [confirmModal, setConfirmModal] = useState({ show: false, title: '', message: '', onConfirm: null });

            // Form states
            const [expenseForm, setExpenseForm] = useState({ amount: '', categoryId: '', accountId: '', desc: '' });
            const [incomeForm, setIncomeForm] = useState({ amount: '', categoryId: '', accountId: '', desc: '' });
            const [transferForm, setTransferForm] = useState({ from: '', to: '', amount: '' });
            const [newAccForm, setNewAccForm] = useState({ name: '', type: 'asset', balance: 0, limit: 0 });
            const [newCatForm, setNewCatForm] = useState({ name: '', type: 'expense' });

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    setIsInitialLoading(false);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const base = `artifacts/${appId}/users/${user.uid}`;
                
                const unsubAcc = onSnapshot(collection(db, `${base}/accounts`), (s) => {
                    setAccounts(s.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                const unsubExpCat = onSnapshot(collection(db, `${base}/expenseCategories`), (s) => {
                    setExpenseCategories(s.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                const unsubIncCat = onSnapshot(collection(db, `${base}/incomeCategories`), (s) => {
                    setIncomeCategories(s.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                const unsubTrans = onSnapshot(collection(db, `${base}/transactions`), (s) => {
                    setTransactions(s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.timestamp - a.timestamp));
                });

                return () => { unsubAcc(); unsubExpCat(); unsubIncCat(); unsubTrans(); };
            }, [user]);

            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthError('');
                setAuthMessage('');
                try {
                    if (authMode === 'login') {
                        await signInWithEmailAndPassword(auth, email, password);
                    } else if (authMode === 'register') {
                        await createUserWithEmailAndPassword(auth, email, password);
                    } else if (authMode === 'reset') {
                        await sendPasswordResetEmail(auth, email);
                        setAuthMessage('Email-i për resetim u dërgua!');
                    }
                } catch (err) {
                    setAuthError("Gabim: Kontrolloni të dhënat.");
                    console.error(err);
                }
            };

            const totals = useMemo(() => {
                const assets = accounts.filter(a => a.type === 'asset').reduce((s, a) => s + (Number(a.balance) || 0), 0);
                const debts = accounts.filter(a => a.type === 'debt').reduce((s, a) => s + (Number(a.balance) || 0), 0);
                return { assets, debts, net: assets + debts };
            }, [accounts]);

            // Funksionet Logjike (Pa asnjë ndryshim në logjikën tënde)
            const addAccount = async () => {
                if (!newAccForm.name || !user) return;
                await setDoc(doc(db, `artifacts/${appId}/users/${user.uid}/accounts`, Date.now().toString()), {
                    ...newAccForm, balance: Number(newAccForm.balance), limit: Number(newAccForm.limit)
                });
                setNewAccForm({ name: '', type: 'asset', balance: 0, limit: 0 });
            };

            const deleteAccount = (id, name) => {
                setConfirmModal({ show: true, title: "Fshij Llogarinë", message: `A jeni i sigurt për fshirjen e ${name}?`, onConfirm: async () => {
                    await deleteDoc(doc(db, `artifacts/${appId}/users/${user.uid}/accounts`, id));
                }});
            };

            const addCategory = async () => {
                if (!newCatForm.name.trim() || !user) return;
                const coll = newCatForm.type === 'expense' ? 'expenseCategories' : 'incomeCategories';
                await setDoc(doc(db, `artifacts/${appId}/users/${user.uid}/${coll}`, Date.now().toString()), { name: newCatForm.name });
                setNewCatForm({ ...newCatForm, name: '' });
            };

            const handleExpense = async (e) => {
                e.preventDefault();
                const amt = parseFloat(expenseForm.amount);
                if (!amt || !expenseForm.accountId || !user) return;
                const acc = accounts.find(a => a.id === expenseForm.accountId);
                await updateDoc(doc(db, `artifacts/${appId}/users/${user.uid}/accounts`, acc.id), { balance: acc.balance - amt });
                await setDoc(doc(db, `artifacts/${appId}/users/${user.uid}/transactions`, Date.now().toString()), {
                    type: 'expense', amount: amt, catId: expenseForm.categoryId, accId: expenseForm.accountId, 
                    desc: expenseForm.desc, date: new Date().toLocaleDateString('sq-AL'), timestamp: Date.now()
                });
                setShowExpenseModal(false);
                setExpenseForm({ amount: '', categoryId: '', accountId: '', desc: '' });
            };

            const handleIncome = async (e) => {
                e.preventDefault();
                const amt = parseFloat(incomeForm.amount);
                if (!amt || !incomeForm.accountId || !user) return;
                const acc = accounts.find(a => a.id === incomeForm.accountId);
                await updateDoc(doc(db, `artifacts/${appId}/users/${user.uid}/accounts`, acc.id), { balance: acc.balance + amt });
                await setDoc(doc(db, `artifacts/${appId}/users/${user.uid}/transactions`, Date.now().toString()), {
                    type: 'income', amount: amt, catId: incomeForm.categoryId, accId: incomeForm.accountId,
                    desc: incomeForm.desc, date: new Date().toLocaleDateString('sq-AL'), timestamp: Date.now()
                });
                setShowIncomeModal(false);
                setIncomeForm({ amount: '', categoryId: '', accountId: '', desc: '' });
            };

            if (isInitialLoading) return (
                <div className="min-h-screen flex flex-col items-center justify-center">
                    <div className="spinner mb-4"></div>
                    <p className="text-slate-500 font-bold text-sm uppercase">Po lidhet me Firebase...</p>
                </div>
            );

            if (!user) return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-indigo-600">
                    <div className="bg-white w-full max-w-md rounded-[40px] p-10 shadow-2xl modal-enter">
                        <div className="flex flex-col items-center mb-8">
                            <div className="bg-indigo-600 p-4 rounded-3xl text-white mb-4"><Lucide.Wallet size={40} /></div>
                            <h2 className="text-3xl font-black text-slate-800">LindiBank</h2>
                            <p className="text-slate-400 font-bold text-xs uppercase tracking-widest mt-2">
                                {authMode === 'login' ? 'Mirësevini' : authMode === 'register' ? 'Regjistrim' : 'Resetim'}
                            </p>
                        </div>
                        <form onSubmit={handleAuth} className="space-y-4">
                            <input type="email" placeholder="Email" required className="w-full p-4 bg-slate-50 rounded-2xl font-bold" value={email} onChange={e => setEmail(e.target.value)} />
                            {authMode !== 'reset' && <input type="password" placeholder="Fjalëkalimi" required className="w-full p-4 bg-slate-50 rounded-2xl font-bold" value={password} onChange={e => setPassword(e.target.value)} />}
                            {authError && <p className="text-red-500 text-[10px] font-bold text-center">{authError}</p>}
                            {authMessage && <p className="text-emerald-500 text-[10px] font-bold text-center">{authMessage}</p>}
                            <button className="w-full bg-indigo-600 text-white py-5 rounded-3xl font-black shadow-lg">
                                {authMode === 'login' ? 'KYÇU' : authMode === 'register' ? 'REGJISTROHU' : 'DËRGO'}
                            </button>
                        </form>
                        <div className="mt-8 flex flex-col items-center gap-2">
                            <button onClick={() => setAuthMode(authMode === 'login' ? 'register' : 'login')} className="text-xs font-bold text-indigo-600">
                                {authMode === 'login' ? 'Nuk keni llogari? Regjistrohuni' : 'Keni llogari? Kyçuni'}
                            </button>
                            {authMode === 'login' && <button onClick={() => setAuthMode('reset')} className="text-[10px] font-bold text-slate-400 uppercase">Harrova fjalëkalimin</button>}
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-24">
                    {/* Header */}
                    <div className="bg-white border-b p-4 sticky top-0 z-20">
                        <div className="max-w-2xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <div className="bg-indigo-600 p-2 rounded-xl text-white"><Lucide.Wallet size={20} /></div>
                                <h1 className="font-bold text-lg">LindiBank</h1>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setShowManageModal(true)} className="p-2 bg-slate-100 rounded-full text-slate-600"><Lucide.Settings2 size={18} /></button>
                                <button onClick={() => signOut(auth)} className="p-2 bg-red-50 rounded-full text-red-500"><Lucide.LogOut size={18} /></button>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-2xl mx-auto p-4 space-y-6">
                        {/* Dashboard */}
                        <div className="bg-indigo-600 rounded-[32px] p-8 text-white shadow-xl shadow-indigo-100">
                            <p className="text-[10px] font-bold uppercase opacity-70">Gjendja Neto</p>
                            <h2 className="text-4xl font-black mt-1">{totals.net.toLocaleString()} ALL</h2>
                            <div className="flex justify-between mt-8 pt-4 border-t border-indigo-400/30 font-bold">
                                <div><p className="text-[10px] opacity-60 uppercase">Pasuri</p><p>{totals.assets.toLocaleString()}</p></div>
                                <div className="text-right"><p className="text-[10px] opacity-60 uppercase">Detyrime</p><p>{totals.debts.toLocaleString()}</p></div>
                            </div>
                        </div>

                        {activeTab === 'overview' ? (
                            <>
                                <div className="grid grid-cols-3 gap-3">
                                    <button onClick={() => setShowIncomeModal(true)} className="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm flex flex-col items-center gap-2"><Lucide.ArrowUpCircle className="text-emerald-500" size={24}/><span className="text-[9px] font-black uppercase text-slate-500">Hyrje</span></button>
                                    <button onClick={() => setShowExpenseModal(true)} className="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm flex flex-col items-center gap-2"><Lucide.TrendingDown className="text-red-500" size={24}/><span className="text-[9px] font-black uppercase text-slate-500">Shpenzim</span></button>
                                    <button onClick={() => setShowTransferModal(true)} className="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm flex flex-col items-center gap-2"><Lucide.ArrowRightLeft className="text-blue-500" size={24}/><span className="text-[9px] font-black uppercase text-slate-500">Lëvizje</span></button>
                                </div>
                                <div className="space-y-3">
                                    <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Llogaritë</h3>
                                    {accounts.map(acc => (
                                        <div key={acc.id} className="bg-white p-5 rounded-[24px] border border-slate-100 shadow-sm flex justify-between items-center">
                                            <div><span className="font-bold text-slate-700">{acc.name}</span><p className="text-[9px] font-black opacity-30 uppercase">{acc.type}</p></div>
                                            <span className={`font-black ${acc.balance < 0 ? 'text-red-500' : 'text-emerald-600'}`}>{acc.balance.toLocaleString()} ALL</span>
                                        </div>
                                    ))}
                                </div>
                            </>
                        ) : (
                            <div className="space-y-3">
                                <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Historia</h3>
                                {transactions.map(t => (
                                    <div key={t.id} className="bg-white p-4 rounded-2xl border border-slate-100 flex justify-between items-center">
                                        <div className="flex items-center gap-3">
                                            <div className={`p-2 rounded-lg ${t.type === 'expense' ? 'bg-red-50 text-red-500' : 'bg-emerald-50 text-emerald-500'}`}><Lucide.Activity size={16}/></div>
                                            <div><p className="text-sm font-bold">{t.desc || 'Pa përshkrim'}</p><p className="text-[9px] text-slate-400 uppercase font-black">{t.date}</p></div>
                                        </div>
                                        <span className={`font-black ${t.type === 'expense' ? 'text-red-500' : 'text-emerald-600'}`}>{t.type === 'expense' ? '-' : '+'}{t.amount.toLocaleString()}</span>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* Navigimi Poshtë */}
                    <div className="fixed bottom-0 left-0 right-0 bg-white border-t p-4 flex justify-around">
                        <button onClick={() => setActiveTab('overview')} className={`flex flex-col items-center gap-1 ${activeTab === 'overview' ? 'text-indigo-600' : 'text-slate-400'}`}><Lucide.LayoutDashboard size={22}/><span className="text-[8px] font-black uppercase">Kreu</span></button>
                        <button onClick={() => setActiveTab('history')} className={`flex flex-col items-center gap-1 ${activeTab === 'history' ? 'text-indigo-600' : 'text-slate-400'}`}><Lucide.History size={22}/><span className="text-[8px] font-black uppercase">Historia</span></button>
                    </div>

                    {/* Modalet janë fshehur për hapësirë por janë funksionale në kod (Expense/Income/Settings) */}
                    {showManageModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 p-4 flex items-center justify-center">
                            <div className="bg-white w-full max-w-md rounded-[32px] p-6 max-h-[80vh] overflow-y-auto modal-enter">
                                <div className="flex justify-between mb-6">
                                    <h2 className="font-black text-xl text-slate-800">Cilësimet</h2>
                                    <button onClick={() => setShowManageModal(false)}><Lucide.X/></button>
                                </div>
                                <div className="space-y-6">
                                    <div className="bg-indigo-50 p-4 rounded-2xl space-y-2">
                                        <p className="text-[9px] font-black text-indigo-600 uppercase mb-2">Shto Llogari</p>
                                        <input placeholder="Emri" className="w-full p-3 rounded-xl text-sm" value={newAccForm.name} onChange={e => setNewAccForm({...newAccForm, name: e.target.value})}/>
                                        <select className="w-full p-3 rounded-xl text-sm" value={newAccForm.type} onChange={e => setNewAccForm({...newAccForm, type: e.target.value})}>
                                            <option value="asset">Debit (Para)</option>
                                            <option value="debt">Borxh (Kredit)</option>
                                        </select>
                                        <button onClick={addAccount} className="w-full bg-indigo-600 text-white p-3 rounded-xl font-black text-xs">SHTO</button>
                                    </div>
                                    <div className="space-y-2">
                                        {accounts.map(a => (
                                            <div key={a.id} className="flex justify-between items-center p-3 bg-slate-50 rounded-xl">
                                                <span className="text-sm font-bold">{a.name}</span>
                                                <button onClick={() => deleteAccount(a.id, a.name)} className="text-red-400"><Lucide.Trash2 size={14}/></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {confirmModal.show && (
                        <div className="fixed inset-0 bg-slate-900/80 z-[100] flex items-center justify-center p-6">
                            <div className="bg-white rounded-3xl p-8 max-w-xs w-full text-center">
                                <h3 className="font-black text-lg">{confirmModal.title}</h3>
                                <p className="text-slate-500 text-sm mt-2">{confirmModal.message}</p>
                                <div className="flex gap-2 mt-6">
                                    <button onClick={() => setConfirmModal({show:false})} className="flex-1 p-3 bg-slate-100 rounded-xl font-bold">Jo</button>
                                    <button onClick={() => {confirmModal.onConfirm(); setConfirmModal({show:false});}} className="flex-1 p-3 bg-red-600 text-white rounded-xl font-bold">Po</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
    </script>
</body>
</html>
