<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | LindiMaps</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6">
    <h1 class="text-2xl font-bold mb-2">Hyr në Akademi</h1>
    <p class="text-slate-600 mb-6">Vetëm përdoruesit e loguar mund të aksesojnë materialet.</p>

    <div id="msg" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

    <form id="authForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Email</label>
        <input id="email" type="email" required
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring"
          placeholder="email@domain.com" />
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Fjalëkalimi</label>
        <input id="password" type="password" required
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring"
          placeholder="••••••••" />
      </div>

      <button id="loginBtn" type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg">
        Hyr
      </button>
    </form>

    <div class="mt-4 flex flex-col gap-2">
      <button id="signupBtn"
        class="w-full border border-slate-200 hover:bg-slate-50 font-semibold py-2 rounded-lg">
        Regjistrohu
      </button>

      <button id="resetBtn"
        class="w-full text-blue-600 hover:underline text-sm">
        Harrove fjalëkalimin?
      </button>
    </div>

    <div class="mt-6 text-sm text-slate-500">
      <span>Pas login do ridrejtohesh te Akademia.</span>
    </div>
  </div>

  <script>
    // 1) Vendos këto dy vlera nga Supabase -> Project Settings -> API
    const SUPABASE_URL = "PASTE_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "PASTE_SUPABASE_ANON_KEY";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const msg = document.getElementById("msg");
    const emailEl = document.getElementById("email");
    const passEl = document.getElementById("password");

    function showMsg(text, type = "ok") {
      msg.classList.remove("hidden");
      msg.className = "mb-4 p-3 rounded-lg text-sm " + (type === "ok"
        ? "bg-emerald-50 text-emerald-700 border border-emerald-200"
        : "bg-red-50 text-red-700 border border-red-200");
      msg.textContent = text;
    }

    function getNext() {
      const url = new URL(window.location.href);
      return url.searchParams.get("next") || "/sq/akademia/"; // ndrysho nëse do
    }

    async function redirectIfLoggedIn() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) window.location.href = getNext();
    }
    redirectIfLoggedIn();

    // LOGIN
    document.getElementById("authForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.classList.add("hidden");

      const email = emailEl.value.trim();
      const password = passEl.value;

      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) return showMsg(error.message, "err");

      window.location.href = getNext();
    });

    // SIGNUP (Regjistrim)
    document.getElementById("signupBtn").addEventListener("click", async () => {
      msg.classList.add("hidden");

      const email = emailEl.value.trim();
      const password = passEl.value;

      const { error } = await supabase.auth.signUp({ email, password });
      if (error) return showMsg(error.message, "err");

      showMsg("Regjistrimi u krye. Kontrollo email-in për konfirmim (nëse e ke aktiv).");
    });

    // RESET PASSWORD
    document.getElementById("resetBtn").addEventListener("click", async () => {
      msg.classList.add("hidden");

      const email = emailEl.value.trim();
      if (!email) return showMsg("Shkruaj email-in fillimisht.", "err");

      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + "/login/"
      });
      if (error) return showMsg(error.message, "err");

      showMsg("U dërgua link për reset në email.");
    });
  </script>
</body>
</html>
