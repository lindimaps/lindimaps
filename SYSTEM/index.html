<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LindiMaps Systems</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .tab-active { color: #3b82f6; border-bottom: 3px solid #3b82f6; }
        
        .logo-gradient {
            background: linear-gradient(to right, #3b82f6, #2dd4bf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        @keyframes pulse-dot {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-dot {
            animation: pulse-dot 2s infinite ease-in-out;
            transform-origin: center;
        }
        .logo-bg { transition: background-color 0.3s ease; }
        .logo-container:hover .logo-bg { background-color: #2563eb; }
    </style>
</head>
<body class="bg-[#f8fafc] min-h-screen pb-24 text-slate-900">

<!-- AUTHENTICATION OVERLAY -->
<div id="auth-overlay" class="fixed inset-0 z-[400] bg-white flex items-center justify-center p-6 hidden">
    <div class="max-w-md w-full space-y-12">
        <div class="flex items-center gap-3 logo-container justify-center">
            <div class="logo-bg h-14 w-14 flex items-center justify-center bg-slate-900 rounded-2xl shadow-xl">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z" fill="white" fill-opacity="0.15"/>
                    <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                    <circle class="animate-dot" cx="12" cy="11" r="2.5" fill="#3b82f6" stroke="white" stroke-width="1.2"/>
                </svg>
            </div>
            <div class="flex flex-col">
                <h1 class="text-3xl font-black tracking-tighter leading-none">
                    <span class="text-slate-900">LINDI</span><span class="logo-gradient">MAPS</span>
                </h1>
                <span class="text-[10px] uppercase tracking-[0.4em] font-bold text-slate-400 mt-1">
                    Systems
                </span>
            </div>
        </div>

        <div id="login-form" class="space-y-4">
            <input id="login-email" type="email" placeholder="Email" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 font-bold focus:bg-white">
            <input id="login-password" type="password" placeholder="Fjalëkalimi" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 font-bold focus:bg-white">
            <button id="login-btn" class="w-full bg-slate-900 text-white p-5 rounded-2xl font-bold shadow-lg hover:bg-indigo-700 active:scale-95 transition-all">Hyr në Sistem</button>
            <div class="flex justify-between px-2 text-[11px] font-bold text-slate-400">
                <button onclick="toggleAuth('reset')" class="hover:text-blue-600">Harrova fjalëkalimin</button>
                <button onclick="toggleAuth('signup')" class="text-blue-600">Krijo llogari</button>
            </div>
        </div>
    </div>
</div>

<div id="custom-alert" class="hidden fixed inset-0 z-[500] bg-black/50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl">
        <p id="alert-message" class="font-bold text-slate-800"></p>
        <button onclick="closeAlert()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold">Kuptova</button>
    </div>
</div>

<div id="confirm-modal" class="hidden fixed inset-0 z-[600] bg-black/50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center space-y-6 shadow-2xl">
        <div class="space-y-2">
            <h3 class="text-xl font-extrabold text-slate-800">A jeni i sigurt?</h3>
            <p id="confirm-message" class="text-slate-500 font-medium text-sm">Ky veprim nuk mund të kthehet pas.</p>
        </div>
        <div class="flex gap-3">
            <button onclick="closeConfirm()" class="flex-1 bg-slate-100 text-slate-600 py-3 rounded-xl font-bold">Anulo</button>
            <button id="confirm-yes-btn" class="flex-1 bg-red-500 text-white py-3 rounded-xl font-bold">Fshije</button>
        </div>
    </div>
</div>

<div id="loading" class="fixed inset-0 bg-white/95 z-[300] flex items-center justify-center">
    <div class="flex flex-col items-center gap-4">
        <div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-600 border-t-transparent"></div>
        <p class="text-slate-900 font-black text-xs uppercase tracking-[0.3em]">LindiMaps</p>
    </div>
</div>

<div id="app-content" class="hidden">
    <header class="glass-card sticky top-0 z-50 px-6 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="h-8 w-8 flex items-center justify-center bg-slate-900 rounded-lg shadow">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z" fill="white" fill-opacity="0.15"/>
                    <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                    <circle cx="12" cy="11" r="2.5" fill="#3b82f6" stroke="white" stroke-width="1.2"/>
                </svg>
            </div>
            <div class="flex flex-col">
                <span class="font-black text-sm tracking-tighter leading-none">
                    <span class="text-slate-900">LINDI</span><span class="logo-gradient">MAPS</span>
                </span>
                <span class="text-[7px] uppercase font-bold text-slate-400 tracking-widest">Systems</span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="logout()" class="text-[10px] font-bold text-slate-400 uppercase hover:text-red-500">Dil</button>
            <span id="sync-status" class="text-[10px] font-bold text-blue-500 bg-blue-50 px-3 py-1 rounded-full uppercase">Sistemi Aktiv</span>
        </div>
    </header>

    <nav class="bg-white border-b border-slate-100 flex overflow-x-auto">
        <button onclick="switchTab('log')" id="tab-log" class="flex-1 py-4 text-xs font-extrabold uppercase tracking-widest tab-active">Regjistrim Ditor</button>
        <button onclick="switchTab('config')" id="tab-config" class="flex-1 py-4 text-xs font-extrabold uppercase tracking-widest text-slate-400">Struktura</button>
        <button onclick="switchTab('reports')" id="tab-reports" class="flex-1 py-4 text-xs font-extrabold uppercase tracking-widest text-slate-400">Raporte</button>
    </nav>

    <main class="max-w-3xl mx-auto p-4 md:p-8 space-y-8">
        <div id="view-log" class="space-y-6">
            <div class="glass-card rounded-[2rem] p-6 shadow-xl shadow-slate-200/50 space-y-6 border border-white">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Data</label>
                        <input id="log-date" type="date" class="w-full p-4 rounded-2xl bg-slate-50 border-slate-100 font-bold">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Eksperti</label>
                        <select id="log-operator-select" class="w-full p-4 rounded-2xl bg-slate-50 border-slate-100 font-bold appearance-none"></select>
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Aktiviteti</label>
                    <select id="log-act-select" onchange="generateProcessFields()" class="w-full p-4 rounded-2xl bg-slate-50 border-slate-100 font-bold appearance-none"></select>
                </div>
                <div id="dynamic-fields-container" class="space-y-4 pt-4 border-t border-slate-50"></div>
                
                <div class="pt-4 border-t border-slate-50 space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Ora Fillimit</label>
                            <input id="log-start-time" type="time" onchange="calculateHours()" class="w-full p-4 rounded-2xl bg-slate-50 border-slate-100 font-bold">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Ora Mbarimit</label>
                            <input id="log-end-time" type="time" onchange="calculateHours()" class="w-full p-4 rounded-2xl bg-slate-50 border-slate-100 font-bold">
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Total Orë Pune</label>
                        <input id="log-hours" type="number" step="0.1" placeholder="0.0" class="w-full p-4 rounded-2xl bg-blue-50 text-blue-600 font-black text-xl border-none">
                    </div>
                </div>

                <input type="hidden" id="log-edit-id">
                <button id="save-log-btn" class="w-full bg-slate-900 text-white p-5 rounded-[1.5rem] font-bold shadow-lg hover:bg-black active:scale-95 transition-all">
                    Ruaj në Cloud
                </button>
                <button id="cancel-log-edit" class="hidden w-full bg-slate-200 text-slate-600 p-4 rounded-[1.5rem] font-bold mt-2" onclick="cancelLogEdit()">Anulo Modifikimin</button>
            </div>
        </div>

        <div id="view-config" class="hidden space-y-8">
            <div class="glass-card rounded-[2rem] p-8 space-y-6">
                <div class="flex justify-between items-center">
                    <h2 id="config-title" class="text-xl font-extrabold text-slate-800">Shto Aktivitet</h2>
                    <button id="cancel-edit-btn" class="hidden text-xs font-bold text-red-500 uppercase" onclick="resetConfigForm()">Anulo</button>
                </div>
                <div class="space-y-4">
                    <input id="edit-id" type="hidden">
                    <input id="new-act-name" type="text" placeholder="Emri i Aktivitetit" class="w-full p-4 rounded-xl bg-slate-50 border-none font-bold">
                    <textarea id="new-act-processes" placeholder="Proceset (Emri:numër/tekst) - psh. Bashkia:tekst" class="w-full p-4 rounded-xl bg-slate-50 border-none h-32 font-medium"></textarea>
                    <button id="add-act-btn" class="w-full bg-blue-600 text-white p-4 rounded-xl font-bold">Ruaj Aktivitetin</button>
                </div>
            </div>
            <div id="config-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            
            <div class="glass-card rounded-[2rem] p-8 space-y-6 border-t-4 border-slate-900">
                <h2 class="text-xl font-extrabold text-slate-800">Ekspertët</h2>
                <div class="flex gap-2">
                    <input id="new-op-name" type="text" placeholder="Emri i Ekspertit" class="flex-1 p-4 rounded-xl bg-slate-50 border-none font-bold">
                    <button id="add-op-btn" class="bg-slate-900 text-white px-6 rounded-xl font-bold">Shto</button>
                </div>
                <div id="operator-list" class="flex flex-wrap gap-2 pt-2"></div>
            </div>
        </div>

        <div id="view-reports" class="hidden space-y-6">
            <div class="glass-card rounded-[2rem] p-6 space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="grid grid-cols-2 gap-2">
                        <input id="rep-start" type="date" class="p-3 rounded-xl bg-slate-50 border-none font-bold text-[10px]">
                        <input id="rep-end" type="date" class="p-3 rounded-xl bg-slate-50 border-none font-bold text-[10px]">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <select id="rep-op-select" class="p-3 rounded-xl bg-slate-50 border-none font-bold text-[10px]"></select>
                        <select id="rep-act-select" onchange="updateProcessFilterUI()" class="p-3 rounded-xl bg-slate-50 border-none font-bold text-[10px]"></select>
                    </div>
                </div>
                <div id="rep-dynamic-filters" class="grid grid-cols-2 md:grid-cols-3 gap-2"></div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="renderReportList()" class="bg-slate-900 text-white p-4 rounded-xl font-bold text-xs uppercase">Filtro</button>
                    <button onclick="exportToPDF()" class="bg-blue-600 text-white p-4 rounded-xl font-bold text-xs uppercase">Shkarko PDF</button>
                </div>
            </div>
            <div id="report-results" class="space-y-4"></div>
        </div>
    </main>
</div><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "sistemi-aktiviteteve.firebaseapp.com",
  projectId: "sistemi-aktiviteteve",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const appId = "sistemi-aktiviteteve-v1";

window.db = db;
window.doc = doc;
window.deleteDoc = deleteDoc;
window.appId = appId;

let configData = [];
let logData = [];
let operatorData = [];

/* ---------------- SAFE MATH ---------------- */
window.handleMathInput = (event) => {
    if (event.key === 'Enter') {
        try {
            const input = event.target.value;
            if (!/^[0-9+\-*/().\s]+$/.test(input)) return;
            const result = Function(`"use strict"; return (${input})`)();
            if (!isNaN(result)) event.target.value = result;
        } catch {}
    }
};

/* ---------------- HOURS FIX ---------------- */
window.calculateHours = () => {
    const start = document.getElementById('log-start-time').value;
    const end = document.getElementById('log-end-time').value;

    if (!start || !end) return;

    const s = new Date(`1970-01-01T${start}`);
    const e = new Date(`1970-01-01T${end}`);

    let diff = (e - s) / 3600000;
    if (diff < 0) diff += 24;

    if (!isNaN(diff)) {
        document.getElementById('log-hours').value = diff.toFixed(2);
    }
};

/* ---------------- AUTH ---------------- */
document.getElementById('login-btn').onclick = async () => {
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-password').value;

    if (!email || !pass) return alert("Plotëso kredencialet");

    try {
        await signInWithEmailAndPassword(auth, email, pass);
    } catch (e) {
        alert(e.message);
    }
};

window.logout = () => signOut(auth);

/* ---------------- SNAPSHOT SAFE ---------------- */
function startListening() {
    const base = `artifacts/${appId}/public/data`;

    onSnapshot(collection(db, base, 'config'), snap => {
        configData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        updateDropdowns();
    });

    onSnapshot(collection(db, base, 'logs'), snap => {
        logData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    });

    onSnapshot(collection(db, base, 'operators'), snap => {
        operatorData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        updateDropdowns();
    });
}

/* ---------------- SAVE LOG SAFE ---------------- */
document.getElementById('save-log-btn').onclick = async () => {
    try {
        const actId = document.getElementById('log-act-select').value;
        const date = document.getElementById('log-date').value;
        const operator = document.getElementById('log-operator-select').value;
        const hours = parseFloat(document.getElementById('log-hours').value);

        if (!actId || !date || !operator || isNaN(hours)) {
            return alert("Plotësoni të gjitha fushat saktë.");
        }

        const act = configData.find(c => c.id === actId);
        if (!act) return alert("Aktivitet i pavlefshëm");

        const processes = Array.from(document.querySelectorAll('.process-input'))
            .map(i => ({ label: i.dataset.label, value: i.value }));

        const id = Date.now().toString();

        await setDoc(doc(db, `artifacts/${appId}/public/data/logs`, id), {
            actId,
            actName: act.name,
            date,
            operator,
            hours,
            processes
        });

    } catch (e) {
        console.error(e);
        alert("Gabim gjatë ruajtjes");
    }
};

/* ---------------- DROPDOWNS SAFE ---------------- */
function updateDropdowns() {
    const acts = configData.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
    const ops = operatorData.map(o => `<option value="${o.name}">${o.name}</option>`).join("");

    document.getElementById('log-act-select').innerHTML = `<option value="">-- Zgjidh --</option>` + acts;
    document.getElementById('log-operator-select').innerHTML = `<option value="">-- Zgjidh --</option>` + ops;
}

/* ---------------- AUTH STATE ---------------- */
onAuthStateChanged(auth, (user) => {
    document.getElementById('loading').classList.add('hidden');

    if (user) {
        document.getElementById('app-content').classList.remove('hidden');
        document.getElementById('auth-overlay').classList.add('hidden');
        startListening();
    } else {
        document.getElementById('app-content').classList.add('hidden');
        document.getElementById('auth-overlay').classList.remove('hidden');
    }
});
</script>


</body>
