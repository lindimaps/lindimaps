<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LindiMaps Aktivitete</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;600;800&display=swap');
body { font-family: 'Plus Jakarta Sans', sans-serif; }
.glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
.tab-active { color: #3b82f6; border-bottom: 3px solid #3b82f6; }
.logo-gradient { background: linear-gradient(to right, #3b82f6, #2dd4bf); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
@keyframes pulse-dot { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
.animate-dot { animation: pulse-dot 2s infinite ease-in-out; transform-origin: center; }
.process-textarea { resize: none; overflow: hidden; min-height: 52px; }
</style>
</head>
<body class="bg-[#f8fafc] min-h-screen pb-24 text-slate-900">

<!-- AUTHENTICATION OVERLAY -->
<div id="auth-overlay" class="fixed inset-0 z-[400] bg-white flex items-center justify-center p-6 hidden">
<div class="max-w-md w-full space-y-8">
<div class="flex items-center gap-3 logo-container justify-center mb-4">
<div class="h-14 w-14 flex items-center justify-center bg-slate-900 rounded-2xl shadow-xl">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z" fill="white" fill-opacity="0.15"/><path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z" stroke="white" stroke-width="2" stroke-linejoin="round"/><circle class="animate-dot" cx="12" cy="11" r="2.5" fill="#3b82f6" stroke="white" stroke-width="1.2"/></svg>
</div>
<div class="flex flex-col"><h1 class="text-3xl font-black tracking-tighter leading-none"><span class="text-slate-900">LINDI</span><span class="logo-gradient">MAPS</span></h1><span class="text-[10px] uppercase tracking-[0.4em] font-bold text-slate-400 mt-1">Sistemi Aktivitete</span></div>
</div>
<div id="login-section" class="space-y-4">
<h2 class="text-center font-extrabold text-slate-800 text-xl">Mirësevini përsëri</h2>
<input id="login-email" type="email" placeholder="Email" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 font-bold focus:bg-white outline-none">
<input id="login-password" type="password" placeholder="Fjalëkalimi" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 font-bold focus:bg-white outline-none">
<button id="login-btn" class="w-full bg-slate-900 text-white p-5 rounded-2xl font-bold shadow-lg hover:bg-indigo-700 active:scale-95 transition-all">Hyr në Sistem</button>
</div>
</div>
</div>

<div id="custom-alert" class="hidden fixed inset-0 z-[500] bg-black/50 flex items-center justify-center p-4">
<div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl"><p id="alert-message" class="font-bold text-slate-800"></p><button onclick="closeAlert()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold">Kuptova</button></div>
</div>

<div id="confirm-modal" class="hidden fixed inset-0 z-[600] bg-black/50 flex items-center justify-center p-4">
<div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center space-y-6 shadow-2xl">
<h3 class="text-xl font-extrabold text-slate-800">A jeni i sigurt?</h3>
<div class="flex gap-3"><button onclick="closeConfirm()" class="flex-1 bg-slate-100 text-slate-600 py-3 rounded-xl font-bold">Anulo</button><button id="confirm-yes-btn" class="flex-1 bg-red-500 text-white py-3 rounded-xl font-bold">Vazhdo</button></div>
</div>
</div>

<div id="loading" class="fixed inset-0 bg-white/95 z-[300] flex items-center justify-center"><div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-600 border-t-transparent"></div></div>

<div id="app-content" class="hidden">
<header class="glass-card sticky top-0 z-50 px-6 py-3 flex justify-between items-center">
<div class="flex items-center gap-2"><span class="font-black text-sm tracking-tighter"><span class="text-slate-900">LINDI</span><span class="logo-gradient">MAPS</span></span></div>
<button onclick="logout()" class="text-[10px] font-bold text-slate-400 uppercase hover:text-red-500">Dil</button>
</header>
<nav class="bg-white border-b border-slate-100 flex overflow-x-auto">
<button onclick="switchTab('log')" id="tab-log" class="flex-1 py-4 text-[10px] font-extrabold uppercase tracking-widest tab-active">Regjistrim</button>
<button onclick="switchTab('config')" id="tab-config" class="flex-1 py-4 text-[10px] font-extrabold uppercase tracking-widest text-slate-400">Struktura</button>
<button onclick="switchTab('reports')" id="tab-reports" class="flex-1 py-4 text-[10px] font-extrabold uppercase tracking-widest text-slate-400">Raporte</button>
</nav>

<main class="max-w-3xl mx-auto p-4 md:p-8 space-y-8">
<div id="view-log" class="space-y-6">
<div class="glass-card rounded-[2rem] p-6 shadow-xl border border-white space-y-6">
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="space-y-2"><label class="text-[11px] font-extrabold text-slate-400 uppercase">Data</label><input id="log-date" type="date" class="w-full p-4 rounded-2xl bg-slate-50 border-slate-100 font-bold"></div>
<div class="space-y-2"><label class="text-[11px] font-extrabold text-slate-400 uppercase">Eksperti</label><select id="log-operator-select" class="w-full p-4 rounded-2xl bg-slate-50 border-slate-100 font-bold appearance-none"></select></div>
</div>
<div class="space-y-2"><label class="text-[11px] font-extrabold text-slate-400 uppercase">Aktiviteti</label><select id="log-act-select" onchange="generateProcessFields()" class="w-full p-4 rounded-2xl bg-slate-50 border-slate-100 font-bold appearance-none"></select></div>
<div id="dynamic-fields-container" class="space-y-4 pt-4 border-t border-slate-50"></div>
<button id="save-log-btn" class="w-full bg-slate-900 text-white p-5 rounded-[1.5rem] font-bold shadow-lg hover:bg-black active:scale-95 transition-all">Ruaj në Cloud</button>
</div>
</div>

<div id="view-config" class="hidden space-y-8">
<div class="glass-card rounded-[2rem] p-8 space-y-6">
<h2 class="text-xl font-extrabold text-slate-800">Shto Aktivitet</h2>
<input id="new-act-name" type="text" placeholder="Emri i Aktivitetit" class="w-full p-4 rounded-xl bg-slate-50 border-none font-bold">
<textarea id="new-act-processes" placeholder="Proceset (Emri:tipi)" class="w-full p-4 rounded-xl bg-slate-50 border-none h-32 font-medium"></textarea>
<button id="add-act-btn" class="w-full bg-blue-600 text-white p-4 rounded-xl font-bold">Ruaj</button>
</div>
<div id="config-list" class="grid grid-cols-1 gap-4"></div>
</div>

<div id="view-reports" class="hidden space-y-6">
<div class="glass-card rounded-[2rem] p-6 space-y-4">
<div class="grid grid-cols-2 md:grid-cols-4 gap-2">
<input id="rep-start" type="date" class="p-3 rounded-xl bg-slate-50 border-none font-bold text-[10px]">
<input id="rep-end" type="date" class="p-3 rounded-xl bg-slate-50 border-none font-bold text-[10px]">
<select id="rep-op-select" class="p-3 rounded-xl bg-slate-50 border-none font-bold text-[10px]"></select>
<select id="rep-act-select" onchange="updateProcessFilterUI()" class="p-3 rounded-xl bg-slate-50 border-none font-bold text-[10px]"></select>
</div>
<div class="flex gap-2">
<button onclick="renderReportList()" class="flex-1 bg-slate-900 text-white p-4 rounded-xl font-bold text-xs uppercase">Filtro</button>
<button onclick="clearFilters()" class="flex-1 bg-slate-200 text-slate-700 p-4 rounded-xl font-bold text-xs uppercase">Pastro filtrin</button>
<button onclick="exportToPDF()" class="flex-1 bg-blue-600 text-white p-4 rounded-xl font-bold text-xs uppercase">Shkarko PDF</button>
</div>
</div>
<div id="report-results" class="space-y-4"></div>
</div>
</main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyBk3Wi9DsGp9egY8qQnxeEdM9qlTZIodw0",
authDomain: "sistemi-aktiviteteve.firebaseapp.com",
projectId: "sistemi-aktiviteteve",
storageBucket: "sistemi-aktiviteteve.firebasestorage.app",
messagingSenderId: "289905439492",
appId: "1:289905439492:web:4e7e52e13a8379a74b9651"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const appId = "sistemi-aktiviteteve-v1";

let configData = [], logData = [], operatorData = [];

// UI Logic
window.clearFilters = () => {
    document.getElementById('rep-start').value = "";
    document.getElementById('rep-end').value = "";
    document.getElementById('rep-op-select').value = "";
    document.getElementById('rep-act-select').value = "";
    renderReportList();
};

window.switchTab = (tab) => {
    ['view-log', 'view-config', 'view-reports'].forEach(v => document.getElementById(v).classList.add('hidden'));
    document.getElementById(`view-${tab}`).classList.remove('hidden');
};

const getBaseCollectionPath = (col) => `artifacts/${appId}/public/data/${col}`;

onAuthStateChanged(auth, (user) => {
    if(user) {
        document.getElementById('app-content').classList.remove('hidden');
        document.getElementById('auth-overlay').classList.add('hidden');
        document.getElementById('log-date').valueAsDate = new Date();
        startListening(user.uid);
    }
});

function startListening(userId) {
    onSnapshot(collection(db, getBaseCollectionPath('config')), snap => { configData = snap.docs.filter(d=>d.id.startsWith(userId)).map(d=>({id: d.id.replace(userId+'_',''), ...d.data()})); });
    onSnapshot(collection(db, getBaseCollectionPath('logs')), snap => { 
        logData = snap.docs.filter(d=>d.id.startsWith(userId)).map(d=>({id: d.id.replace(userId+'_',''), ...d.data()})).sort((a,b) => b.date.localeCompare(a.date));
        renderReportList();
    });
}

window.exportToPDF = () => {
    const { jsPDF } = window.jspdf;
    const docPDF = new jsPDF('l', 'mm', 'a4');
    const filtered = logData.sort((a,b) => a.actName.localeCompare(b.actName));
    
    let currentAct = "";
    let startY = 20;
    
    filtered.forEach(log => {
        if(log.actName !== currentAct) {
            currentAct = log.actName;
            docPDF.setFontSize(12);
            docPDF.text("Aktiviteti: " + currentAct, 14, startY);
            startY += 5;
            const headers = [['Data', 'Eksperti', 'Ore', ...log.processes.map(p => p.label)]];
            const body = [[log.date, log.operator, log.hours, ...log.processes.map(p => p.value)]];
            docPDF.autoTable({ startY: startY, head: headers, body: body, theme: 'striped', styles: { fontSize: 8 } });
            startY = docPDF.lastAutoTable.finalY + 10;
        } else {
             docPDF.autoTable({ startY: startY, body: [[log.date, log.operator, log.hours, ...log.processes.map(p => p.value)]], theme: 'striped', styles: { fontSize: 8 } });
             startY = docPDF.lastAutoTable.finalY + 2;
        }
    });
    docPDF.save("Raport.pdf");
};

window.renderReportList = () => {
    document.getElementById('report-results').innerHTML = logData.map(log => `
        <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
            <h4 class="font-bold text-sm">${log.actName} | ${log.date}</h4>
            <p class="text-[10px] text-slate-500">${log.operator} - ${log.hours} Orë</p>
        </div>`).join("");
};
</script>
</body>
</html>
