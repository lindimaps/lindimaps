<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Analiza e Pyjeve ASIG</title>

<link rel="stylesheet" href="https://js.arcgis.com/4.28/esri/themes/light/main.css">
<script src="https://js.arcgis.com/4.28/"></script>

<style>
:root { --primary: #004a87; --secondary: #2d5a27; }

body, html, #v {
  margin: 0; padding: 0;
  height: 100%; width: 100%;
  font-family: 'Segoe UI', sans-serif;
}

#h {
  height: 60px;
  background: var(--primary);
  color: white;
  display: flex;
  align-items: center;
  padding: 0 20px;
  justify-content: space-between;
}

#h h1 { margin: 0; font-size: 1rem; }

.info-p {
  background: white;
  padding: 15px;
  border-radius: 8px;
  border-left: 6px solid var(--secondary);
  max-width: 280px;
}

.stat-val {
  font-size: 1.6rem;
  font-weight: 800;
  color: var(--secondary);
}

.res-item {
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  padding: 4px 0;
}

.loader {
  border: 3px solid #eee;
  border-top: 3px solid var(--primary);
  border-radius: 50%;
  width: 25px; height: 25px;
  animation: spin 1s linear infinite;
  margin: 10px auto;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

#overlay {
  position: fixed;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.8);
  display:flex; justify-content:center; align-items:center;
  color:white;
}

.card {
  background:white;
  color:#333;
  padding:25px;
  border-radius:10px;
  text-align:center;
}
</style>
</head>

<body>

<div id="h">
  <h1>ASIG - Analiza e Pyjeve</h1>
</div>

<div id="overlay">
  <div class="card">
    <h3>Analiza e Sipërfaqes</h3>
    <p>Zgjidh një zonë në hartë</p>
    <button onclick="overlay.style.display='none'">Fillo</button>
  </div>
</div>

<div id="v"></div>

<script>
require([
  "esri/config",
  "esri/Map",
  "esri/views/MapView",
  "esri/layers/FeatureLayer",
  "esri/geometry/geometryEngine",
  "esri/widgets/LayerList",
  "esri/widgets/Expand"
], (esriConfig, Map, MapView, FeatureLayer, geometryEngine, LayerList, Expand) => {

  const forestLayer = new FeatureLayer({
    url: "https://services-eu1.arcgis.com/omB9pKT6MaKdkhUH/arcgis/rest/services/Pyje_Zonat_e_Mbrojtura/FeatureServer/0"
  });

  const zmLayer = new FeatureLayer({
    url: "https://services-eu1.arcgis.com/omB9pKT6MaKdkhUH/arcgis/rest/services/ZM/FeatureServer/0",
    opacity: 0.5
  });

  const bashkiLayer = new FeatureLayer({
    url: "https://services-eu1.arcgis.com/omB9pKT6MaKdkhUH/arcgis/rest/services/Kufijt%C3%AB_e_Bashkive/FeatureServer/0",
    opacity: 0.4
  });

  const map = new Map({
    basemap: "hybrid",
    layers: [forestLayer, zmLayer, bashkiLayer]
  });

  const view = new MapView({
    container: "v",
    map: map,
    center: [20.16, 41.15],
    zoom: 8
  });

  view.ui.add(new Expand({
    view: view,
    content: new LayerList({ view })
  }), "top-right");

  let highlight;

  function getName(a) {
    return a.Emri || a.EMRI || a.NAME || "Pa emër";
  }

  view.on("click", async (event) => {

    const hit = await view.hitTest(event);

    const result = hit.results.find(r =>
      r.graphic.layer === zmLayer || r.graphic.layer === bashkiLayer
    );

    if (!result) return;

    const graphic = result.graphic;

    // highlight
    if (highlight) highlight.remove();
    view.whenLayerView(graphic.layer).then(lv => {
      highlight = lv.highlight(graphic);
    });

    view.popup.open({
      location: event.mapPoint,
      title: getName(graphic.attributes),
      content: "<div class='loader'></div>"
    });

    try {

      const full = await graphic.layer.queryFeatures({
        objectIds: [graphic.attributes[graphic.layer.objectIdField]],
        returnGeometry: true
      });

      const geom = full.features[0].geometry;

      const forests = await forestLayer.queryFeatures({
        geometry: geom,
        spatialRelationship: "intersects",
        returnGeometry: true
      });

      let total = 0;
      let valid = [];

      forests.features.forEach(f => {

        // FAST CHECK me extent
        if (!geometryEngine.intersects(geom.extent, f.geometry.extent)) return;

        const cut = geometryEngine.intersect(geom, f.geometry);

        if (cut) {
          const area = geometryEngine.geodesicArea(cut, "hectares");
          if (area > 0) {
            total += area;
            valid.push({ geom: cut, area });
          }
        }
      });

      const crossLayer = graphic.layer === zmLayer ? bashkiLayer : zmLayer;

      const cross = await crossLayer.queryFeatures({
        geometry: geom,
        spatialRelationship: "intersects",
        returnGeometry: true
      });

      let html = "";

      cross.features.forEach(c => {

        let sub = 0;

        valid.forEach(v => {

          if (!geometryEngine.intersects(c.geometry.extent, v.geom.extent)) return;

          const subCut = geometryEngine.intersect(c.geometry, v.geom);

          if (subCut) {
            sub += geometryEngine.geodesicArea(subCut, "hectares");
          }
        });

        if (sub > 0.1) {
          html += `<div class="res-item">
            <span>${getName(c.attributes)}</span>
            <b>${sub.toFixed(2)} ha</b>
          </div>`;
        }
      });

      view.popup.content = `
        <div class="info-p">
          <div>Total:</div>
          <div class="stat-val">
            ${total > 0 ? total.toFixed(2) + " ha" : "0 ha"}
          </div>
          ${html || "<p>Nuk ka ndarje</p>"}
        </div>
      `;

    } catch (e) {
      console.error(e);
      view.popup.content = "<p style='color:red'>Gabim gjatë analizës</p>";
    }

  });

});
</script>

</body>
</html>
