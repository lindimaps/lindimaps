<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Analiza e Pyjeve ASIG</title>

<link rel="stylesheet" href="https://js.arcgis.com/4.28/esri/themes/light/main.css">
<script src="https://js.arcgis.com/4.28/"></script>

<style>
:root { --primary: #004a87; --secondary: #2d5a27; }

body, html, #v {
  margin: 0; padding: 0;
  height: 100%; width: 100%;
  font-family: 'Segoe UI', sans-serif;
}

#h {
  height: 60px;
  background: var(--primary);
  color: white;
  display: flex;
  align-items: center;
  padding: 0 20px;
  justify-content: space-between;
}

.info-p {
  background: white;
  padding: 15px;
  border-radius: 8px;
  border-left: 6px solid var(--secondary);
  max-width: 280px;
}

.stat-val {
  font-size: 1.6rem;
  font-weight: 800;
  color: var(--secondary);
}

.res-item {
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  padding: 4px 0;
}

.loader {
  border: 3px solid #eee;
  border-top: 3px solid var(--primary);
  border-radius: 50%;
  width: 25px; height: 25px;
  animation: spin 1s linear infinite;
  margin: 10px auto;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

#overlay {
  position: fixed;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.8);
  display:flex; justify-content:center; align-items:center;
  color:white;
}

.card {
  background:white;
  color:#333;
  padding:25px;
  border-radius:10px;
  text-align:center;
}
</style>
</head>

<body>

<div id="h">
  <h3>ASIG - Analiza e Pyjeve</h3>
</div>

<div id="overlay">
  <div class="card">
    <h3>Analiza e Sipërfaqes</h3>
    <p>Kliko mbi një zonë në hartë</p>
    <button onclick="overlay.style.display='none'">Fillo</button>
  </div>
</div>

<div id="v"></div>

<script>
require([
  "esri/Map",
  "esri/views/MapView",
  "esri/layers/FeatureLayer",
  "esri/geometry/geometryEngine",
  "esri/widgets/LayerList",
  "esri/widgets/Expand"
], (Map, MapView, FeatureLayer, geometryEngine, LayerList, Expand) => {

  const forestLayer = new FeatureLayer({
    url: "https://services-eu1.arcgis.com/omB9pKT6MaKdkhUH/arcgis/rest/services/Pyje_Zonat_e_Mbrojtura/FeatureServer/0",
    outFields: ["*"]
  });

  const zmLayer = new FeatureLayer({
    url: "https://services-eu1.arcgis.com/omB9pKT6MaKdkhUH/arcgis/rest/services/ZM/FeatureServer/0",
    outFields: ["*"],
    opacity: 0.5
  });

  const bashkiLayer = new FeatureLayer({
    url: "https://services-eu1.arcgis.com/omB9pKT6MaKdkhUH/arcgis/rest/services/Kufijt%C3%AB_e_Bashkive/FeatureServer/0",
    outFields: ["*"],
    opacity: 0.4
  });

  const map = new Map({
    basemap: "hybrid",
    layers: [forestLayer, zmLayer, bashkiLayer]
  });

  const view = new MapView({
    container: "v",
    map: map,
    center: [20.16, 41.15],
    zoom: 8
  });

  view.ui.add(new Expand({
    view: view,
    content: new LayerList({ view })
  }), "top-right");

  // FUNKSION UNIVERSAL PER EMRIN
  function getName(attr) {
    if (!attr) return "Pa emër";

    const keys = [
      "EMRI","Emri","EMERTIMI","NAME",
      "ZONA_MBR","EMRI_BASHK","BASHKIA"
    ];

    for (let k of keys) {
      if (attr[k]) return attr[k];
    }

    for (let k in attr) {
      if (typeof attr[k] === "string" && attr[k].length > 3) {
        return attr[k];
      }
    }

    return "Pa emër";
  }

  view.on("click", async (event) => {

    const hit = await view.hitTest(event);

    const result = hit.results.find(r =>
      r.graphic.layer === zmLayer || r.graphic.layer === bashkiLayer
    );

    if (!result) return;

    const graphic = result.graphic;

    view.popup.open({
      location: event.mapPoint,
      title: getName(graphic.attributes),
      content: "<div class='loader'></div>"
    });

    try {

      const oidField = graphic.layer.objectIdField;
      const oid = graphic.attributes[oidField];

      const full = await graphic.layer.queryFeatures({
        objectIds: [oid],
        returnGeometry: true
      });

      if (!full.features.length) {
        view.popup.content = "Nuk u gjet zona";
        return;
      }

      const geom = full.features[0].geometry;

      const forests = await forestLayer.queryFeatures({
        geometry: geom,
        spatialRelationship: "intersects",
        returnGeometry: true
      });

      if (!forests.features.length) {
        view.popup.content = "<p>Nuk ka pyje në këtë zonë</p>";
        return;
      }

      let total = 0;

      forests.features.forEach(f => {
        try {
          if (!f.geometry) return;

          const cut = geometryEngine.intersect(geom, f.geometry);

          if (cut) {
            const area = geometryEngine.geodesicArea(cut, "hectares");
            if (area > 0) total += area;
          }

        } catch(e) {
          console.warn("Gabim intersect");
        }
      });

      view.popup.content = `
        <div class="info-p">
          <div>Sipërfaqe Pyjore:</div>
          <div class="stat-val">${total.toFixed(2)} ha</div>
        </div>
      `;

    } catch (err) {

      console.error(err);

      view.popup.content = `
        <p style="color:red;">
          Gabim gjatë analizës<br>
          ${err.message}
        </p>
      `;
    }

  });

});
</script>

</body>
</html>
