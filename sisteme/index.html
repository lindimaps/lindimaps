<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINDIMAPS - Paneli i Sistemeve</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .logo-gradient {
            background: linear-gradient(to right, #3b82f6, #2dd4bf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes pulse-dot {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .animate-dot {
            animation: pulse-dot 2s infinite ease-in-out;
            transform-origin: center;
        }

        .system-card:hover {
            border-color: #3b82f6;
            transform: translateY(-4px);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-6 text-slate-900">

    <!-- LOGO KRYESORE -->
    <header class="mb-20 flex flex-col items-center">
        <div class="flex items-center gap-3 group cursor-default">
            <div class="h-14 w-14 flex items-center justify-center bg-slate-900 rounded-xl shadow-lg">

                    <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z" fill="white" fill-opacity="0.15"/>
                    <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                    <circle class="animate-dot" cx="12" cy="11" r="2.5" fill="#3b82f6" stroke="white" stroke-width="1.2"/>
                </svg>
            </div>
            <div class="flex flex-col">
                <h1 class="text-3xl font-black tracking-tighter leading-none">
                    <span>LINDI</span><span class="logo-gradient">MAPS</span>
                </h1>
                <span class="text-[10px] uppercase tracking-[0.4em] font-bold text-slate-400 mt-1">
                    Spatial Intelligence
                </span>
            </div>
        </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 w-full max-w-6xl">
        
        <!-- AKTIVITETET -->

            <div class="flex items-center gap-2 mb-2">
                <h2 class="text-2xl font-black tracking-tighter leading-none italic">
                    <span>LINDI</span><span class="logo-gradient">MAPS</span>
                </h2>
            </div>
            <span class="text-[10px] uppercase tracking-[0.3em] font-bold text-blue-500 mb-8">

            <p class="text-slate-400 text-xs text-center mb-6 uppercase tracking-widest font-semibold">Sistemi ASIG</p>
            <div class="mt-auto h-10 w-10 rounded-full bg-slate-50 flex items-center justify-center group-hover:bg-blue-600 group-hover:text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </div>

            <div class="mt-auto h-10 w-10 rounded-full bg-slate-50 flex items-center justify-center group-hover:bg-blue-600 group-hover:text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />

            <div class="mt-auto h-10 w-10 rounded-full bg-slate-50 flex items-center justify-center group-hover:bg-blue-600 group-hover:text-white transition-colors">

    </footer>

</body>
</html>
