<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LindiMaps Aktivitete</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
body { font-family: 'Plus Jakarta Sans', sans-serif; }
.glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
.tab-active { color: #3b82f6; border-bottom: 3px solid #3b82f6; }
.logo-gradient { background: linear-gradient(to right, #3b82f6, #2dd4bf); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
@keyframes pulse-dot { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
.animate-dot { animation: pulse-dot 2s infinite ease-in-out; transform-origin: center; }
.admin-badge { background: #fee2e2; color: #ef4444; font-size: 8px; padding: 2px 6px; border-radius: 4px; font-weight: 800; margin-left: 5px; }
.status-approved { color: #10b981; }
.status-pending { color: #f59e0b; }
</style>
</head>
<body class="bg-[#f8fafc] min-h-screen pb-24 text-slate-900">

<!-- AUTHENTICATION OVERLAY -->
<div id="auth-overlay" class="fixed inset-0 z-[400] bg-white flex items-center justify-center p-6 hidden">
<div class="max-w-md w-full space-y-8">
    <div class="flex items-center gap-3 justify-center mb-4">
        <div class="h-14 w-14 flex items-center justify-center bg-slate-900 rounded-2xl shadow-xl">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z" fill="white" fill-opacity="0.15"/>
                <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                <circle class="animate-dot" cx="12" cy="11" r="2.5" fill="#3b82f6" stroke="white" stroke-width="1.2"/>
            </svg>
        </div>
        <div class="flex flex-col">
            <h1 class="text-3xl font-black tracking-tighter leading-none">
                <span class="text-slate-900">LINDI</span><span class="logo-gradient">MAPS</span>
            </h1>
            <span class="text-[10px] uppercase tracking-[0.4em] font-bold text-slate-400 mt-1">Sistemi Aktivitete</span>
        </div>
    </div>

    <div id="login-section" class="space-y-4">
        <h2 class="text-center font-extrabold text-slate-800 text-xl">Mirësevini përsëri</h2>
        <input id="login-email" type="email" placeholder="Email" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 font-bold focus:bg-white outline-none">
        <input id="login-password" type="password" placeholder="Fjalëkalimi" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 font-bold focus:bg-white outline-none">
        <button id="login-btn" class="w-full bg-slate-900 text-white p-5 rounded-2xl font-bold shadow-lg hover:bg-indigo-700 active:scale-95 transition-all">Hyr në Sistem</button>
        <div class="flex justify-between px-2 text-[11px] font-bold text-slate-400">
            <button onclick="showAuthSection('reset')" class="hover:text-blue-600">Harrova fjalëkalimin</button>
            <button onclick="showAuthSection('signup')" class="text-blue-600">Krijo llogari</button>
        </div>
    </div>

    <div id="signup-section" class="hidden space-y-4">
        <h2 class="text-center font-extrabold text-slate-800 text-xl">Regjistrohu</h2>
        <input id="signup-email" type="email" placeholder="Email i ri" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 font-bold focus:bg-white outline-none">
        <input id="signup-password" type="password" placeholder="Fjalëkalimi i ri" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 font-bold focus:bg-white outline-none">
        <button id="signup-btn" class="w-full bg-blue-600 text-white p-5 rounded-2xl font-bold shadow-lg hover:bg-blue-700 active:scale-95 transition-all">Krijo Llogarinë</button>
        <div class="text-center"><button onclick="showAuthSection('login')" class="text-[11px] font-bold text-slate-400 hover:text-slate-900 uppercase tracking-widest">Kthehu te Logimi</button></div>
    </div>

    <div id="reset-section" class="hidden space-y-4">
        <h2 class="text-center font-extrabold text-slate-800 text-xl">Rivendos Fjalëkalimin</h2>
        <p class="text-center text-xs text-slate-500 font-medium">Shkruani email-in tuaj për të marrë linkun e rivendosjes.</p>
        <input id="reset-email" type="email" placeholder="Email-i juaj" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 font-bold focus:bg-white outline-none">
        <button id="reset-btn" class="w-full bg-slate-900 text-white p-5 rounded-2xl font-bold shadow-lg hover:bg-black active:scale-95 transition-all">Dërgo Linkun</button>
        <div class="text-center"><button onclick="showAuthSection('login')" class="text-[11px] font-bold text-slate-400 hover:text-slate-900 uppercase tracking-widest">Anulo</button></div>
    </div>
</div>
</div>

<div id="custom-alert" class="hidden fixed inset-0 z-[500] bg-black/50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl">
        <p id="alert-message" class="font-bold text-slate-800"></p>
        <button onclick="closeAlert()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold">Kuptova</button>
    </div>
</div>

<div id="confirm-modal" class="hidden fixed inset-0 z-[600] bg-black/50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center space-y-6 shadow-2xl">
        <h3 class="text-xl font-extrabold text-slate-800">A jeni i sigurt?</h3>
        <p id="confirm-message" class="text-slate-500 font-medium text-sm"></p>
        <div class="flex gap-3">
            <button onclick="closeConfirm()" class="flex-1 bg-slate-100 text-slate-600 py-3 rounded-xl font-bold">Anulo</button>
            <button id="confirm-yes-btn" class="flex-1 bg-red-500 text-white py-3 rounded-xl font-bold">Fshije</button>
        </div>
    </div>
</div>

<div id="loading" class="fixed inset-0 bg-white/95 z-[300] flex items-center justify-center">
    <div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-600 border-t-transparent"></div>
</div>

<div id="app-content" class="hidden">
    <header class="glass-card sticky top-0 z-50 px-6 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="h-8 w-8 flex items-center justify-center bg-slate-900 rounded-lg shadow">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z" fill="white" fill-opacity="0.15"/>
                    <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                    <circle cx="12" cy="11" r="2.5" fill="#3b82f6" stroke="white" stroke-width="1.2"/>
                </svg>
            </div>
            <div class="flex flex-col">
                <span class="font-black text-sm tracking-tighter leading-none">LINDI<span class="logo-gradient">MAPS</span><span id="role-indicator"></span></span>
                <span id="user-display" class="text-[7px] uppercase font-bold text-slate-400 tracking-widest"></span>
            </div>
        </div>
        <button onclick="logout()" class="text-[10px] font-bold text-slate-400 uppercase hover:text-red-500">Dil</button>
    </header>

    <nav class="bg-white border-b border-slate-100 flex overflow-x-auto">
        <button onclick="switchTab('log')" id="tab-log" class="flex-1 py-4 text-xs font-extrabold uppercase tracking-widest tab-active">Regjistrim Ditor</button>
        <button onclick="switchTab('reports')" id="tab-reports" class="flex-1 py-4 text-xs font-extrabold uppercase tracking-widest text-slate-400">Raporte</button>
        <button onclick="switchTab('config')" id="tab-config" class="flex-1 py-4 text-xs font-extrabold uppercase tracking-widest text-slate-400 hidden">Struktura</button>
    </nav>

    <main class="max-w-3xl mx-auto p-4 md:p-8 space-y-8">
        <div id="view-log" class="space-y-6">
            <div class="glass-card rounded-[2rem] p-6 shadow-xl space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Data</label>
                        <input id="log-date" type="date" class="w-full p-4 rounded-2xl bg-slate-50 border-slate-100 font-bold">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Eksperti</label>
                        <select id="log-operator-select" class="w-full p-4 rounded-2xl bg-slate-50 border-slate-100 font-bold"></select>
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Aktiviteti</label>
                    <select id="log-act-select" onchange="generateProcessFields()" class="w-full p-4 rounded-2xl bg-slate-50 border-slate-100 font-bold"></select>
                </div>
                <div id="dynamic-fields-container" class="space-y-4 pt-4 border-t border-slate-50"></div>
                <div class="pt-4 border-t border-slate-50 grid grid-cols-2 gap-4">
                    <input id="log-start-time" type="time" onchange="calculateHours()" class="p-4 rounded-2xl bg-slate-50 font-bold">
                    <input id="log-end-time" type="time" onchange="calculateHours()" class="p-4 rounded-2xl bg-slate-50 font-bold">
                </div>
                <div class="space-y-2">
                    <label class="text-[11px] font-extrabold text-slate-400 uppercase">Total Orë Pune</label>
                    <input id="log-hours" type="number" step="0.1" class="w-full p-4 rounded-2xl bg-blue-50 text-blue-600 font-black text-xl border-none">
                </div>
                <input type="hidden" id="log-edit-id">
                <button id="save-log-btn" class="w-full bg-slate-900 text-white p-5 rounded-[1.5rem] font-bold shadow-lg">Ruaj Aktivitetin</button>
                <button id="cancel-log-edit" class="hidden w-full bg-slate-200 text-slate-600 p-4 rounded-[1.5rem] font-bold" onclick="cancelLogEdit()">Anulo</button>
            </div>
        </div>

        <div id="view-config" class="hidden space-y-8">
            <div class="glass-card rounded-[2rem] p-8 space-y-6">
                <div class="flex justify-between items-center"><h2 id="config-title" class="text-xl font-extrabold text-slate-800">Shto Aktivitet</h2><button id="cancel-edit-btn" class="hidden text-xs font-bold text-red-500 uppercase" onclick="resetConfigForm()">Anulo</button></div>
                <input id="edit-id" type="hidden">
                <input id="new-act-name" type="text" placeholder="Emri i Aktivitetit" class="w-full p-4 rounded-xl bg-slate-50 font-bold">
                <textarea id="new-act-processes" placeholder="Bashkia:tekst&#10;Kati:numër" class="w-full p-4 rounded-xl bg-slate-50 h-32"></textarea>
                <button id="add-act-btn" class="w-full bg-blue-600 text-white p-4 rounded-xl font-bold">Ruaj Strukturën</button>
            </div>
            <div id="config-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            <div class="glass-card rounded-[2rem] p-8 space-y-6 border-t-4 border-slate-900">
                <h2 class="text-xl font-extrabold text-slate-800">Ekspertët</h2>
                <div class="flex gap-2"><input id="new-op-name" type="text" placeholder="Emri" class="flex-1 p-4 rounded-xl bg-slate-50 font-bold"><button id="add-op-btn" class="bg-slate-900 text-white px-6 rounded-xl font-bold">Shto</button></div>
                <div id="operator-list" class="flex flex-wrap gap-2 pt-2"></div>
            </div>
        </div>

        <div id="view-reports" class="hidden space-y-6">
            <div class="glass-card rounded-[2rem] p-6 space-y-4">
                <div class="grid grid-cols-2 gap-2">
                    <input id="rep-start" type="date" onchange="renderReportList()" class="p-3 rounded-xl bg-slate-50 text-[10px]">
                    <input id="rep-end" type="date" onchange="renderReportList()" class="p-3 rounded-xl bg-slate-50 text-[10px]">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <select id="rep-op-select" onchange="handleMainFilters()" class="p-3 rounded-xl bg-slate-50 text-[10px] font-bold"></select>
                    <select id="rep-act-select" onchange="handleMainFilters()" class="p-3 rounded-xl bg-slate-50 text-[10px] font-bold"></select>
                </div>
                <div id="rep-dynamic-filters" class="grid grid-cols-2 md:grid-cols-3 gap-2"></div>
                <div id="report-totals" class="grid grid-cols-4 gap-2 pt-2 border-t text-center">
                    <div class="p-2 bg-slate-50 rounded-xl"><p class="text-[7px] font-bold text-slate-400 uppercase">Orë</p><p id="total-hours-val" class="text-xs font-black">0</p></div>
                    <div class="p-2 bg-slate-50 rounded-xl"><p class="text-[7px] font-bold text-slate-400 uppercase">Ditë</p><p id="total-days-val" class="text-xs font-black">0</p></div>
                    <div class="p-2 bg-slate-50 rounded-xl"><p class="text-[7px] font-bold text-slate-400 uppercase">Raporte</p><p id="total-count-val" class="text-xs font-black">0</p></div>
                    <div class="p-2 bg-slate-50 rounded-xl"><p class="text-[7px] font-bold text-slate-400 uppercase">Unik</p><p id="total-unique-val" class="text-xs font-black">0</p></div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="renderReportList()" class="bg-slate-900 text-white p-4 rounded-xl font-bold text-[10px] uppercase">Rifresko</button>
                    <button onclick="exportToPDF()" class="bg-blue-600 text-white p-4 rounded-xl font-bold text-[10px] uppercase">Shkarko PDF</button>
                </div>
            </div>
            <div id="report-results" class="space-y-4"></div>
        </div>
    </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDoc, deleteDoc, onSnapshot, query, where, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD8BxXSdcnnzJPtFHHq0eKjHXWjBkZq5Mc",
  authDomain: "lindimapsenterprise.firebaseapp.com",
  projectId: "lindimapsenterprise",
  storageBucket: "lindimapsenterprise.firebasestorage.app",
  appId: "1:109088070908:web:8c1b041656e6b7e3900b79"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const appId = "lindi-maps-enterprise-v1";

let configData = [];
let logData = [];
let operatorData = [];
let userRole = 'user';

// BËJMË FUNKSIONET TË DISPONUESHME GLOBALISHT
window.approveLog = async (id) => { 
    try {
        await updateDoc(doc(db, `artifacts/${appId}/public/data/logs`, id), { status: 'approved' });
    } catch (e) {
        console.error("Gabim gjatë miratimit:", e);
    }
};

window.showAuthSection = (s) => {
    ['login-section', 'signup-section', 'reset-section'].forEach(id => document.getElementById(id).classList.add('hidden'));
    document.getElementById(s + '-section').classList.remove('hidden');
};

document.getElementById('login-btn').onclick = async () => {
    const e = document.getElementById('login-email').value;
    const p = document.getElementById('login-password').value;
    try { await signInWithEmailAndPassword(auth, e, p); } catch { showAlert("Email ose fjalëkalim i pasaktë."); }
};

document.getElementById('signup-btn').onclick = async () => {
    const e = document.getElementById('signup-email').value;
    const p = document.getElementById('signup-password').value;
    try {
        const c = await createUserWithEmailAndPassword(auth, e, p);
        await setDoc(doc(db, `artifacts/${appId}/users`, c.user.uid), { email: e, role: 'user', uid: c.user.uid });
        showAlert("U regjistrua! Prisni konfirmimin.");
    } catch (e) { showAlert(e.message); }
};

document.getElementById('reset-btn').onclick = async () => {
    const email = document.getElementById('reset-email').value.trim();
    if (!email) return showAlert("Ju lutem shkruani email-in.");
    try {
        await sendPasswordResetEmail(auth, email);
        showAlert("Linku i rivendosjes u dërgua në email.");
        showAuthSection('login');
    } catch (e) { showAlert("Gabim: " + e.message); }
};

onAuthStateChanged(auth, async (u) => {
    document.getElementById('loading').classList.add('hidden');
    if (u) {
        const docRef = await getDoc(doc(db, `artifacts/${appId}/users`, u.uid));
        userRole = docRef.exists() ? docRef.data().role : 'user';
        document.getElementById('role-indicator').innerHTML = userRole === 'admin' ? '<span class="admin-badge">ADMIN</span>' : '';
        document.getElementById('user-display').innerText = u.email;
        if(userRole === 'admin') document.getElementById('tab-config').classList.remove('hidden');
        document.getElementById('app-content').classList.remove('hidden');
        document.getElementById('auth-overlay').classList.add('hidden');
        startListening();
    } else {
        document.getElementById('app-content').classList.add('hidden');
        document.getElementById('auth-overlay').classList.remove('hidden');
        showAuthSection('login');
    }
});

function startListening() {
    const base = `artifacts/${appId}/public/data`;
    onSnapshot(collection(db, base, 'config'), snap => {
        configData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        updateDropdowns();
        renderConfigList();
    });
    onSnapshot(collection(db, base, 'operators'), snap => {
        operatorData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        updateDropdowns();
        renderOperatorList();
    });
    const logsRef = collection(db, base, 'logs');
    const q = userRole === 'admin' ? query(logsRef) : query(logsRef, where("creatorUid", "==", auth.currentUser.uid));
    onSnapshot(q, snap => {
        logData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderReportList();
    });
}

window.handleMainFilters = () => {
    updateDynamicDropdowns();
    renderReportList();
};

function updateDynamicDropdowns() {
    const selOp = document.getElementById('rep-op-select').value;
    const selAct = document.getElementById('rep-act-select').value;
    const cont = document.getElementById('rep-dynamic-filters');
    cont.innerHTML = "";
    if (!selAct) return;
    const activity = configData.find(c => c.id === selAct);
    if (!activity) return;
    let pool = logData.filter(l => l.actId === selAct);
    if (selOp) pool = pool.filter(l => l.operator === selOp);
    activity.processes.forEach(p => {
        const vals = [...new Set(pool.flatMap(l => l.processes.filter(pr => pr.label === p.label).map(pr => pr.value)))].filter(v => v).sort();
        let html = `<option value="">${p.label}: Gjithë</option>`;
        vals.forEach(v => html += `<option value="${v}">${v}</option>`);
        const s = document.createElement('select');
        s.className = "rep-proc-filter p-2 rounded-lg bg-slate-50 text-[9px] font-bold";
        s.dataset.filterLabel = p.label;
        s.innerHTML = html;
        s.onchange = renderReportList;
        cont.appendChild(s);
    });
}

window.renderReportList = () => {
    const filtered = getFilteredLogs();
    const hrs = filtered.reduce((a, c) => a + (c.hours || 0), 0);
    const dys = [...new Set(filtered.map(f => f.date))].length;
    const unq = [...new Set(filtered.map(f => f.actId))].length;
    document.getElementById('total-hours-val').innerText = hrs.toFixed(1);
    document.getElementById('total-days-val').innerText = dys;
    document.getElementById('total-count-val').innerText = filtered.length;
    document.getElementById('total-unique-val').innerText = unq;

    document.getElementById('report-results').innerHTML = filtered.map((l, idx) => `
    <div class="bg-white p-5 rounded-[2rem] border border-slate-100 shadow-sm ${l.status === 'approved' ? 'border-l-4 border-l-green-400' : ''}">
        <div class="flex justify-between items-start">
            <div>
                <span class="text-[9px] font-black bg-blue-50 text-blue-600 px-2 py-1 rounded">NR. ${filtered.length - idx}</span>
                <h4 class="font-bold text-slate-800 text-sm mt-1">${l.actName} - ${l.operator}</h4>
                <p class="text-[10px] text-slate-400 font-bold">${l.date}</p>
            </div>
            <div class="flex gap-2">
                ${userRole === 'admin' && l.status !== 'approved' ? `<button onclick="window.approveLog('${l.id}')" class="text-green-500 text-[10px] font-black uppercase tracking-tighter">MIRATO</button>` : ''}
                ${l.status === 'approved' ? '<span class="text-green-500 text-[9px] font-black">✓ OK</span>' : ''}
                <button onclick="editLogEntry('${l.id}')" class="text-blue-500 text-[9px] font-bold">EDITO</button>
                <button onclick="deleteItem('logs', '${l.id}')" class="text-red-300 font-bold">&times;</button>
            </div>
        </div>
        <div class="grid grid-cols-2 gap-2 border-t pt-2 mt-2">${l.processes.map(p => `<div class="text-[9px]"><b>${p.label}:</b> ${p.value}</div>`).join("")}</div>
        <div class="flex justify-between text-[10px] font-black text-blue-600 mt-2"><span>${l.startTime} - ${l.endTime}</span><span>${l.hours} ORË</span></div>
    </div>
    `).join("");
};

window.getFilteredLogs = () => {
    const s = document.getElementById('rep-start').value;
    const e = document.getElementById('rep-end').value;
    const o = document.getElementById('rep-op-select').value;
    const a = document.getElementById('rep-act-select').value;
    const dyn = Array.from(document.querySelectorAll('.rep-proc-filter'));
    let f = [...logData].sort((a,b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
    if(s) f = f.filter(x => x.date >= s);
    if(e) f = f.filter(x => x.date <= e);
    if(o) f = f.filter(x => x.operator === o);
    if(a) f = f.filter(x => x.actId === a);
    dyn.forEach(sel => {
        if(sel.value) f = f.filter(l => l.processes.some(p => p.label === sel.dataset.filterLabel && p.value == sel.value));
    });
    return f;
};

document.getElementById('save-log-btn').onclick = async () => {
    const aid = document.getElementById('log-act-select').value;
    const d = document.getElementById('log-date').value;
    const op = document.getElementById('log-operator-select').value;
    const h = document.getElementById('log-hours').value;
    if(!aid || !d || !op || !h) return showAlert("Plotësoni të gjitha fushat.");
    const procs = Array.from(document.querySelectorAll('.process-input')).map(i => ({ label: i.dataset.label, value: i.value }));
    const id = document.getElementById('log-edit-id').value || Date.now().toString();
    await setDoc(doc(db, `artifacts/${appId}/public/data/logs`, id), {
        actId: aid, actName: configData.find(c => c.id === aid).name,
        date: d, operator: op, hours: parseFloat(h),
        startTime: document.getElementById('log-start-time').value,
        endTime: document.getElementById('log-end-time').value,
        processes: procs, creatorUid: auth.currentUser.uid, status: 'pending'
    });
    cancelLogEdit();
};

window.calculateHours = () => {
    const s = document.getElementById('log-start-time').value;
    const e = document.getElementById('log-end-time').value;
    if(s && e) {
        let diff = (new Date(`1970-01-01T${e}`) - new Date(`1970-01-01T${s}`)) / 3600000;
        if(diff < 0) diff += 24;
        document.getElementById('log-hours').value = diff.toFixed(1);
    }
};

window.generateProcessFields = (m = null) => {
    const id = document.getElementById('log-act-select').value;
    const cont = document.getElementById('dynamic-fields-container');
    cont.innerHTML = "";
    if(!id) return;
    configData.find(c => c.id === id).processes.forEach(p => {
        cont.innerHTML += `<div class="space-y-1"><label class="text-[9px] font-black text-slate-500 uppercase">${p.label}</label>
        <input type="text" data-label="${p.label}" value="${m ? (m[p.label] || "") : ""}" class="process-input w-full p-4 rounded-xl bg-white border border-slate-100 font-bold text-xs"></div>`;
    });
};

window.cancelLogEdit = () => {
    document.getElementById('log-edit-id').value = "";
    document.getElementById('log-act-select').value = "";
    document.getElementById('dynamic-fields-container').innerHTML = "";
    document.getElementById('cancel-log-edit').classList.add('hidden');
    document.getElementById('save-log-btn').innerText = "Ruaj Aktivitetin";
};

window.editLogEntry = (id) => {
    const l = logData.find(x => x.id === id);
    if(!l) return;
    switchTab('log');
    document.getElementById('log-edit-id').value = id;
    document.getElementById('log-date').value = l.date;
    document.getElementById('log-operator-select').value = l.operator;
    document.getElementById('log-act-select').value = l.actId;
    document.getElementById('log-hours').value = l.hours;
    document.getElementById('log-start-time').value = l.startTime;
    document.getElementById('log-end-time').value = l.endTime;
    const m = {}; l.processes.forEach(p => m[p.label] = p.value);
    generateProcessFields(m);
    document.getElementById('cancel-log-edit').classList.remove('hidden');
    document.getElementById('save-log-btn').innerText = "Zëvendëso";
};

window.updateDropdowns = () => {
    const a = configData.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
    const o = operatorData.map(x => `<option value="${x.name}">${x.name}</option>`).join("");
    document.getElementById('log-act-select').innerHTML = `<option value="">-- Zgjidh --</option>` + a;
    document.getElementById('log-operator-select').innerHTML = `<option value="">-- Zgjidh --</option>` + o;
    document.getElementById('rep-op-select').innerHTML = `<option value="">Eksperti: Të gjithë</option>` + o;
    document.getElementById('rep-act-select').innerHTML = `<option value="">Aktiviteti: Të gjithë</option>` + a;
};

window.renderConfigList = () => {
    document.getElementById('config-list').innerHTML = configData.map(c => `
    <div class="bg-white p-5 rounded-2xl border border-slate-100 flex justify-between items-center">
        <h4 class="font-bold text-slate-800 text-sm">${c.name}</h4>
        <div class="flex gap-2">
            <button onclick="editConfig('${c.id}')" class="text-blue-500 text-xs font-bold">EDITO</button>
            <button onclick="deleteItem('config', '${c.id}')" class="text-red-400 font-bold">&times;</button>
        </div>
    </div>`).join("");
};

window.editConfig = (id) => {
    const c = configData.find(x => x.id === id);
    document.getElementById('edit-id').value = id;
    document.getElementById('new-act-name').value = c.name;
    document.getElementById('new-act-processes').value = c.processes.map(p => `${p.label}:${p.type === 'text' ? 'tekst' : 'numër'}`).join("\n");
    document.getElementById('config-title').innerText = "Edito Aktivitetin";
    document.getElementById('cancel-edit-btn').classList.remove('hidden');
};

window.resetConfigForm = () => {
    document.getElementById('edit-id').value = "";
    document.getElementById('new-act-name').value = "";
    document.getElementById('new-act-processes').value = "";
    document.getElementById('config-title').innerText = "Shto Aktivitet";
    document.getElementById('cancel-edit-btn').classList.add('hidden');
};

document.getElementById('add-act-btn').onclick = async () => {
    const n = document.getElementById('new-act-name').value;
    const r = document.getElementById('new-act-processes').value;
    const id = document.getElementById('edit-id').value || Date.now().toString();
    const p = r.split('\n').map(l => {
        const parts = l.split(':');
        return { label: parts[0]?.trim(), type: parts[1]?.trim() === 'tekst' ? 'text' : 'number' };
    }).filter(x => x.label);
    await setDoc(doc(db, `artifacts/${appId}/public/data/config`, id), { name: n, processes: p });
    resetConfigForm();
};

window.renderOperatorList = () => {
    document.getElementById('operator-list').innerHTML = operatorData.map(o => `
    <div class="bg-slate-100 px-4 py-2 rounded-xl flex items-center gap-2">
        <span class="text-xs font-bold">${o.name}</span>
        <button onclick="deleteItem('operators', '${o.id}')" class="text-red-400 font-bold">&times;</button>
    </div>`).join("");
};

document.getElementById('add-op-btn').onclick = async () => {
    const n = document.getElementById('new-op-name').value;
    if(n) await setDoc(doc(db, `artifacts/${appId}/public/data/operators`, Date.now().toString()), { name: n });
    document.getElementById('new-op-name').value = "";
};

window.deleteItem = (c, id) => {
    askConfirm("Dëshironi ta fshini këtë rekord?", async () => { await deleteDoc(doc(db, `artifacts/${appId}/public/data/${c}`, id)); });
};

window.exportToPDF = () => {
    const { jsPDF } = window.jspdf;
    const docPDF = new jsPDF('l');
    const filtered = getFilteredLogs();
    const hrs = filtered.reduce((a, c) => a + (c.hours || 0), 0);
    const dys = [...new Set(filtered.map(f => f.date))].length;
    const unq = [...new Set(filtered.map(f => f.actId))].length;

    docPDF.setFontSize(16);
    docPDF.text("RAPORT AKTIVITETESH - LINDI MAPS", 14, 15);
    
    const headers = [['Nr.', 'Data', 'Eksperti', 'Aktiviteti', 'Detajet e Raportimit', 'Orë', 'Statusi']];
    const data = filtered.map((f, i) => [
        filtered.length - i,
        f.date,
        f.operator,
        f.actName,
        f.processes.map(p => `${p.label}: ${p.value}`).join(" | "),
        f.hours,
        f.status === 'approved' ? 'OK' : '...'
    ]);

    docPDF.autoTable({
        startY: 25,
        head: headers,
        body: data,
        theme: 'grid',
        styles: { fontSize: 7 },
        headStyles: { fillColor: [30, 41, 59] }
    });

    const finalY = docPDF.lastAutoTable.finalY + 10;
    docPDF.setFontSize(10);
    docPDF.text(`PËRMBLEDHJE TOTALE:`, 14, finalY);
    docPDF.text(`1. Total Aktivitete (Raporte): ${filtered.length}`, 14, finalY + 7);
    docPDF.text(`2. Aktivitete Unike të kryera: ${unq}`, 14, finalY + 14);
    docPDF.text(`3. Total Orë Pune: ${hrs.toFixed(1)} orë`, 14, finalY + 21);
    docPDF.text(`4. Total Ditë Pune: ${dys} ditë`, 14, finalY + 28);

    docPDF.save(`Raport_LindiMaps_${new Date().getTime()}.pdf`);
};

window.showAlert = (m) => { document.getElementById('alert-message').innerText = m; document.getElementById('custom-alert').classList.remove('hidden'); };
window.closeAlert = () => document.getElementById('custom-alert').classList.add('hidden');
window.askConfirm = (m, cb) => { document.getElementById('confirm-message').innerText = m; window.deleteCallback = cb; document.getElementById('confirm-modal').classList.remove('hidden'); };
window.closeConfirm = () => document.getElementById('confirm-modal').classList.add('hidden');
document.getElementById('confirm-yes-btn').onclick = () => { if(window.deleteCallback) window.deleteCallback(); closeConfirm(); };
window.switchTab = (t) => {
    ['view-log', 'view-config', 'view-reports'].forEach(v => document.getElementById(v).classList.add('hidden'));
    ['tab-log', 'tab-config', 'tab-reports'].forEach(id => document.getElementById(id).classList.replace('tab-active', 'text-slate-400'));
    document.getElementById('view-' + t).classList.remove('hidden');
    document.getElementById('tab-' + t).classList.replace('text-slate-400', 'tab-active');
};
window.logout = () => signOut(auth);
document.getElementById('log-date').value = new Date().toISOString().split('T')[0];
</script>
</body>
</html>
