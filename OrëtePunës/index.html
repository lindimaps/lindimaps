<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistemi i Pagave PRO+</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body { font-family: Arial; }
.spinner { border: 3px solid #eee; border-top: 3px solid #4f46e5; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
@keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>

<body class="bg-gray-100">

<div id="loading" class="fixed inset-0 flex items-center justify-center bg-white z-50">
<div class="spinner"></div>
</div>

<div id="app" class="hidden max-w-6xl mx-auto p-6">

<h1 class="text-2xl font-bold mb-4">Sistemi i Pagave PRO+</h1>

<!-- ACTIONS -->
<div class="flex flex-wrap gap-2 mb-4">
<button onclick="exportPDF()" class="bg-indigo-600 text-white px-4 py-2 rounded">Export PDF</button>
<button onclick="backupData()" class="bg-green-600 text-white px-4 py-2 rounded">Backup</button>

<select id="workerFilter" onchange="renderTotals()" class="border p-2 rounded">
<option value="">Të gjithë</option>
</select>
</div>

<!-- ADD -->
<div class="bg-white p-4 rounded shadow mb-4 flex gap-2">
<input id="name" placeholder="Emri" class="border p-2 flex-1">
<input id="rate" type="number" placeholder="€/h" class="border p-2 w-24">
<button onclick="addWorker()" class="bg-blue-500 text-white px-4">Shto</button>
</div>

<!-- DAILY -->
<div class="bg-white p-4 rounded shadow mb-4">
<input type="date" id="date" class="border p-2 mb-2">
<div id="daily"></div>
<button onclick="saveHours()" class="mt-2 w-full bg-black text-white p-2">Ruaj</button>
</div>

<!-- TOTALS -->
<div class="bg-white p-4 rounded shadow">
<input type="date" id="start" class="border p-2">
<input type="date" id="end" class="border p-2">
<div id="totals" class="mt-2"></div>
<div class="font-bold mt-3">
Total: <span id="money">0€</span> | <span id="hours">0h</span>
</div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

const firebaseConfig = {
 apiKey: "AIzaSyDGlHCPxysEO4ZxxIPic3u7rRZCo7oZTZ4",
 authDomain: "workhours-fb74a.firebaseapp.com",
 projectId: "workhours-fb74a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let user, workers=[], logs=[];

// AUTH
onAuthStateChanged(auth, u=>{
 if(u){ user=u; start(); }
 else signInAnonymously(auth);
});

function start(){
 document.getElementById("loading").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");

 const base=`users/${user.uid}`;

 onSnapshot(collection(db, base+"/workers"), snap=>{
  workers = snap.docs.map(d=>({id:d.id,...d.data()}));
  fillFilter();
  renderDaily();
  renderTotals();
 });

 onSnapshot(collection(db, base+"/logs"), snap=>{
  logs = snap.docs.map(d=>({id:d.id,...d.data()}));
  renderDaily();
  renderTotals();
 });
}

// FILTER
function fillFilter(){
 const f=document.getElementById("workerFilter");
 f.innerHTML='<option value="">Të gjithë</option>';
 workers.forEach(w=>{
  f.innerHTML+=`<option value="${w.id}">${w.name}</option>`;
 });
}

// ADD
window.addWorker = async ()=>{
 const n=name.value;
 const r=parseFloat(rate.value);
 if(!n||!r) return;
 await setDoc(doc(db, `users/${user.uid}/workers`, Date.now().toString()), {name:n,rate:r});
};

// DAILY
window.renderDaily = ()=>{
 const d=date.value;
 daily.innerHTML = workers.map(w=>{
  const l=logs.find(x=>x.date===d&&x.workerId===w.id);
  return `<div class="flex justify-between mb-2">
   <span>${w.name}</span>
   <input type="number" step="0.5" data-id="${w.id}" value="${l?l.hours:''}" class="border w-20 text-center">
  </div>`;
 }).join('');
};

// SAVE
window.saveHours = async ()=>{
 const d=date.value;
 document.querySelectorAll("#daily input").forEach(async i=>{
  const h=parseFloat(i.value)||0;
  const id=i.dataset.id;
  const ref=doc(db, `users/${user.uid}/logs`, d+"_"+id);
  if(h>0) await setDoc(ref,{date:d,workerId:id,hours:h});
  else await deleteDoc(ref);
 });
 alert("Ruajtur!");
};

// TOTALS
window.renderTotals = ()=>{
 const s=start.value,e=end.value,f=workerFilter.value;
 let tH=0,tM=0;

 totals.innerHTML = workers.filter(w=>!f||w.id===f).map(w=>{
  const wl=logs.filter(l=>l.workerId===w.id&&l.date>=s&&l.date<=e);
  const h=wl.reduce((a,b)=>a+b.hours,0);
  const m=h*w.rate;
  tH+=h;tM+=m;
  return `<div class="flex justify-between border-b py-1">
   <span>${w.name}</span>
   <span>${h}h | ${m.toFixed(2)}€</span>
  </div>`;
 }).join('');

 hours.innerText=tH+"h";
 money.innerText=tM.toFixed(2)+"€";
};

// PDF
window.exportPDF = ()=>{
 const { jsPDF } = window.jspdf;
 const doc = new jsPDF();
 doc.text("Raport Pagash", 10,10);
 let y=20;

 workers.forEach(w=>{
  const h=logs.filter(l=>l.workerId===w.id).reduce((a,b)=>a+b.hours,0);
  const m=h*w.rate;
  doc.text(`${w.name} - ${h}h - ${m.toFixed(2)}€`,10,y);
  y+=10;
 });

 doc.save("raport.pdf");
};

// BACKUP
window.backupData = ()=>{
 const data = {workers,logs};
 const blob = new Blob([JSON.stringify(data)], {type:"application/json"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="backup.json";
 a.click();
};

// DEFAULT DATE
const t=new Date().toISOString().slice(0,10);
date.value=t;
start.value=t.slice(0,8)+"01";
end.value=t;

date.onchange=renderDaily;

</script>

</body>
</html>
