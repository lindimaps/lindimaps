<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payroll System Pro</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body class="bg-slate-100">

<!-- LOGIN -->
<div id="login" class="flex items-center justify-center h-screen">
<div class="bg-white p-6 rounded-2xl shadow w-80 space-y-3">
<h2 class="text-xl font-bold text-center">Login</h2>

<input id="email" placeholder="Email" class="w-full border p-2 rounded">
<input id="password" type="password" placeholder="Password" class="w-full border p-2 rounded">

<button onclick="loginUser()" class="w-full bg-indigo-600 text-white p-2 rounded">Login</button>
<button onclick="registerUser()" class="w-full bg-gray-200 p-2 rounded">Register</button>
</div>
</div>

<!-- APP -->
<div id="app" class="hidden max-w-6xl mx-auto p-6">

<!-- HEADER -->
<div class="flex justify-between mb-4">
<span id="userEmail"></span>
<button onclick="logout()" class="bg-red-500 text-white px-3 py-1 rounded">Logout</button>
</div>

<!-- ACTIONS -->
<div class="flex flex-wrap gap-2 mb-4">
<input type="month" id="pdfMonth" class="border p-2 rounded">
<button onclick="exportPDF()" class="bg-indigo-600 text-white px-3 py-2 rounded">PDF Mujor</button>
<button onclick="backupData()" class="bg-green-600 text-white px-3 py-2 rounded">Backup</button>
</div>

<!-- ADD WORKER -->
<div class="bg-white p-4 rounded mb-4 flex gap-2">
<input id="name" placeholder="Emri" class="border p-2 flex-1">
<input id="rate" type="number" placeholder="€/h" class="border p-2 w-24">
<button onclick="addWorker()" class="bg-blue-500 text-white px-4">Shto</button>
</div>

<!-- DAILY -->
<div class="bg-white p-4 rounded mb-4">
<input type="date" id="date" class="border p-2 mb-2">
<div id="daily"></div>
<button onclick="saveHours()" class="w-full bg-black text-white p-2">Ruaj</button>
</div>

<!-- TOTALS -->
<div class="bg-white p-4 rounded">
<div class="flex gap-2 mb-2">
<input type="date" id="start" class="border p-2">
<input type="date" id="end" class="border p-2">
</div>

<div id="totals"></div>

<div class="font-bold mt-2">
<span id="totalMoney"></span> | <span id="totalHours"></span>
</div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDGlHCPxysEO4ZxxIPic3u7rRZCo7oZTZ4",
  authDomain: "workhours-fb74a.firebaseapp.com",
  projectId: "workhours-fb74a",
  storageBucket: "workhours-fb74a.appspot.com"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let user, workers = [], logs = [];

/* ---------------- AUTH ---------------- */

window.loginUser = async ()=>{
 try{
  await signInWithEmailAndPassword(
   auth,
   document.getElementById("email").value,
   document.getElementById("password").value
  );
 }catch(e){ alert(e.message); }
};

window.registerUser = async ()=>{
 try {
  const emailEl = document.getElementById("email");
  const passEl = document.getElementById("password");

  const email = emailEl ? emailEl.value.trim() : "";
  const password = passEl ? passEl.value : "";

  if(email === ""){
   alert("Shkruaj email!");
   return;
  }

  if(!email.includes("@")){
   alert("Email nuk është valid!");
   return;
  }

  if(password.length < 6){
   alert("Password duhet minimum 6 karaktere!");
   return;
  }

  await createUserWithEmailAndPassword(auth, email, password);

 } catch(e){
  alert("Firebase error: " + e.message);
 }
};

window.logout = async ()=>{
 try {
  await signOut(auth);

  user = null;
  workers = [];
  logs = [];

  document.getElementById("app").classList.add("hidden");
  document.getElementById("login").style.display = "flex";

  document.getElementById("userEmail").innerText = "";

 } catch(e){
  alert(e.message);
 }
};

onAuthStateChanged(auth, u=>{
 if(u){
  user = u;
  document.getElementById("login").style.display="none";
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("userEmail").innerText = u.email;
  start();
 }
});

/* ---------------- START ---------------- */

function start(){
 const base = `users/${user.uid}`;

 onSnapshot(collection(db, base+"/workers"), snap=>{
  workers = snap.docs.map(d=>({id:d.id,...d.data()}));
  renderDaily();
  renderTotals();
 });

 onSnapshot(collection(db, base+"/logs"), snap=>{
  logs = snap.docs.map(d=>({id:d.id,...d.data()}));
  renderDaily();
  renderTotals();
 });
}

/* ---------------- WORKERS ---------------- */

window.addWorker = async ()=>{
 const name = document.getElementById("name").value;
 const rate = parseFloat(document.getElementById("rate").value);

 if(!name || !rate) return alert("Plotëso fushat");

 await setDoc(doc(db, `users/${user.uid}/workers`, Date.now().toString()), {
  name,
  rate
 });

 document.getElementById("name").value="";
 document.getElementById("rate").value="";
};

/* ---------------- DAILY ---------------- */

window.renderDaily = ()=>{
 const date = document.getElementById("date").value;

 document.getElementById("daily").innerHTML = workers.map(w=>{
  const l = logs.find(x=>x.date===date && x.workerId===w.id);
  return `
  <div class="flex justify-between mb-2">
   <span>${w.name}</span>
   <input type="number" data-id="${w.id}" value="${l?l.hours:''}" class="border w-20 text-center">
  </div>`;
 }).join("");
};

window.saveHours = async ()=>{
 const date = document.getElementById("date").value;

 document.querySelectorAll("#daily input").forEach(async i=>{
  const h = parseFloat(i.value)||0;
  const id = i.dataset.id;

  const ref = doc(db, `users/${user.uid}/logs`, date+"_"+id);

  if(h>0) await setDoc(ref,{date,workerId:id,hours:h});
  else await deleteDoc(ref);
 });

 alert("Ruajtur!");
};

/* ---------------- TOTALS ---------------- */

window.renderTotals = ()=>{
 const start = document.getElementById("start").value;
 const end = document.getElementById("end").value;

 let tH=0, tM=0;

 document.getElementById("totals").innerHTML = workers.map(w=>{

  const wl = logs.filter(l=>{
    if(l.workerId !== w.id) return false;
    if(start && l.date < start) return false;
    if(end && l.date > end) return false;
    return true;
  });

  const h = wl.reduce((a,b)=>a+b.hours,0);
  const m = h * w.rate;

  tH += h;
  tM += m;

  return `<div class="flex justify-between">
   <span>${w.name}</span>
   <span>${h}h | ${m.toFixed(2)}€</span>
  </div>`;
 }).join("");

 document.getElementById("totalHours").innerText = tH+"h";
 document.getElementById("totalMoney").innerText = tM.toFixed(2)+"€";
};

/* auto refresh */
document.getElementById("start").onchange = renderTotals;
document.getElementById("end").onchange = renderTotals;

/* ---------------- PDF (MUJOR) ---------------- */

window.exportPDF = ()=>{
 const { jsPDF } = window.jspdf;
 const doc = new jsPDF();

 const month = document.getElementById("pdfMonth").value;

 doc.text("Payroll Report - " + month, 10, 10);

 let y = 20;

 workers.forEach(w=>{
  const filtered = logs.filter(l =>
    l.workerId === w.id &&
    l.date.startsWith(month)
  );

  const h = filtered.reduce((a,b)=>a+b.hours,0);
  const m = h * w.rate;

  doc.text(`${w.name} - ${h}h - ${m.toFixed(2)}€`, 10, y);
  y += 10;
 });

 doc.save("report-" + month + ".pdf");
};

/* ---------------- BACKUP ---------------- */

window.backupData = ()=>{
 const blob = new Blob([JSON.stringify({workers,logs})]);
 const a = document.createElement("a");
 a.href = URL.createObjectURL(blob);
 a.download = "backup.json";
 a.click();
};

/* ---------------- DEFAULT DATE ---------------- */

const t = new Date().toISOString().slice(0,10);
document.getElementById("date").value = t;
document.getElementById("start").value = t.slice(0,8)+"01";
document.getElementById("end").value = t;

document.getElementById("date").onchange = renderDaily;

</script>

</body>
</html>
