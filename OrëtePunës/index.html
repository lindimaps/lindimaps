<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistemi i Pagave</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body { font-family: Arial; }
.spinner { border: 3px solid #f3f3f3; border-top: 3px solid #4f46e5; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
@keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>

<body class="bg-gray-100">

<div id="loading" class="flex justify-center items-center h-screen">
<div class="spinner"></div>
</div>

<div class="max-w-4xl mx-auto p-6 hidden" id="app">

<h1 class="text-2xl font-bold mb-4">Sistemi i Pagave</h1>

<input type="text" id="name" placeholder="Emri" class="border p-2">
<input type="number" id="rate" placeholder="€/h" class="border p-2">
<button onclick="addWorker()" class="bg-blue-500 text-white px-4 py-2">Shto</button>

<div id="list" class="mt-4"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDGlHCPxysEO4ZxxIPic3u7rRZCo7oZTZ4",
  authDomain: "workhours-fb74a.firebaseapp.com",
  projectId: "workhours-fb74a",
  storageBucket: "workhours-fb74a.firebasestorage.app",
  messagingSenderId: "276432513861",
  appId: "1:276432513861:web:1ed148fbde29baf4c7ac2c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let user;

onAuthStateChanged(auth, (u) => {
  if (u) {
    user = u;
    startApp();
  } else {
    signInAnonymously(auth);
  }
});

function startApp() {
  document.getElementById("loading").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  const colRef = collection(db, "workers");

  onSnapshot(colRef, (snap) => {
    const list = document.getElementById("list");
    list.innerHTML = "";

    snap.forEach(doc => {
      const d = doc.data();
      list.innerHTML += `<div class="p-2 bg-white mb-2">${d.name} - ${d.rate}€/h</div>`;
    });
  });
}

window.addWorker = async () => {
  const name = document.getElementById("name").value;
  const rate = document.getElementById("rate").value;

  if (!name || !rate) return;

  await addDoc(collection(db, "workers"), {
    name,
    rate: parseFloat(rate)
  });
};
</script>

</body>
</html>
