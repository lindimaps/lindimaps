<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payroll Business</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body { font-family: 'Inter', sans-serif; }
.card { @apply bg-white rounded-2xl shadow p-4; }
</style>
</head>

<body class="bg-slate-100">

<!-- LOGIN -->
<div id="login" class="flex items-center justify-center h-screen">
<div class="bg-white p-6 rounded-2xl shadow w-80 space-y-3">
<h2 class="text-xl font-bold text-center">Login</h2>
<input id="email" placeholder="Email" class="w-full border p-2 rounded">
<input id="password" type="password" placeholder="Password" class="w-full border p-2 rounded">
<button onclick="loginUser()" class="w-full bg-indigo-600 text-white p-2 rounded">Login</button>
<button onclick="registerUser()" class="w-full bg-gray-200 p-2 rounded">Register</button>
</div>
</div>

<!-- APP -->
<div id="app" class="hidden max-w-6xl mx-auto p-6">

<!-- HEADER -->
<div class="flex justify-between items-center mb-6">
<h1 class="text-2xl font-bold">Payroll System</h1>
<div>
<span id="userEmail" class="mr-3 text-sm"></span>
<button onclick="logout()" class="bg-red-500 text-white px-3 py-1 rounded">Logout</button>
</div>
</div>

<!-- ACTIONS -->
<div class="flex flex-wrap gap-2 mb-4">
<button onclick="exportPDF()" class="bg-indigo-600 text-white px-4 py-2 rounded">PDF</button>
<button onclick="backupData()" class="bg-green-600 text-white px-4 py-2 rounded">Backup</button>
<input type="file" onchange="restoreData(event)" class="border p-2">
<select id="workerFilter" onchange="renderTotals()" class="border p-2 rounded">
<option value="">Të gjithë</option>
</select>
</div>

<!-- ADD WORKER -->
<div class="bg-white p-4 rounded-2xl shadow mb-4 flex gap-2">
<input id="name" placeholder="Emri" class="border p-2 flex-1 rounded">
<input id="rate" type="number" placeholder="€/h" class="border p-2 w-24 rounded">
<button onclick="addWorker()" class="bg-blue-500 text-white px-4 rounded">Shto</button>
</div>

<!-- DAILY -->
<div class="bg-white p-4 rounded-2xl shadow mb-4">
<input type="date" id="date" class="border p-2 mb-2 rounded">
<div id="daily"></div>
<button onclick="saveHours()" class="w-full bg-black text-white p-2 mt-2 rounded">Ruaj</button>
</div>

<!-- TOTALS -->
<div class="bg-white p-4 rounded-2xl shadow">
<div class="flex gap-2 mb-2">
<input type="date" id="start" class="border p-2 rounded">
<input type="date" id="end" class="border p-2 rounded">
</div>

<div id="totals"></div>

<div class="mt-3 font-bold">
<span id="totalMoney"></span> | <span id="totalHours"></span>
</div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

const firebaseConfig = {
 apiKey: "AIzaSy...",
 authDomain: "workhours-fb74a.firebaseapp.com",
 projectId: "workhours-fb74a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let user, workers=[], logs=[];

// AUTH
window.loginUser = async ()=>{
 try {
  await signInWithEmailAndPassword(auth,email.value,password.value);
 } catch(e){ alert(e.message); }
};

window.registerUser = async ()=>{
 try {
  await createUserWithEmailAndPassword(auth,email.value,password.value);
 } catch(e){ alert(e.message); }
};

window.logout = ()=> signOut(auth);

onAuthStateChanged(auth, u=>{
 if(u){
  user=u;
  document.getElementById("login").style.display="none";
  document.getElementById("app").classList.remove("hidden");
  userEmail.innerText=u.email;
  start();
 }
});

// START
function start(){
 const base=`users/${user.uid}`;

 onSnapshot(collection(db, base+"/workers"), snap=>{
  workers=snap.docs.map(d=>({id:d.id,...d.data()}));
  fillFilter();
  renderDaily();
  renderTotals();
 });

 onSnapshot(collection(db, base+"/logs"), snap=>{
  logs=snap.docs.map(d=>({id:d.id,...d.data()}));
  renderDaily();
  renderTotals();
 });
}

// WORKERS
window.addWorker = async ()=>{
 if(!name.value || !rate.value) return;
 await setDoc(doc(db, `users/${user.uid}/workers`, Date.now().toString()), {
  name:name.value,
  rate:parseFloat(rate.value)
 });
 name.value=""; rate.value="";
};

function fillFilter(){
 workerFilter.innerHTML='<option value="">Të gjithë</option>';
 workers.forEach(w=>{
  workerFilter.innerHTML+=`<option value="${w.id}">${w.name}</option>`;
 });
}

// DAILY
window.renderDaily = ()=>{
 const d=date.value;
 daily.innerHTML = workers.map(w=>{
  const l=logs.find(x=>x.date===d && x.workerId===w.id);
  return `
  <div class="flex justify-between mb-2">
   <span>${w.name}</span>
   <div class="flex gap-2">
    <input type="number" step="0.5" data-id="${w.id}" value="${l?l.hours:''}" class="border w-20 text-center rounded">
    <input type="number" value="${w.rate}" onchange="updateRate('${w.id}',this.value)" class="border w-20 text-center rounded">
   </div>
  </div>`;
 }).join("");
};

// UPDATE RATE
window.updateRate = async (id,val)=>{
 await updateDoc(doc(db, `users/${user.uid}/workers`, id), {rate:parseFloat(val)});
};

// SAVE HOURS
window.saveHours = async ()=>{
 const d=date.value;
 document.querySelectorAll("#daily input[data-id]").forEach(async i=>{
  const h=parseFloat(i.value)||0;
  const id=i.dataset.id;
  const ref=doc(db, `users/${user.uid}/logs`, d+"_"+id);
  if(h>0) await setDoc(ref,{date:d,workerId:id,hours:h});
  else await deleteDoc(ref);
 });
 alert("Ruajtur!");
};

// TOTALS
window.renderTotals = ()=>{
 const s=start.value, e=end.value, f=workerFilter.value;
 let tH=0,tM=0;

 totals.innerHTML = workers.filter(w=>!f || w.id===f).map(w=>{
  const wl=logs.filter(l=>l.workerId===w.id && l.date>=s && l.date<=e);
  const h=wl.reduce((a,b)=>a+b.hours,0);
  const m=h*w.rate;
  tH+=h; tM+=m;
  return `<div class="flex justify-between border-b py-1">
   <span>${w.name}</span>
   <span>${h}h | ${m.toFixed(2)}€</span>
  </div>`;
 }).join("");

 totalHours.innerText=tH+"h";
 totalMoney.innerText=tM.toFixed(2)+"€";
};

// PDF
window.exportPDF = ()=>{
 const { jsPDF } = window.jspdf;
 const doc = new jsPDF();
 doc.text("Payroll Report",10,10);
 let y=20;
 workers.forEach(w=>{
  const h=logs.filter(l=>l.workerId===w.id).reduce((a,b)=>a+b.hours,0);
  const m=h*w.rate;
  doc.text(`${w.name} - ${h}h - ${m.toFixed(2)}€`,10,y);
  y+=10;
 });
 doc.save("report.pdf");
};

// BACKUP
window.backupData = ()=>{
 const blob = new Blob([JSON.stringify({workers,logs})]);
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="backup.json";
 a.click();
};

// RESTORE
window.restoreData = (e)=>{
 const file=e.target.files[0];
 const reader=new FileReader();
 reader.onload=()=> alert("Backup loaded (manual import needed)");
 reader.readAsText(file);
};

// DEFAULT DATE
const t=new Date().toISOString().slice(0,10);
date.value=t;
start.value=t.slice(0,8)+"01";
end.value=t;
date.onchange=renderDaily;

</script>

</body>
</html>
