<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payroll Business</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body class="bg-gray-100">

<div id="app" class="max-w-6xl mx-auto p-6 hidden">

<h1 class="text-2xl font-bold mb-4">Payroll Business</h1>

<!-- USER -->
<div class="mb-4 flex justify-between">
<span id="userEmail"></span>
<button onclick="logout()" class="bg-red-500 text-white px-3 py-1 rounded">Logout</button>
</div>

<!-- ACTIONS -->
<div class="flex gap-2 mb-4 flex-wrap">
<button onclick="exportPDF()" class="bg-indigo-600 text-white px-3 py-2 rounded">PDF</button>
<button onclick="backupData()" class="bg-green-600 text-white px-3 py-2 rounded">Backup</button>
<input type="file" onchange="restoreData(event)" class="border p-1">
<select id="filterWorker" onchange="renderTotals()" class="border p-2">
<option value="">Të gjithë</option>
</select>
</div>

<!-- ADD WORKER -->
<div class="bg-white p-4 rounded mb-4 flex gap-2">
<input id="name" placeholder="Emri" class="border p-2 flex-1">
<input id="rate" type="number" placeholder="€/h" class="border p-2 w-24">
<button onclick="addWorker()" class="bg-blue-500 text-white px-4">Shto</button>
</div>

<!-- DAILY -->
<div class="bg-white p-4 rounded mb-4">
<input type="date" id="date" class="border p-2 mb-2">
<div id="daily"></div>
<button onclick="saveHours()" class="w-full bg-black text-white p-2 mt-2">Ruaj</button>
</div>

<!-- TOTALS -->
<div class="bg-white p-4 rounded">
<input type="date" id="start" class="border p-2">
<input type="date" id="end" class="border p-2">
<div id="totals" class="mt-2"></div>
<div class="font-bold mt-3">
<span id="money"></span> | <span id="hours"></span>
</div>
</div>

</div>

<!-- LOGIN -->
<div id="login" class="flex items-center justify-center h-screen">
<div class="bg-white p-6 rounded shadow w-80">
<h2 class="text-xl font-bold mb-3">Login</h2>
<input id="email" placeholder="Email" class="border p-2 w-full mb-2">
<input id="password" type="password" placeholder="Password" class="border p-2 w-full mb-2">
<button onclick="login()" class="bg-indigo-600 text-white w-full p-2 mb-2">Login</button>
<button onclick="register()" class="bg-gray-200 w-full p-2">Register</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

const firebaseConfig = {
 apiKey: "AIzaSy...",
 authDomain: "workhours-fb74a.firebaseapp.com",
 projectId: "workhours-fb74a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let user, workers=[], logs=[];

// AUTH
window.login = async ()=>{
 await signInWithEmailAndPassword(auth,email.value,password.value);
};

window.register = async ()=>{
 await createUserWithEmailAndPassword(auth,email.value,password.value);
};

window.logout = ()=> signOut(auth);

onAuthStateChanged(auth, u=>{
 if(u){
  user=u;
  login.style.display="none";
  appDiv.style.display="block";
  userEmail.innerText=u.email;
  start();
 }
});

// START
function start(){
 const base=`users/${user.uid}`;

 onSnapshot(collection(db, base+"/workers"), snap=>{
  workers=snap.docs.map(d=>({id:d.id,...d.data()}));
  fillFilter();
  renderDaily();
  renderTotals();
 });

 onSnapshot(collection(db, base+"/logs"), snap=>{
  logs=snap.docs.map(d=>({id:d.id,...d.data()}));
  renderDaily();
  renderTotals();
 });
}

// WORKERS
window.addWorker = async ()=>{
 await setDoc(doc(db, `users/${user.uid}/workers`, Date.now().toString()), {
  name:name.value,
  rate:parseFloat(rate.value)
 });
};

// DAILY
window.renderDaily = ()=>{
 const d=date.value;
 daily.innerHTML = workers.map(w=>{
  const l=logs.find(x=>x.date===d&&x.workerId===w.id);
  return `<div class="flex justify-between mb-2">
  <span>${w.name}</span>
  <input data-id="${w.id}" value="${l?l.hours:''}" class="border w-20 text-center">
  </div>`;
 }).join("");
};

// SAVE
window.saveHours = async ()=>{
 const d=date.value;
 document.querySelectorAll("#daily input").forEach(async i=>{
  const h=parseFloat(i.value)||0;
  const id=i.dataset.id;
  const ref=doc(db, `users/${user.uid}/logs`, d+"_"+id);
  if(h>0) await setDoc(ref,{date:d,workerId:id,hours:h});
  else await deleteDoc(ref);
 });
};

// TOTALS
window.renderTotals = ()=>{
 let tH=0,tM=0;
 totals.innerHTML = workers.map(w=>{
  const h=logs.filter(l=>l.workerId===w.id).reduce((a,b)=>a+b.hours,0);
  const m=h*w.rate;
  tH+=h; tM+=m;
  return `<div class="flex justify-between">${w.name} ${h}h ${m.toFixed(2)}€</div>`;
 }).join("");
 hours.innerText=tH+"h";
 money.innerText=tM.toFixed(2)+"€";
};

// PDF
window.exportPDF = ()=>{
 const { jsPDF } = window.jspdf;
 const doc = new jsPDF();
 doc.text("Payroll Report",10,10);
 let y=20;
 workers.forEach(w=>{
  const h=logs.filter(l=>l.workerId===w.id).reduce((a,b)=>a+b.hours,0);
  doc.text(`${w.name} ${h}h`,10,y);
  y+=10;
 });
 doc.save("report.pdf");
};

// BACKUP
window.backupData = ()=>{
 const blob = new Blob([JSON.stringify({workers,logs})]);
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="backup.json";
 a.click();
};

// RESTORE
window.restoreData = (e)=>{
 const file=e.target.files[0];
 const reader=new FileReader();
 reader.onload=()=>{
  const data=JSON.parse(reader.result);
  alert("Loaded backup (manual upload needed)");
 };
 reader.readAsText(file);
};
</script>

</body>
</html>
