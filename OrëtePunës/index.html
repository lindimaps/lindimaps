<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistemi i Pagave PRO</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body { font-family: Arial; }
.spinner { border: 3px solid #eee; border-top: 3px solid #4f46e5; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
@keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>

<body class="bg-gray-100 text-gray-800">

<!-- Loading -->
<div id="loading" class="fixed inset-0 flex items-center justify-center bg-white z-50">
<div class="spinner"></div>
</div>

<div class="max-w-6xl mx-auto p-6 hidden" id="app">

<!-- HEADER -->
<div class="flex justify-between items-center mb-6">
<h1 class="text-2xl font-bold">Sistemi i Pagave PRO</h1>
<span id="status" class="text-sm text-gray-500">Lidhje...</span>
</div>

<!-- ADD WORKER -->
<div class="bg-white p-4 rounded-xl shadow mb-6 flex gap-2">
<input id="name" placeholder="Emri" class="border p-2 flex-1 rounded">
<input id="rate" type="number" placeholder="€/h" class="border p-2 w-24 rounded">
<button onclick="addWorker()" class="bg-indigo-600 text-white px-4 rounded">Shto</button>
</div>

<!-- DAILY -->
<div class="bg-white p-4 rounded-xl shadow mb-6">
<div class="flex justify-between mb-3">
<h2 class="font-bold">Ditari</h2>
<input type="date" id="date" class="border p-1 rounded">
</div>
<div id="daily"></div>
<button onclick="saveHours()" class="mt-3 w-full bg-black text-white p-2 rounded">Ruaj</button>
</div>

<!-- TOTALS -->
<div class="bg-white p-4 rounded-xl shadow">
<div class="flex gap-2 mb-3">
<input type="date" id="start" class="border p-1">
<input type="date" id="end" class="border p-1">
<button onclick="renderTotals()" class="bg-gray-200 px-3 rounded">Filter</button>
</div>

<div id="totals"></div>

<div class="mt-4 font-bold">
Total: <span id="totalMoney">0€</span> | <span id="totalHours">0h</span>
</div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

// 🔥 CONFIG (YOURS)
const firebaseConfig = {
  apiKey: "AIzaSyDGlHCPxysEO4ZxxIPic3u7rRZCo7oZTZ4",
  authDomain: "workhours-fb74a.firebaseapp.com",
  projectId: "workhours-fb74a",
  storageBucket: "workhours-fb74a.firebasestorage.app",
  messagingSenderId: "276432513861",
  appId: "1:276432513861:web:1ed148fbde29baf4c7ac2c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let user, workers = [], logs = [];

const today = new Date().toISOString().slice(0,10);
document.getElementById("date").value = today;
document.getElementById("start").value = today.slice(0,8)+"01";
document.getElementById("end").value = today;

// AUTH
onAuthStateChanged(auth, (u)=>{
 if(u){ user=u; start(); }
 else signInAnonymously(auth);
});

function start(){
 document.getElementById("loading").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 document.getElementById("status").innerText="Online";

 const base = `users/${user.uid}`;

 onSnapshot(collection(db, base+"/workers"), snap=>{
  workers = snap.docs.map(d=>({id:d.id,...d.data()}));
  renderDaily();
  renderTotals();
 });

 onSnapshot(collection(db, base+"/logs"), snap=>{
  logs = snap.docs.map(d=>({id:d.id,...d.data()}));
  renderDaily();
  renderTotals();
 });
}

// ADD WORKER
window.addWorker = async ()=>{
 const name = document.getElementById("name").value;
 const rate = parseFloat(document.getElementById("rate").value);
 if(!name || !rate) return;

 const id = Date.now().toString();
 await setDoc(doc(db, `users/${user.uid}/workers`, id), {name, rate});
};

// DAILY
window.renderDaily = ()=>{
 const date = document.getElementById("date").value;

 document.getElementById("daily").innerHTML = workers.map(w=>{
  const log = logs.find(l=>l.date===date && l.workerId===w.id);
  return `
  <div class="flex justify-between mb-2">
   <span>${w.name}</span>
   <input type="number" step="0.5" data-id="${w.id}" value="${log?log.hours:''}" class="border w-20 text-center">
  </div>
  `;
 }).join("");
};

// SAVE
window.saveHours = async ()=>{
 const date = document.getElementById("date").value;
 const inputs = document.querySelectorAll("#daily input");

 for(let i of inputs){
  const id = i.dataset.id;
  const h = parseFloat(i.value) || 0;
  const logId = date+"_"+id;

  const ref = doc(db, `users/${user.uid}/logs`, logId);

  if(h>0) await setDoc(ref,{date,workerId:id,hours:h});
  else await deleteDoc(ref);
 }

 alert("U ruajt!");
};

// TOTALS
window.renderTotals = ()=>{
 const s = document.getElementById("start").value;
 const e = document.getElementById("end").value;

 let tH=0,tM=0;

 document.getElementById("totals").innerHTML = workers.map(w=>{
  const wl = logs.filter(l=>l.workerId===w.id && l.date>=s && l.date<=e);
  const h = wl.reduce((a,b)=>a+b.hours,0);
  const m = h*w.rate;
  tH+=h; tM+=m;

  return `<div class="flex justify-between border-b py-1">
   <span>${w.name}</span>
   <span>${h}h | ${m.toFixed(2)}€</span>
  </div>`;
 }).join("");

 document.getElementById("totalHours").innerText = tH+"h";
 document.getElementById("totalMoney").innerText = tM.toFixed(2)+"€";
};

document.getElementById("date").onchange = renderDaily;

</script>

</body>
</html>
