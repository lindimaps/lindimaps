<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LindiMaps Pagesat</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
    body { font-family: sans-serif; }
    .worker-row { border-bottom: 1px solid #eee; padding: 10px 0; }
    .edit-mode { background-color: #fef3c7; border: 1px solid #f59e0b; }
</style>
</head>

<body class="bg-slate-100">

<!-- LOGIN - KODI JUAJ ORIGJINAL PA ASNJE NDRYSHIM STRUKTUROR -->
<div id="login" class="flex items-center justify-center h-screen">
<div class="bg-white p-6 rounded-2xl shadow w-80 space-y-3">
<h2 class="text-xl font-bold text-center">LindiMaps Pagesat</h2>
<input id="email" placeholder="Email" class="w-full border p-2 rounded">
<input id="password" type="password" placeholder="Password" class="w-full border p-2 rounded">
<button onclick="loginUser()" class="w-full bg-indigo-600 text-white p-2 rounded">Login</button>
<button onclick="registerUser()" class="w-full bg-gray-200 p-2 rounded">Register</button>
<button onclick="resetPassword()" class="w-full text-sm text-blue-600 underline">Forgot Password?</button>
</div>
</div>

<!-- APP - STRUKTURA MOBILE-FRIENDLY DUKE RUAJTUR FUNKSIONALITETIN -->
<div id="app" class="hidden max-w-6xl mx-auto p-4 md:p-6">

<div class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm">
<span id="userEmail" class="font-bold text-slate-700"></span>
<button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-lg">Logout</button>
</div>

<!-- ACTIONS -->
<div class="bg-white p-4 rounded-xl shadow-sm mb-6 space-y-3">
<h3 class="text-sm font-bold text-slate-400 uppercase">Eksporto Raportin</h3>
<div class="flex flex-col gap-2">
<input type="month" id="pdfMonth" class="border p-3 rounded-lg w-full">
<div class="grid grid-cols-2 gap-2">
<button onclick="exportPDF()" class="bg-indigo-600 text-white p-3 rounded-lg font-bold">PDF Mujor</button>
<button onclick="backupData()" class="bg-green-600 text-white p-3 rounded-lg font-bold">Backup</button>
</div>
</div>
</div>

<!-- ADD / EDIT WORKER -->
<div id="workerForm" class="bg-white p-4 rounded-xl shadow-sm mb-6 space-y-3">
<h3 id="formTitle" class="text-sm font-bold text-slate-400 uppercase">Shto Punëtor</h3>
<div class="flex flex-col gap-2">
<input id="name" placeholder="Emri Mbiemri" class="border p-3 rounded-lg w-full">
<input id="rate" type="number" placeholder="€/h" class="border p-3 rounded-lg w-full">
<button id="addBtn" onclick="addWorker()" class="bg-blue-500 text-white p-3 rounded-lg font-bold">Shto Punëtorin</button>
<button id="cancelBtn" onclick="cancelEdit()" class="hidden bg-gray-400 text-white p-3 rounded-lg font-bold">Anulo Editimin</button>
</div>
</div>

<!-- DAILY LOGS -->
<div class="bg-white p-4 rounded-xl shadow-sm mb-6">
<div class="flex justify-between items-center mb-4">
<h3 class="text-sm font-bold text-slate-400 uppercase">Orët Ditore</h3>
<input type="date" id="date" class="border p-2 rounded-lg">
</div>
<div id="daily" class="space-y-2 mb-4"></div>
<button onclick="saveHours()" class="w-full bg-black text-white p-4 rounded-xl font-bold">Ruaj Orët</button>
</div>

<!-- TOTALS AND LIST -->
<div class="bg-white p-4 rounded-xl shadow-sm">
<h3 class="text-sm font-bold text-slate-400 uppercase mb-4">Lista e Punëtorëve & Totali</h3>
<div class="flex gap-2 mb-4">
<input type="date" id="start" class="border p-2 rounded-lg flex-1 text-xs">
<input type="date" id="end" class="border p-2 rounded-lg flex-1 text-xs">
</div>

<div id="totals" class="space-y-1"></div>

<div class="grid grid-cols-2 gap-2 mt-6 border-t pt-4">
<div class="bg-indigo-50 p-3 rounded-lg text-center">
    <p class="text-[10px] font-bold text-indigo-400 uppercase">Para</p>
    <span id="totalMoney" class="font-bold text-indigo-700 text-lg"></span>
</div>
<div class="bg-slate-100 p-3 rounded-lg text-center">
    <p class="text-[10px] font-bold text-slate-400 uppercase">Orë</p>
    <span id="totalHours" class="font-bold text-slate-700 text-lg"></span>
</div>
</div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
import { 
 getAuth,
 signInWithEmailAndPassword,
 createUserWithEmailAndPassword,
 signOut,
 onAuthStateChanged,
 sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

const firebaseConfig = {
 apiKey: "AIzaSyDGlHCPxysEO4ZxxIPic3u7rRZCo7oZTZ4",
 authDomain: "workhours-fb74a.firebaseapp.com",
 projectId: "workhours-fb74a",
 storageBucket: "workhours-fb74a.appspot.com"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let user, workers = [], logs = [];
let editId = null;

/* ---------------- AUTH - KODI JUAJ PA NDRYSHIME ---------------- */

window.loginUser = async ()=>{
 try{
  await signInWithEmailAndPassword(
   auth,
   document.getElementById("email").value.trim(),
   document.getElementById("password").value
  );
 } catch(e){
  alert(e.message);
 }
};

window.registerUser = async ()=>{
 try{
  await createUserWithEmailAndPassword(
   auth,
   document.getElementById("email").value.trim(),
   document.getElementById("password").value
  );
 } catch(e){
  alert(e.message);
 }
};

window.resetPassword = async ()=>{
 try{
  const email = document.getElementById("email").value.trim();
  if(!email) return alert("Shkruaj email-in!");
  await sendPasswordResetEmail(auth, email);
  alert("Linku u dërgua!");
 } catch(e){
  alert(e.message);
 }
};

window.logout = async ()=>{
 await signOut(auth);
 user = null; workers = []; logs = [];
 document.getElementById("app").classList.add("hidden");
 document.getElementById("login").style.display = "flex";
};

onAuthStateChanged(auth, u=>{
 if(u){
  user = u;
  document.getElementById("login").style.display = "none";
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("userEmail").innerText = u.email;
  start();
 } else {
  document.getElementById("app").classList.add("hidden");
  document.getElementById("login").style.display = "flex";
 }
});

/* ---------------- START ---------------- */

function start(){
 const base = `users/${user.uid}`;
 onSnapshot(collection(db, base+"/workers"), snap=>{
  workers = snap.docs.map(d=>({id:d.id,...d.data()}));
  renderDaily();
  renderTotals();
 });
 onSnapshot(collection(db, base+"/logs"), snap=>{
  logs = snap.docs.map(d=>({id:d.id,...d.data()}));
  renderDaily();
  renderTotals();
 });
}

/* ---------------- WORKERS (SHTIMI I EDITIMIT DHE FSHIRJES) ---------------- */

window.addWorker = async ()=>{
 const name = document.getElementById("name").value;
 const rate = parseFloat(document.getElementById("rate").value);
 if(!name || !rate) return alert("Plotëso fushat");

 const id = editId || Date.now().toString();
 await setDoc(doc(db, `users/${user.uid}/workers`, id), { name, rate });

 cancelEdit();
};

window.editWorker = (id) => {
    const w = workers.find(x => x.id === id);
    if(!w) return;
    editId = id;
    document.getElementById("name").value = w.name;
    document.getElementById("rate").value = w.rate;
    document.getElementById("addBtn").innerText = "Ruaj Ndryshimet";
    document.getElementById("formTitle").innerText = "Edito Punëtorin";
    document.getElementById("cancelBtn").classList.remove("hidden");
    document.getElementById("workerForm").classList.add("edit-mode");
    window.scrollTo(0,0);
};

window.cancelEdit = () => {
    editId = null;
    document.getElementById("name").value = "";
    document.getElementById("rate").value = "";
    document.getElementById("addBtn").innerText = "Shto Punëtorin";
    document.getElementById("formTitle").innerText = "Shto Punëtor";
    document.getElementById("cancelBtn").classList.add("hidden");
    document.getElementById("workerForm").classList.remove("edit-mode");
};

window.deleteWorker = async (id) => {
    if(confirm("A jeni i sigurt që dëshironi ta fshini këtë punëtor?")){
        await deleteDoc(doc(db, `users/${user.uid}/workers`, id));
    }
};

/* ---------------- DAILY ---------------- */

window.renderDaily = ()=>{
 const date = document.getElementById("date").value;
 document.getElementById("daily").innerHTML = workers.map(w=>{
  const l = logs.find(x=>x.date===date && x.workerId===w.id);
  return `
  <div class="flex justify-between items-center bg-slate-50 p-3 rounded-lg border border-slate-200">
   <span class="font-medium text-sm">${w.name}</span>
   <div class="flex items-center gap-2">
    <input type="number" data-id="${w.id}" value="${l?l.hours:''}" class="border w-16 p-1 text-center rounded">
    <span class="text-[10px] font-bold">H</span>
   </div>
  </div>`;
 }).join("");
};

window.saveHours = async ()=>{
 const date = document.getElementById("date").value;
 document.querySelectorAll("#daily input").forEach(async i=>{
  const h = parseFloat(i.value)||0;
  const id = i.dataset.id;
  const ref = doc(db, `users/${user.uid}/logs`, date+"_"+id);
  if(h>0) await setDoc(ref,{date,workerId:id,hours:h});
  else await deleteDoc(ref);
 });
 alert("Ruajtur!");
};

/* ---------------- TOTALS ---------------- */

window.renderTotals = ()=>{
 const start = document.getElementById("start").value;
 const end = document.getElementById("end").value;
 let tH=0, tM=0;

 document.getElementById("totals").innerHTML = workers.map(w=>{
  const wl = logs.filter(l=>{
   if(l.workerId !== w.id) return false;
   if(start && l.date < start) return false;
   if(end && l.date > end) return false;
   return true;
  });
  const h = wl.reduce((a,b)=>a+b.hours,0);
  const m = h * w.rate;
  tH += h; tM += m;
  return `
  <div class="worker-row flex flex-col gap-1">
   <div class="flex justify-between items-center">
    <span class="font-bold text-sm text-slate-800">${w.name}</span>
    <span class="text-sm font-bold text-indigo-600">${h}h | ${m.toFixed(2)}€</span>
   </div>
   <div class="flex gap-2">
    <button onclick="editWorker('${w.id}')" class="text-[10px] text-blue-500 font-bold uppercase underline">Edito</button>
    <button onclick="deleteWorker('${w.id}')" class="text-[10px] text-red-500 font-bold uppercase underline">Fshi</button>
   </div>
  </div>`;
 }).join("");

 document.getElementById("totalHours").innerText = tH+"h";
 document.getElementById("totalMoney").innerText = tM.toFixed(2)+"€";
};

document.getElementById("start").onchange = renderTotals;
document.getElementById("end").onchange = renderTotals;

/* ---------------- PDF ME TEKSTIN E KERKUAR ---------------- */

window.exportPDF = ()=>{
 const { jsPDF } = window.jspdf;
 const doc = new jsPDF();
 const monthInput = document.getElementById("pdfMonth").value;
 if(!monthInput) return alert("Zgjidhni muajin!");

 const [year, month] = monthInput.split("-");
 const muajShqip = ["Janar", "Shkurt", "Mars", "Prill", "Maj", "Qershor", "Korrik", "Gusht", "Shtator", "Tetor", "Nëntor", "Dhjetor"];
 const monthName = muajShqip[parseInt(month)-1];

 doc.setFontSize(18);
 doc.text("LindiMaps Pagesat", 10, 20);

 doc.setFontSize(12);
 // Teksti sipas kerkeses suaj
 doc.text(`Orët e punës përgjatë Muajit ${monthName} ${year} sipas listës më poshtë:`, 10, 35);

 let y = 50;
 doc.setFont("helvetica", "bold");
 doc.text("Emri Mbiemri", 10, y);
 doc.text("Orët", 100, y);
 doc.text("€/h", 130, y);
 doc.text("Total", 170, y);
 doc.line(10, y+2, 200, y+2);
 y += 10;

 doc.setFont("helvetica", "normal");
 let totalMonth = 0;
 workers.forEach(w=>{
  const filtered = logs.filter(l => l.workerId === w.id && l.date.startsWith(monthInput));
  const h = filtered.reduce((a,b)=>a+b.hours,0);
  const m = h * w.rate;
  if(h > 0) {
    totalMonth += m;
    doc.text(`${w.name}`, 10, y);
    doc.text(`${h}`, 100, y);
    doc.text(`${w.rate.toFixed(2)}`, 130, y);
    doc.text(`${m.toFixed(2)} €`, 170, y);
    y += 10;
  }
 });

 doc.line(10, y, 200, y);
 doc.setFont("helvetica", "bold");
 doc.text(`TOTALI PER MUAJIN: ${totalMonth.toFixed(2)} €`, 130, y+10);

 doc.save(`Raporti-${monthName}-${year}.pdf`);
};

/* ---------------- BACKUP ---------------- */

window.backupData = ()=>{
 const blob = new Blob([JSON.stringify({workers,logs})]);
 const a = document.createElement("a");
 a.href = URL.createObjectURL(blob);
 a.download = "backup-lindimaps.json";
 a.click();
};

const t = new Date().toISOString().slice(0,10);
document.getElementById("date").value = t;
document.getElementById("start").value = t.slice(0,8)+"01";
document.getElementById("end").value = t;
document.getElementById("pdfMonth").value = t.slice(0,7);
document.getElementById("date").onchange = renderDaily;

</script>
</body>
</html>
