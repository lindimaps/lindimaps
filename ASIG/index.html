<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LindiMaps Workflow Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .tab-active { color: #4f46e5; border-bottom: 3px solid #4f46e5; }
        input, select, textarea { transition: all 0.2s; }
        input:focus, select:focus { border-color: #4f46e5; outline: none; ring: 2px; ring-color: rgba(79, 70, 229, 0.1); }
    </style>
</head>
<body class="bg-[#f8fafc] min-h-screen pb-24 text-slate-900">

<!-- AUTHENTICATION OVERLAY -->
<div id="auth-overlay" class="fixed inset-0 z-[400] bg-white flex items-center justify-center p-6 hidden">
    <div class="max-w-md w-full space-y-8">
        <div class="flex flex-col items-center gap-3 text-center mb-8">
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center text-white font-black text-3xl shadow-xl shadow-indigo-200">L</div>
            <h1 class="text-3xl font-extrabold tracking-tight">LindiMaps <span class="text-indigo-600">Cloud</span></h1>
        </div>

        <div id="login-form" class="space-y-4">
            <p class="text-slate-400 font-bold text-xs text-center uppercase tracking-widest">Hyr në sistem</p>
            <input id="login-email" type="email" placeholder="Email" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 font-bold focus:bg-white">
            <input id="login-password" type="password" placeholder="Fjalëkalimi" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 font-bold focus:bg-white">
            <button id="login-btn" class="w-full bg-indigo-600 text-white p-5 rounded-2xl font-bold shadow-lg hover:bg-indigo-700 active:scale-95 transition-all">Hyr</button>
            <div class="flex justify-between px-2 text-[11px] font-bold text-slate-400">
                <button onclick="toggleAuth('reset')" class="hover:text-indigo-600">Harrova fjalëkalimin</button>
                <button onclick="toggleAuth('signup')" class="text-indigo-600">Krijo llogari</button>
            </div>
        </div>

        <div id="signup-form" class="space-y-4 hidden">
            <p class="text-slate-400 font-bold text-xs text-center uppercase tracking-widest">Regjistrohu</p>
            <input id="signup-email" type="email" placeholder="Email i ri" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 font-bold focus:bg-white">
            <input id="signup-password" type="password" placeholder="Fjalëkalim (min. 6 karaktere)" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 font-bold focus:bg-white">
            <button id="signup-btn" class="w-full bg-indigo-600 text-white p-5 rounded-2xl font-bold shadow-lg hover:bg-indigo-700 active:scale-95 transition-all">Krijo Llogarinë</button>
            <button onclick="toggleAuth('login')" class="w-full text-[11px] font-bold text-slate-400 uppercase text-center">Anulo</button>
        </div>

        <div id="reset-form" class="space-y-4 hidden">
            <p class="text-slate-400 font-bold text-xs text-center uppercase tracking-widest">Rivendos Fjalëkalimin</p>
            <input id="reset-email" type="email" placeholder="Email juaj" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 font-bold focus:bg-white">
            <button id="reset-btn" class="w-full bg-slate-900 text-white p-5 rounded-2xl font-bold shadow-lg hover:bg-black active:scale-95 transition-all">Dërgo Linkun</button>
            <button onclick="toggleAuth('login')" class="w-full text-[11px] font-bold text-slate-400 uppercase text-center">Kthehu pas</button>
        </div>
        <p id="auth-error" class="text-red-500 text-center text-xs font-bold hidden"></p>
    </div>
</div>

<!-- ALERT MODAL -->
<div id="custom-alert" class="hidden fixed inset-0 z-[500] bg-black/50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl">
        <p id="alert-message" class="font-bold text-slate-800"></p>
        <button onclick="closeAlert()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold">Kuptova</button>
    </div>
</div>

<!-- CONFIRMATION MODAL -->
<div id="confirm-modal" class="hidden fixed inset-0 z-[600] bg-black/50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center space-y-6 shadow-2xl">
        <div class="space-y-2">
            <h3 class="text-xl font-extrabold text-slate-800">A jeni i sigurt?</h3>
            <p id="confirm-message" class="text-slate-500 font-medium text-sm">Ky veprim nuk mund të kthehet pas.</p>
        </div>
        <div class="flex gap-3">
            <button onclick="closeConfirm()" class="flex-1 bg-slate-100 text-slate-600 py-3 rounded-xl font-bold">Anulo</button>
            <button id="confirm-yes-btn" class="flex-1 bg-red-500 text-white py-3 rounded-xl font-bold">Fshije</button>
        </div>
    </div>
</div>

<!-- LOADING OVERLAY -->
<div id="loading" class="fixed inset-0 bg-white/95 z-[300] flex items-center justify-center">
    <div class="flex flex-col items-center gap-4">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-indigo-600 border-t-transparent"></div>
        <p class="text-indigo-600 font-bold animate-pulse text-xs uppercase tracking-widest">Duke u lidhur...</p>
    </div>
</div>

<!-- MAIN APP CONTENT -->
<div id="app-content" class="hidden">
    <header class="glass-card sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-black text-xl">L</div>
            <span class="font-extrabold text-lg tracking-tight">LindiMaps <span class="text-indigo-600">Cloud</span></span>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="logout()" class="text-[10px] font-bold text-slate-400 uppercase hover:text-red-500">Dil</button>
            <span id="sync-status" class="text-[10px] font-bold text-green-500 bg-green-50 px-3 py-1 rounded-full uppercase">Online</span>
        </div>
    </header>

    <nav class="bg-white border-b border-slate-100 flex overflow-x-auto">
        <button onclick="switchTab('log')" id="tab-log" class="flex-1 py-4 text-xs font-extrabold uppercase tracking-widest tab-active">Regjistrim Ditor</button>
        <button onclick="switchTab('config')" id="tab-config" class="flex-1 py-4 text-xs font-extrabold uppercase tracking-widest text-slate-400">Struktura</button>
        <button onclick="switchTab('reports')" id="tab-reports" class="flex-1 py-4 text-xs font-extrabold uppercase tracking-widest text-slate-400">Raporte</button>
    </nav>

    <main class="max-w-3xl mx-auto p-4 md:p-8 space-y-8">
        <!-- VIEW: LOG -->
        <div id="view-log" class="space-y-6">
            <div class="glass-card rounded-[2rem] p-6 shadow-xl shadow-slate-200/50 space-y-6 border border-white">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Data</label>
                        <input id="log-date" type="date" class="w-full p-4 rounded-2xl bg-slate-50 border-slate-100 font-bold">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Eksperti</label>
                        <select id="log-operator-select" class="w-full p-4 rounded-2xl bg-slate-50 border-slate-100 font-bold appearance-none"></select>
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Aktiviteti</label>
                    <select id="log-act-select" onchange="generateProcessFields()" class="w-full p-4 rounded-2xl bg-slate-50 border-slate-100 font-bold appearance-none"></select>
                </div>
                <div id="dynamic-fields-container" class="space-y-4 pt-4 border-t border-slate-50"></div>
                <div class="pt-4 border-t border-slate-50">
                    <div class="space-y-2">
                        <label class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Orët e Punës</label>
                        <input id="log-hours" type="number" step="0.1" placeholder="0.0" class="w-full p-4 rounded-2xl bg-indigo-50 text-indigo-600 font-black text-xl border-none">
                    </div>
                </div>
                <input type="hidden" id="log-edit-id">
                <button id="save-log-btn" class="w-full bg-slate-900 text-white p-5 rounded-[1.5rem] font-bold shadow-lg hover:bg-black active:scale-95 transition-all">
                    Ruaj në Cloud
                </button>
                <button id="cancel-log-edit" class="hidden w-full bg-slate-200 text-slate-600 p-4 rounded-[1.5rem] font-bold mt-2" onclick="cancelLogEdit()">Anulo Modifikimin</button>
            </div>
        </div>

        <!-- VIEW: CONFIG -->
        <div id="view-config" class="hidden space-y-8">
            <div class="glass-card rounded-[2rem] p-8 space-y-6">
                <div class="flex justify-between items-center">
                    <h2 id="config-title" class="text-xl font-extrabold text-slate-800">Konfigurimi</h2>
                    <button id="cancel-edit-btn" class="hidden text-xs font-bold text-slate-400 uppercase" onclick="resetConfigForm()">Anulo</button>
                </div>
                <div class="space-y-4">
                    <input id="edit-id" type="hidden">
                    <input id="new-act-name" type="text" placeholder="Emri i Aktivitetit" class="w-full p-4 rounded-xl bg-slate-50 border-none font-bold">
                    <textarea id="new-act-processes" placeholder="Proceset (Emri:numër/tekst)" class="w-full p-4 rounded-xl bg-slate-50 border-none h-32 font-medium"></textarea>
                    <div class="flex items-center gap-2 bg-indigo-50 p-3 rounded-lg text-indigo-700">
                        <input type="checkbox" id="auto-calc" class="w-5 h-5 accent-indigo-600">
                        <label for="auto-calc" class="text-xs font-bold">Llogarit bilancin automatik</label>
                    </div>
                    <button id="add-act-btn" class="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold">Ruaj Aktivitetin</button>
                </div>
            </div>
            <div id="config-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            
            <div class="glass-card rounded-[2rem] p-8 space-y-6 border-t-4 border-indigo-600">
                <h2 class="text-xl font-extrabold text-slate-800">Menaxho Ekspertët</h2>
                <div class="flex gap-2">
                    <input id="edit-op-id" type="hidden">
                    <input id="new-op-name" type="text" placeholder="Emri i Ekspertit" class="flex-1 p-4 rounded-xl bg-slate-50 border-none font-bold">
                    <button id="add-op-btn" class="bg-slate-900 text-white px-6 rounded-xl font-bold">Ruaj</button>
                </div>
                <button id="cancel-op-edit" class="hidden text-xs font-bold text-slate-400 uppercase" onclick="resetOpForm()">Anulo</button>
                <div id="operator-list" class="flex flex-wrap gap-2 pt-2"></div>
            </div>
        </div>

        <!-- VIEW: REPORTS -->
        <div id="view-reports" class="hidden space-y-6">
            <div class="glass-card rounded-[2rem] p-6 space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="grid grid-cols-2 gap-2">
                        <input id="rep-start" type="date" class="p-3 rounded-xl bg-slate-50 border-none font-bold text-[10px]">
                        <input id="rep-end" type="date" class="p-3 rounded-xl bg-slate-50 border-none font-bold text-[10px]">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <select id="rep-op-select" class="p-3 rounded-xl bg-slate-50 border-none font-bold text-[10px]"></select>
                        <select id="rep-act-select" class="p-3 rounded-xl bg-slate-50 border-none font-bold text-[10px]"></select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="renderReportList()" class="bg-slate-900 text-white p-4 rounded-xl font-bold text-xs uppercase">Filtro</button>
                    <button onclick="exportToPDF()" class="bg-indigo-600 text-white p-4 rounded-xl font-bold text-xs uppercase">PDF</button>
                </div>
            </div>
            <div id="report-results" class="space-y-4"></div>
        </div>
    </main>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBk3Wi9DsGp9egY8qQnxeEdM9qlTZIodw0",
      authDomain: "sistemi-aktiviteteve.firebaseapp.com",
      projectId: "sistemi-aktiviteteve",
      storageBucket: "sistemi-aktiviteteve.firebasestorage.app",
      messagingSenderId: "289905439492",
      appId: "1:289905439492:web:4e7e52e13a8379a74b9651",
      measurementId: "G-W2F0WT24XJ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = "sistemi-aktiviteteve-v1";

    // Ekspozojmë globalisht për akses nga onclick
    window.db = db;
    window.doc = doc;
    window.deleteDoc = deleteDoc;
    window.appId = appId;

    let configData = [];
    let logData = [];
    let operatorData = [];
    let deleteCallback = null;

    // --- INTERFACE ---
    window.showAlert = (msg) => {
        document.getElementById('alert-message').innerText = msg;
        document.getElementById('custom-alert').classList.remove('hidden');
    };
    window.closeAlert = () => document.getElementById('custom-alert').classList.add('hidden');

    // Funksioni i Konfirmimit
    window.askConfirm = (msg, onConfirm) => {
        document.getElementById('confirm-message').innerText = msg;
        deleteCallback = onConfirm;
        document.getElementById('confirm-modal').classList.remove('hidden');
    };
    window.closeConfirm = () => {
        document.getElementById('confirm-modal').classList.add('hidden');
        deleteCallback = null;
    };
    document.getElementById('confirm-yes-btn').onclick = () => {
        if(deleteCallback) deleteCallback();
        closeConfirm();
    };

    window.switchTab = (tab) => {
        ['view-log', 'view-config', 'view-reports'].forEach(v => document.getElementById(v).classList.add('hidden'));
        ['tab-log', 'tab-config', 'tab-reports'].forEach(t => document.getElementById(t).classList.replace('tab-active', 'text-slate-400'));
        document.getElementById(`view-${tab}`).classList.remove('hidden');
        document.getElementById(`tab-${tab}`).classList.replace('text-slate-400', 'tab-active');
    };

    window.toggleAuth = (view) => {
        document.getElementById('auth-error').classList.add('hidden');
        ['login-form', 'signup-form', 'reset-form'].forEach(f => document.getElementById(f).classList.add('hidden'));
        document.getElementById(`${view}-form`).classList.remove('hidden');
    };

    // --- AUTH ---
    onAuthStateChanged(auth, (user) => {
        document.getElementById('loading').classList.add('hidden');
        if (user) {
            document.getElementById('app-content').classList.remove('hidden');
            document.getElementById('auth-overlay').classList.add('hidden');
            startListening();
        } else {
            document.getElementById('app-content').classList.add('hidden');
            document.getElementById('auth-overlay').classList.remove('hidden');
        }
    });

    document.getElementById('login-btn').onclick = async () => {
        const email = document.getElementById('login-email').value.trim();
        const pass = document.getElementById('login-password').value;
        if(!email || !pass) return;
        try { await signInWithEmailAndPassword(auth, email, pass); }
        catch (e) { 
            const err = document.getElementById('auth-error');
            err.innerText = "Kredenciale të pasakta."; err.classList.remove('hidden');
        }
    };

    document.getElementById('signup-btn').onclick = async () => {
        const email = document.getElementById('signup-email').value.trim();
        const pass = document.getElementById('signup-password').value;
        if(pass.length < 6) return showAlert("Fjalëkalimi duhet të ketë min. 6 karaktere.");
        try { await createUserWithEmailAndPassword(auth, email, pass); showAlert("Llogaria u krijua!"); }
        catch (e) { showAlert("Gabim gjatë regjistrimit."); }
    };

    document.getElementById('reset-btn').onclick = async () => {
        const email = document.getElementById('reset-email').value.trim();
        if(!email) return;
        try { await sendPasswordResetEmail(auth, email); showAlert("Email-i u dërgua."); toggleAuth('login'); }
        catch (e) { showAlert("Email-i nuk u gjet."); }
    };

    window.logout = () => signOut(auth);

    // --- DATA ---
    function startListening() {
        const base = `artifacts/${appId}/public/data`;
        onSnapshot(collection(db, base, 'config'), snap => {
            configData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            updateDropdowns();
            renderConfigList();
        });
        onSnapshot(collection(db, base, 'logs'), snap => {
            logData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderReportList();
        });
        onSnapshot(collection(db, base, 'operators'), snap => {
            operatorData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            updateDropdowns();
            renderOperatorList();
        });
    }

    // --- ACTIONS ---
    document.getElementById('add-act-btn').onclick = async () => {
        const name = document.getElementById('new-act-name').value.trim();
        const procRaw = document.getElementById('new-act-processes').value.trim();
        const autoCalc = document.getElementById('auto-calc').checked;
        const editId = document.getElementById('edit-id').value;
        if (!name || !procRaw) return showAlert("Plotësoni fushat.");
        const processes = procRaw.split('\n').map(line => {
            const parts = line.split(':');
            return { label: parts[0]?.trim(), type: parts[1]?.trim() === 'tekst' ? 'text' : 'number' };
        }).filter(p => p.label);
        const id = editId || Date.now().toString();
        try {
            await setDoc(doc(db, `artifacts/${appId}/public/data/config`, id), { name, processes, autoCalc });
            resetConfigForm();
        } catch(e) { showAlert("Dështoi ruajtja."); }
    };

    window.editAct = (id) => {
        const act = configData.find(c => c.id === id);
        if(!act) return;
        document.getElementById('edit-id').value = id;
        document.getElementById('new-act-name').value = act.name;
        document.getElementById('new-act-processes').value = act.processes.map(p => `${p.label}:${p.type === 'text' ? 'tekst' : 'numër'}`).join('\n');
        document.getElementById('auto-calc').checked = act.autoCalc;
        document.getElementById('config-title').innerText = "Edito Aktivitetin";
        document.getElementById('cancel-edit-btn').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.resetConfigForm = () => {
        document.getElementById('edit-id').value = "";
        document.getElementById('new-act-name').value = "";
        document.getElementById('new-act-processes').value = "";
        document.getElementById('auto-calc').checked = false;
        document.getElementById('config-title').innerText = "Konfigurimi";
        document.getElementById('cancel-edit-btn').classList.add('hidden');
    };

    window.deleteItem = (col, id) => {
        askConfirm("A jeni i sigurt që dëshironi ta fshini këtë?", async () => {
            try {
                await deleteDoc(doc(window.db, `artifacts/${window.appId}/public/data/${col}`, id));
            } catch (e) {
                showAlert("Fshirja dështoi.");
            }
        });
    };

    function renderConfigList() {
        const list = document.getElementById('config-list');
        list.innerHTML = configData.map(c => `
            <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm relative group">
                <div class="absolute top-2 right-2 flex gap-1 opacity-0 group-hover:opacity-100 transition">
                    <button onclick="editAct('${c.id}')" class="text-indigo-500 bg-indigo-50 px-2 py-1 rounded text-[9px] font-bold">EDIT</button>
                    <button onclick="deleteItem('config', '${c.id}')" class="text-red-400 bg-red-50 px-2 py-1 rounded text-[9px] font-bold">DEL</button>
                </div>
                <h4 class="font-bold text-slate-800">${c.name}</h4>
                <p class="text-[9px] text-slate-400 uppercase mt-1">${c.processes.length} procese</p>
            </div>
        `).join("");
    }

    document.getElementById('add-op-btn').onclick = async () => {
        const name = document.getElementById('new-op-name').value.trim();
        const editOpId = document.getElementById('edit-op-id').value;
        if(!name) return;
        const id = editOpId || Date.now().toString();
        await setDoc(doc(db, `artifacts/${appId}/public/data/operators`, id), { name });
        resetOpForm();
    };

    window.editOp = (id) => {
        const op = operatorData.find(o => o.id === id);
        if(!op) return;
        document.getElementById('edit-op-id').value = id;
        document.getElementById('new-op-name').value = op.name;
        document.getElementById('cancel-op-edit').classList.remove('hidden');
    };

    window.resetOpForm = () => {
        document.getElementById('edit-op-id').value = "";
        document.getElementById('new-op-name').value = "";
        document.getElementById('cancel-op-edit').classList.add('hidden');
    };

    function renderOperatorList() {
        const list = document.getElementById('operator-list');
        list.innerHTML = operatorData.map(o => `
            <div class="bg-indigo-50 px-4 py-2 rounded-xl flex items-center gap-3">
                <span class="text-xs font-bold text-indigo-700">${o.name}</span>
                <div class="flex gap-1">
                    <button onclick="editOp('${o.id}')" class="text-indigo-400 text-[10px] font-bold uppercase">Edito</button>
                    <button onclick="deleteItem('operators', '${o.id}')" class="text-red-400 font-bold hover:text-red-600 transition">&times;</button>
                </div>
            </div>
        `).join("");
    }

    function updateDropdowns() {
        const acts = configData.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
        const ops = operatorData.map(o => `<option value="${o.name}">${o.name}</option>`).join("");
        document.getElementById('log-act-select').innerHTML = `<option value="">-- Zgjidh --</option>` + acts;
        document.getElementById('log-operator-select').innerHTML = `<option value="">-- Zgjidh --</option>` + ops;
        document.getElementById('rep-op-select').innerHTML = `<option value="">Eksperti: Të gjithë</option>` + ops;
        document.getElementById('rep-act-select').innerHTML = `<option value="">Aktiviteti: Të gjithë</option>` + acts;
    }

    window.generateProcessFields = (valuesMap = null) => {
        const actId = document.getElementById('log-act-select').value;
        const container = document.getElementById('dynamic-fields-container');
        container.innerHTML = "";
        if(!actId) return;
        const act = configData.find(c => c.id === actId);
        act.processes.forEach(p => {
            const val = valuesMap ? (valuesMap[p.label] || "") : "";
            container.innerHTML += `<div class="space-y-1">
                <label class="text-[10px] font-extrabold text-slate-500 uppercase">${p.label}</label>
                <input type="${p.type}" data-label="${p.label}" value="${val}" class="process-input w-full p-4 rounded-xl bg-white border border-slate-100 font-bold text-sm" oninput="calculateBalance()">
            </div>`;
        });
        if(act.autoCalc) container.innerHTML += `<div id="calc-preview" class="bg-indigo-600 text-white p-5 rounded-2xl text-center font-black">Llogaritja: 0</div>`;
        if(valuesMap) calculateBalance();
    };

    window.calculateBalance = () => {
        const act = configData.find(c => c.id === document.getElementById('log-act-select').value);
        if(!act || !act.autoCalc) return;
        const inputs = document.querySelectorAll('.process-input');
        let total = 0; let first = true;
        inputs.forEach(i => {
            const v = parseFloat(i.value) || 0;
            if(first) { total = v; first = false; }
            else { if(i.dataset.label.toLowerCase().includes('fshir')) total -= v; else total += v; }
        });
        document.getElementById('calc-preview').innerText = `Llogaritja: ${total}`;
    };

    document.getElementById('save-log-btn').onclick = async () => {
        const actId = document.getElementById('log-act-select').value;
        const date = document.getElementById('log-date').value;
        const operator = document.getElementById('log-operator-select').value;
        const hours = document.getElementById('log-hours').value;
        const logEditId = document.getElementById('log-edit-id').value;

        if(!actId || !date || !operator || !hours) return showAlert("Plotësoni të gjitha fushat.");
        
        const processes = Array.from(document.querySelectorAll('.process-input')).map(i => ({
            label: i.dataset.label, value: i.value
        }));

        const id = logEditId || Date.now().toString();
        
        await setDoc(doc(db, `artifacts/${appId}/public/data/logs`, id), {
            actId, actName: configData.find(c => c.id === actId).name, date, operator, hours: parseFloat(hours), processes
        });
        
        showAlert(logEditId ? "Modifikimi u krye!" : "U ruajt!");
        cancelLogEdit();
    };

    window.cancelLogEdit = () => {
        document.getElementById('log-edit-id').value = "";
        document.getElementById('log-hours').value = "";
        document.getElementById('log-act-select').value = "";
        document.getElementById('log-operator-select').value = "";
        document.getElementById('dynamic-fields-container').innerHTML = "";
        document.getElementById('cancel-log-edit').classList.add('hidden');
        document.getElementById('save-log-btn').innerText = "Ruaj në Cloud";
    };

    window.editLogEntry = (id) => {
        const log = logData.find(l => l.id === id);
        if(!log) return;
        switchTab('log');
        document.getElementById('log-edit-id').value = id;
        document.getElementById('log-date').value = log.date;
        document.getElementById('log-operator-select').value = log.operator;
        document.getElementById('log-act-select').value = log.actId;
        document.getElementById('log-hours').value = log.hours;
        
        const valuesMap = {};
        log.processes.forEach(p => valuesMap[p.label] = p.value);
        generateProcessFields(valuesMap);
        
        document.getElementById('cancel-log-edit').classList.remove('hidden');
        document.getElementById('save-log-btn').innerText = "Zëvendëso dhe Ruaj";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.getFilteredLogs = () => {
        const start = document.getElementById('rep-start').value;
        const end = document.getElementById('rep-end').value;
        const selOp = document.getElementById('rep-op-select').value;
        const selAct = document.getElementById('rep-act-select').value;
        let filtered = [...logData].sort((a,b) => b.date.localeCompare(a.date));
        if(start) filtered = filtered.filter(f => f.date >= start);
        if(end) filtered = filtered.filter(f => f.date <= end);
        if(selOp) filtered = filtered.filter(f => f.operator === selOp);
        if(selAct) filtered = filtered.filter(f => f.actId === selAct);
        return filtered;
    };

    window.renderReportList = () => {
        const filtered = getFilteredLogs();
        document.getElementById('report-results').innerHTML = filtered.map(log => `
            <div class="bg-white p-5 rounded-[2rem] border border-slate-100 shadow-sm space-y-4">
                <div class="flex justify-between items-start">
                    <div>
                        <span class="text-[9px] font-black bg-indigo-50 text-indigo-600 px-2 py-1 rounded uppercase">${log.actName}</span>
                        <h4 class="font-bold text-slate-800 text-sm mt-1">${log.operator} | ${log.date}</h4>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="editLogEntry('${log.id}')" class="text-indigo-500 text-[10px] font-bold uppercase bg-indigo-50 px-2 py-1 rounded">Edito</button>
                        <button onclick="deleteItem('logs', '${log.id}')" class="text-red-300 font-bold hover:text-red-500 transition-colors">&times;</button>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2 border-t pt-2">${log.processes.map(p => `<div class="text-[10px]"><b>${p.label}:</b> ${p.value}</div>`).join("")}</div>
                <div class="text-[10px] text-right font-bold text-indigo-600">Ore: ${log.hours}</div>
            </div>
        `).join("");
    };

    window.exportToPDF = () => {
        const { jsPDF } = window.jspdf;
        const docPDF = new jsPDF('l', 'mm', 'a4');
        const filtered = getFilteredLogs();

        const start = document.getElementById('rep-start').value || "Fillimi";
        const end = document.getElementById('rep-end').value || "Sot";
        const op = document.getElementById('rep-op-select').value || "Të gjithë";
        const act = document.getElementById('rep-act-select').options[document.getElementById('rep-act-select').selectedIndex].text;

        docPDF.setFontSize(16);
        docPDF.text("Raporti LindiMaps Cloud", 14, 15);
        docPDF.setFontSize(10);
        docPDF.text(`Periudha: ${start} deri ${end}`, 14, 22);
        docPDF.text(`Eksperti: ${op}`, 14, 27);
        docPDF.text(`Aktiviteti: ${act}`, 14, 32);

        let processLabels = [];
        filtered.forEach(log => {
            log.processes.forEach(p => {
                if(!processLabels.includes(p.label)) processLabels.push(p.label);
            });
        });

        const headers = [['Data', 'Aktiviteti', 'Eksperti', 'Ore', ...processLabels]];
        
        const bodyData = filtered.map(f => {
            const row = [f.date, f.actName, f.operator, f.hours];
            processLabels.forEach(label => {
                const p = f.processes.find(item => item.label === label);
                row.push(p ? p.value : "-");
            });
            return row;
        });

        docPDF.autoTable({ 
            startY: 40, 
            head: headers, 
            body: bodyData,
            theme: 'striped',
            headStyles: { fillColor: [79, 70, 229] },
            styles: { fontSize: 8, cellPadding: 2 }
        });

        docPDF.save(`Raport_LindiMaps_${start}_${end}.pdf`);
    };

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('log-date').value = today;
    document.getElementById('rep-end').value = today;
</script>
</body>
</html>
