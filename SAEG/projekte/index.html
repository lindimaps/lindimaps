<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofoli i Ekselencës | Arkitektura</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            margin: 0;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #ED2939;
            border-radius: 10px;
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Smooth transitions for lightbox */
        .lightbox-enter { opacity: 0; }
        .lightbox-enter-active { opacity: 1; transition: opacity 300ms; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Mock Data
        const projectsData = [
            {
                id: 1,
                title: "Skyline Residence",
                location: "Vjenë, Distrikti 1",
                category: "Rezidencial",
                year: "2023",
                description: "Një kompleks luksoz banimi që sfidon gravitetin me konzola të gjata dhe xham fasadë strukturor.",
                mainImage: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&q=80&w=1200",
                gallery: [
                    "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&q=80&w=1200",
                    "https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&q=80&w=1200",
                    "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&q=80&w=1200"
                ]
            },
            {
                id: 2,
                title: "Industrial Hub Linz",
                location: "Linz, Austri",
                category: "Gewerbebau",
                year: "2022",
                description: "Qendër logjistike e teknologjisë së lartë me fokus në efiçencën energjetike dhe strukturat e çelikut.",
                mainImage: "https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&q=80&w=1200",
                gallery: [
                    "https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&q=80&w=1200",
                    "https://images.unsplash.com/photo-1581094794329-c8112a89af12?auto=format&fit=crop&q=80&w=1200",
                    "https://images.unsplash.com/photo-1565008447742-97f6f38c985c?auto=format&fit=crop&q=80&w=1200"
                ]
            },
            {
                id: 3,
                title: "Alpine Resort & Spa",
                location: "Tirol, Austri",
                category: "Hotelier",
                year: "2024",
                description: "Integrimi i betonit arkitektonik me drurin natyral në zemër të Alpeve Austriake.",
                mainImage: "https://images.unsplash.com/photo-1582719508461-905c673771fd?auto=format&fit=crop&q=80&w=1200",
                gallery: [
                    "https://images.unsplash.com/photo-1582719508461-905c673771fd?auto=format&fit=crop&get=80&w=1200",
                    "https://images.unsplash.com/photo-1590490360182-c33d57733427?auto=format&fit=crop&q=80&w=1200",
                    "https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&q=80&w=1200"
                ]
            },
            {
                id: 4,
                title: "Modern Loft Renovation",
                location: "Graz, Austri",
                category: "Sanierung",
                year: "2023",
                description: "Transformimi i një fabrike të vjetër në apartamente ultra-moderne me stil industrial.",
                mainImage: "https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&q=80&w=1200",
                gallery: [
                    "https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&q=80&w=1200",
                    "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&q=80&w=1200",
                    "https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&q=80&w=1200"
                ]
            }
        ];

        // Simple Icon Component (Fallback for Lucide when used in HTML)
        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const App = () => {
            const [filter, setFilter] = useState("Të gjitha");
            const [selectedProject, setSelectedProject] = useState(null);
            const [currentImgIndex, setCurrentImgIndex] = useState(0);
            const [isLoaded, setIsLoaded] = useState(false);

            useEffect(() => {
                setIsLoaded(true);
            }, []);

            const categories = ["Të gjitha", "Rezidencial", "Gewerbebau", "Hotelier", "Sanierung"];
            
            const filteredProjects = filter === "Të gjitha" 
                ? projectsData 
                : projectsData.filter(p => p.category === filter);

            const openLightbox = (project) => {
                setSelectedProject(project);
                setCurrentImgIndex(0);
                document.body.style.overflow = 'hidden';
            };

            const closeLightbox = () => {
                setSelectedProject(null);
                document.body.style.overflow = 'auto';
            };

            const nextImg = (e) => {
                e.stopPropagation();
                setCurrentImgIndex((prev) => (prev + 1) % selectedProject.gallery.length);
            };

            const prevImg = (e) => {
                e.stopPropagation();
                setCurrentImgIndex((prev) => (prev - 1 + selectedProject.gallery.length) % selectedProject.gallery.length);
            };

            return (
                <div className="min-h-screen bg-slate-950 text-white font-sans selection:bg-[#ED2939]">
                    
                    {/* Header Dinamik */}
                    <section className="relative pt-40 pb-20 overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-full">
                            <div className="absolute top-0 right-0 w-1/3 h-full bg-red-600/10 blur-[120px]"></div>
                            <div className="absolute bottom-0 left-0 w-1/4 h-1/2 bg-blue-600/5 blur-[100px]"></div>
                        </div>
                        
                        <div className="container mx-auto px-6 relative z-10">
                            <div className="flex flex-col md:flex-row md:items-end justify-between gap-10">
                                <div className={`transition-all duration-1000 transform ${isLoaded ? 'translate-y-0 opacity-100' : 'translate-y-20 opacity-0'}`}>
                                    <span className="text-[#ED2939] font-black uppercase tracking-[0.5em] text-[10px] mb-4 block">Portofoli i Ekselencës</span>
                                    <h1 className="text-6xl md:text-9xl font-black uppercase tracking-tighter leading-[0.8]">
                                        PROJEKTET<span className="text-[#ED2939]">.</span>
                                    </h1>
                                </div>
                                <div className={`max-w-md text-slate-400 text-lg border-l-2 border-red-600 pl-6 transition-all duration-1000 delay-300 transform ${isLoaded ? 'translate-x-0 opacity-100' : 'translate-x-20 opacity-0'}`}>
                                    Eksploroni trashëgiminë tonë arkitekturore përmes projekteve që kanë riformuar peizazhin e Austrisë.
                                </div>
                            </div>

                            {/* Filtra Interaktivë */}
                            <div className="mt-20 flex flex-wrap gap-4 items-center">
                                <div className="p-2 bg-white/5 backdrop-blur-md rounded-full border border-white/10 flex flex-wrap gap-2">
                                    {categories.map((cat) => (
                                        <button 
                                            key={cat}
                                            onClick={() => setFilter(cat)}
                                            className={`px-6 py-2 rounded-full text-[10px] font-black uppercase tracking-widest transition-all ${filter === cat ? 'bg-[#ED2939] text-white shadow-lg' : 'hover:bg-white/10 text-slate-400'}`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>
                                <span className="ml-4 text-[10px] font-black text-slate-600 uppercase tracking-widest">
                                    {filteredProjects.length} Projekte të gjetura
                                </span>
                            </div>
                        </div>
                    </section>

                    {/* Grid e Projekteve */}
                    <section className="py-20">
                        <div className="container mx-auto px-6">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-12">
                                {filteredProjects.map((project, idx) => (
                                    <div 
                                        key={project.id}
                                        className={`group relative overflow-hidden rounded-[2.5rem] bg-slate-900 transition-all duration-700 transform ${isLoaded ? 'translate-y-0 opacity-100' : 'translate-y-20 opacity-0'}`}
                                        style={{ transitionDelay: `${idx * 150}ms` }}
                                    >
                                        <div className="relative h-[500px] overflow-hidden">
                                            <img 
                                                src={project.mainImage} 
                                                alt={project.title}
                                                className="w-full h-full object-cover grayscale group-hover:grayscale-0 group-hover:scale-110 transition-all duration-1000"
                                            />
                                            <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent opacity-80 group-hover:opacity-60 transition-opacity"></div>
                                            
                                            <div className="absolute top-8 left-8 flex gap-2">
                                                <span className="px-4 py-2 bg-black/50 backdrop-blur-md rounded-full text-[9px] font-black uppercase tracking-widest border border-white/10">
                                                    {project.category}
                                                </span>
                                                <span className="px-4 py-2 bg-[#ED2939] rounded-full text-[9px] font-black uppercase tracking-widest">
                                                    {project.year}
                                                </span>
                                            </div>

                                            <button 
                                                onClick={() => openLightbox(project)}
                                                className="absolute top-8 right-8 w-12 h-12 bg-white rounded-full flex items-center justify-center text-black opacity-0 group-hover:opacity-100 transform translate-y-4 group-hover:translate-y-0 transition-all hover:bg-[#ED2939] hover:text-white"
                                            >
                                                <Icon name="maximize-2" size={20} />
                                            </button>
                                        </div>

                                        <div className="p-10 relative">
                                            <div className="flex justify-between items-start mb-6">
                                                <div>
                                                    <h3 className="text-4xl font-black uppercase tracking-tighter mb-2 group-hover:text-[#ED2939] transition-colors">
                                                        {project.title}
                                                    </h3>
                                                    <div className="flex items-center gap-2 text-slate-500 font-bold text-sm">
                                                        <Icon name="map-pin" size={16} className="text-red-600" /> {project.location}
                                                    </div>
                                                </div>
                                                <div className="w-14 h-14 border border-white/10 rounded-2xl flex items-center justify-center group-hover:border-red-600 group-hover:bg-red-600 transition-all">
                                                    <Icon name="arrow-right" className="text-white transform group-hover:-rotate-45 transition-transform" />
                                                </div>
                                            </div>
                                            <p className="text-slate-400 leading-relaxed mb-8 line-clamp-2">
                                                {project.description}
                                            </p>
                                            
                                            <div className="flex gap-3">
                                                {project.gallery.slice(0, 3).map((img, i) => (
                                                    <div key={i} className="w-12 h-12 rounded-lg overflow-hidden border border-white/10 opacity-60 hover:opacity-100 cursor-pointer transition-opacity" onClick={() => openLightbox(project)}>
                                                        <img src={img} className="w-full h-full object-cover" alt="preview" />
                                                    </div>
                                                ))}
                                                {project.gallery.length > 3 && (
                                                    <div className="w-12 h-12 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center text-[10px] font-black">
                                                        +{project.gallery.length - 3}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Lightbox / Gallery Shfletuesi */}
                    {selectedProject && (
                        <div 
                            className="fixed inset-0 z-[200] bg-black/95 backdrop-blur-xl flex flex-col items-center justify-center p-4 md:p-10"
                            onClick={closeLightbox}
                        >
                            <div className="absolute top-0 left-0 w-full p-8 flex justify-between items-center z-10">
                                <div className="flex items-center gap-4">
                                    <div className="h-10 w-1 bg-red-600"></div>
                                    <div>
                                        <h4 className="text-white font-black uppercase tracking-widest text-sm">{selectedProject.title}</h4>
                                        <p className="text-slate-500 text-[10px] uppercase tracking-[0.2em]">{selectedProject.location}</p>
                                    </div>
                                </div>
                                <button 
                                    onClick={closeLightbox}
                                    className="w-12 h-12 rounded-full bg-white/10 hover:bg-red-600 text-white flex items-center justify-center transition-all"
                                >
                                    <Icon name="x" size={24} />
                                </button>
                            </div>

                            <div className="relative w-full max-w-6xl aspect-[16/9] md:aspect-video rounded-3xl overflow-hidden shadow-2xl group" onClick={(e) => e.stopPropagation()}>
                                <img 
                                    src={selectedProject.gallery[currentImgIndex]} 
                                    className="w-full h-full object-cover"
                                    alt="Gallery display"
                                />
                                
                                <button 
                                    onClick={prevImg}
                                    className="absolute left-6 top-1/2 -translate-y-1/2 w-16 h-16 rounded-full bg-black/50 backdrop-blur-md text-white flex items-center justify-center hover:bg-red-600 transition-all md:opacity-0 group-hover:opacity-100"
                                >
                                    <Icon name="chevron-left" size={32} />
                                </button>
                                <button 
                                    onClick={nextImg}
                                    className="absolute right-6 top-1/2 -translate-y-1/2 w-16 h-16 rounded-full bg-black/50 backdrop-blur-md text-white flex items-center justify-center hover:bg-red-600 transition-all md:opacity-0 group-hover:opacity-100"
                                >
                                    <Icon name="chevron-right" size={32} />
                                </button>

                                <div className="absolute bottom-8 left-1/2 -translate-x-1/2 px-6 py-2 bg-black/50 backdrop-blur-md rounded-full text-[10px] font-black tracking-widest border border-white/10">
                                    {currentImgIndex + 1} / {selectedProject.gallery.length}
                                </div>
                            </div>

                            <div className="mt-10 flex gap-4 overflow-x-auto pb-4 max-w-full px-4" onClick={(e) => e.stopPropagation()}>
                                {selectedProject.gallery.map((img, i) => (
                                    <button 
                                        key={i}
                                        onClick={() => setCurrentImgIndex(i)}
                                        className={`flex-shrink-0 w-24 h-16 rounded-xl overflow-hidden border-2 transition-all ${currentImgIndex === i ? 'border-red-600 scale-105' : 'border-transparent opacity-40 hover:opacity-100'}`}
                                    >
                                        <img src={img} className="w-full h-full object-cover" alt="thumbnail" />
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Footer Minimalist */}
                    <footer className="py-20 border-t border-white/5 bg-black">
                        <div className="container mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-10">
                            <div className="text-center md:text-left">
                                <h4 className="text-2xl font-black uppercase tracking-tighter mb-2">Dëshironi një kryevepër të tillë?</h4>
                                <p className="text-slate-500 text-sm">Le të ndërtojmë vizionin tuaj të ardhshëm së bashku.</p>
                            </div>
                            <button className="px-12 py-5 bg-[#ED2939] text-white font-black rounded-full hover:bg-white hover:text-black transition-all uppercase tracking-widest text-xs">
                                NA KONTAKTONI
                            </button>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
