<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LindiMaps Pagesat</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
    body { font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
    .worker-row { border-bottom: 1px solid #f1f5f9; padding: 12px 0; }
    .edit-mode { background-color: #fffbeb; border: 2px solid #f59e0b !important; border-radius: 12px; }
    button:active { transform: scale(0.96); opacity: 0.9; }
    input { font-size: 16px !important; }
    .modal-overlay { background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
</style>
</head>

<body class="bg-slate-100 pb-10">

<!-- LOGIN SECTION -->
<div id="login" class="flex items-center justify-center min-h-screen px-4">
    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm space-y-5 border border-slate-200">
        <h2 class="text-2xl font-black text-center text-slate-800">LindiMaps</h2>
        <div class="space-y-4">
            <input id="email" type="email" placeholder="Email" class="w-full border border-slate-200 p-3 rounded-xl outline-none focus:border-indigo-500">
            <input id="password" type="password" placeholder="Password" class="w-full border border-slate-200 p-3 rounded-xl outline-none focus:border-indigo-500">
            <button onclick="window.loginUser()" class="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold shadow-lg shadow-indigo-100">Kyçu</button>
            <div class="flex flex-col items-center gap-3 pt-2">
                <button onclick="window.toggleRegModal(true)" class="text-indigo-600 font-bold text-sm">Krijo llogari (Konfirmim me Email)</button>
                <button onclick="window.resetPassword()" class="text-slate-400 text-xs underline">Harruat fjalëkalimin?</button>
            </div>
        </div>
    </div>
</div>

<!-- REGISTRATION MODAL -->
<div id="regModal" class="hidden fixed inset-0 z-50 modal-overlay flex items-center justify-center px-4">
    <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm space-y-4">
        <h3 class="text-xl font-bold text-slate-800">Regjistrimi</h3>
        <p class="text-xs text-slate-500 italic font-medium text-center">Pas regjistrimit, duhet të klikoni linkun që do t'ju vijë në email për të aktivizuar llogarinë.</p>
        <input id="regEmail" type="email" placeholder="Email i saktë" class="w-full border p-3 rounded-xl outline-none focus:border-emerald-500">
        <input id="regPassword" type="password" placeholder="Password i ri" class="w-full border p-3 rounded-xl outline-none focus:border-emerald-500">
        <button onclick="window.registerUser()" class="w-full bg-emerald-600 text-white p-4 rounded-xl font-bold">Regjistrohu & Dërgo Email</button>
        <button onclick="window.toggleRegModal(false)" class="w-full text-slate-500 font-medium py-2">Mbyll</button>
    </div>
</div>

<!-- APP MAIN -->
<div id="app" class="hidden max-w-lg mx-auto p-4 space-y-6">
    <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <span id="userEmail" class="font-bold text-slate-700 text-sm truncate max-w-[180px]"></span>
        <button onclick="window.logout()" class="bg-red-500 text-white px-4 py-2 rounded-xl text-xs font-bold">Dil</button>
    </div>

    <div class="bg-white p-5 rounded-2xl shadow-sm space-y-3 border border-slate-200">
        <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Eksportimi & Raporti</h3>
        <input type="month" id="pdfMonth" class="border border-slate-200 p-3 rounded-xl w-full bg-slate-50">
        <div class="grid grid-cols-2 gap-3">
            <button onclick="window.exportPDF()" class="bg-indigo-600 text-white p-3 rounded-xl font-bold text-sm">Gjenero PDF</button>
            <button onclick="window.backupData()" class="bg-slate-800 text-white p-3 rounded-xl font-bold text-sm">Backup Data</button>
        </div>
    </div>

    <div id="workerForm" class="bg-white p-5 rounded-2xl shadow-sm space-y-4 border border-slate-200 transition-all">
        <h3 id="formTitle" class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Menaxho Punëtorët</h3>
        <input id="name" placeholder="Emri Mbiemri" class="border border-slate-200 p-3 rounded-xl w-full bg-slate-50 outline-none">
        <input id="rate" type="number" step="0.01" placeholder="Pagesa për orë (€/h)" class="border border-slate-200 p-3 rounded-xl w-full bg-slate-50 outline-none">
        <div class="flex flex-col gap-2">
            <button id="addBtn" onclick="window.addWorker()" class="bg-blue-600 text-white p-3 rounded-xl font-bold">Shto Punëtorin</button>
            <button id="cancelBtn" onclick="window.cancelEdit()" class="hidden bg-slate-400 text-white p-3 rounded-xl font-bold">Anulo Ndryshimin</button>
        </div>
    </div>

    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
        <div class="flex justify-between items-center">
            <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Punët Ditore</h3>
            <input type="date" id="date" class="border-none bg-indigo-50 text-indigo-700 font-bold p-1 rounded-lg text-sm">
        </div>
        <div id="daily" class="space-y-2"></div>
        <button onclick="window.saveHours()" class="w-full bg-black text-white p-4 rounded-2xl font-bold shadow-lg">Ruaj Orët Ditore</button>
    </div>

    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Lista Aktive</h3>
        <div class="flex gap-2 mb-4">
            <input type="date" id="start" class="border p-2 rounded-lg flex-1 text-xs font-medium">
            <input type="date" id="end" class="border p-2 rounded-lg flex-1 text-xs font-medium">
        </div>
        <div id="totals" class="divide-y divide-slate-100"></div>
        
        <div class="grid grid-cols-2 gap-3 mt-6 border-t pt-5">
            <div class="bg-indigo-50 p-4 rounded-2xl border border-indigo-100 text-center">
                <p class="text-[9px] font-black text-indigo-400 uppercase">Totali €</p>
                <span id="totalMoney" class="font-black text-xl text-indigo-700">0.00€</span>
            </div>
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 text-center">
                <p class="text-[9px] font-black text-slate-400 uppercase">Totali Orë</p>
                <span id="totalHours" class="font-black text-xl text-slate-700">0h</span>
            </div>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
import { 
 getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, 
 signOut, onAuthStateChanged, sendPasswordResetEmail, sendEmailVerification 
} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

const firebaseConfig = {
 apiKey: "AIzaSyDGlHCPxysEO4ZxxIPic3u7rRZCo7oZTZ4",
 authDomain: "workhours-fb74a.firebaseapp.com",
 projectId: "workhours-fb74a",
 storageBucket: "workhours-fb74a.appspot.com"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUserObj, workers = [], logs = [];
let editId = null;

const validateEmail = (email) => {
    return String(email).toLowerCase().match(/^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/);
};

/* --- UI HELPERS --- */
window.toggleRegModal = (show) => {
    document.getElementById("regModal").classList.toggle("hidden", !show);
};

/* --- AUTH --- */
window.loginUser = async ()=>{
 try {
  const email = document.getElementById("email").value.trim();
  const pass = document.getElementById("password").value;
  if(!email || !validateEmail(email)) return alert("Plotësoni saktë email-in tuaj!");
  if(!pass) return alert("Ju lutem shkruani fjalëkalimin!");
  
  const userCredential = await signInWithEmailAndPassword(auth, email, pass);
  const user = userCredential.user;

  if(!user.emailVerified) {
      alert("Ju lutem konfirmoni email-in tuaj në inbox për të vazhduar! Ky llogari nuk është aktive pa konfirmim.");
      await signOut(auth);
      return;
  }
 } catch(e){ 
    if(e.code === 'auth/wrong-password') alert("Keni shkruajtur gabim paswordin!");
    else if(e.code === 'auth/user-not-found') alert("Ky email nuk është i regjistruar!");
    else alert("Gabim: " + e.message);
 }
};

window.registerUser = async ()=>{
 try {
  const email = document.getElementById("regEmail").value.trim();
  const pass = document.getElementById("regPassword").value;
  if(!email || !validateEmail(email)) return alert("Ju lutem plotësoni saktë email-in!");
  if(!pass || pass.length < 6) return alert("Fjalëkalimi duhet të jetë të paktën 6 karaktere!");
  
  const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
  await sendEmailVerification(userCredential.user);
  
  alert("U regjistruat me suksese! Një email konfirmimi u dërgua te " + email + ". Ju lutem konfirmoni linkun para se të kyçeni.");
  await signOut(auth); // Largojme direkt qe te detyrohet te beje login pas konfirmimit
  window.toggleRegModal(false);
 } catch(e){ alert("Gabim gjatë regjistrimit: " + e.message); }
};

window.resetPassword = async ()=>{
 try {
  const email = document.getElementById("email").value.trim();
  if(!email || !validateEmail(email)) return alert("Shkruani email-in tuaj saktë që t'ju dërgojmë linkun!");
  await sendPasswordResetEmail(auth, email);
  alert("Emaili u dërgua për rivendosjen e pasworsit");
 } catch(e){ alert("Gabim: " + e.message); }
};

window.logout = async ()=>{
 await signOut(auth);
 location.reload();
};

onAuthStateChanged(auth, u=>{
 if(u && u.emailVerified){
  currentUserObj = u;
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("userEmail").innerText = u.email;
  start();
 } else {
  document.getElementById("app").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
 }
});

/* --- CORE --- */
function start(){
 const base = `users/${currentUserObj.uid}`;
 onSnapshot(collection(db, base+"/workers"), snap=>{
  workers = snap.docs.map(d=>({id:d.id,...d.data()}));
  renderDaily();
  renderTotals();
 });
 onSnapshot(collection(db, base+"/logs"), snap=>{
  logs = snap.docs.map(d=>({id:d.id,...d.data()}));
  renderDaily();
  renderTotals();
 });
}

/* --- WORKER MANAGEMENT --- */
window.addWorker = async ()=>{
 const name = document.getElementById("name").value.trim();
 const rate = parseFloat(document.getElementById("rate").value);
 if(!name || isNaN(rate)) return alert("Plotësoni të dhënat saktë!");

 const id = editId || Date.now().toString();
 try {
    await setDoc(doc(db, `users/${currentUserObj.uid}/workers`, id), { name, rate });
    if(editId) alert("Ndryshimi u ruajt");
    else alert("Punëtori u shtua me sukses");
    window.cancelEdit();
 } catch(e) { alert("Gabim gjatë ruajtjes."); }
};

window.editWorker = (id) => {
    const w = workers.find(x => x.id === id);
    if(!w) return;
    editId = id;
    document.getElementById("name").value = w.name;
    document.getElementById("rate").value = w.rate;
    document.getElementById("addBtn").innerText = "Ruaj Ndryshimin";
    document.getElementById("formTitle").innerText = "Duke Edituar Punëtorin";
    document.getElementById("cancelBtn").classList.remove("hidden");
    document.getElementById("workerForm").classList.add("edit-mode");
    window.scrollTo({top: 0, behavior: 'smooth'});
};

window.cancelEdit = () => {
    editId = null;
    document.getElementById("name").value = "";
    document.getElementById("rate").value = "";
    document.getElementById("addBtn").innerText = "Shto Punëtorin";
    document.getElementById("formTitle").innerText = "Menaxho Punëtorët";
    document.getElementById("cancelBtn").classList.add("hidden");
    document.getElementById("workerForm").classList.remove("edit-mode");
};

window.deleteWorker = async (workerId) => {
    if(confirm("A jeni i sigurt që dëshironi ta hiqni këtë punëtor nga lista përgjithmonë?")){
        try {
            await deleteDoc(doc(db, `users/${currentUserObj.uid}/workers/${workerId}`));
            alert("Punëtori u hoq nga lista");
        } catch(e) { alert("Gabim gjatë fshirjes."); }
    }
};

/* --- DAILY LOGS --- */
window.renderDaily = ()=>{
 const date = document.getElementById("date").value;
 document.getElementById("daily").innerHTML = workers.map(w=>{
  const l = logs.find(x=>x.date===date && x.workerId===w.id);
  return `
  <div class="flex justify-between items-center bg-white p-4 rounded-xl border border-slate-100 shadow-sm">
   <span class="font-bold text-slate-700 text-sm">${w.name}</span>
   <div class="flex items-center gap-2">
    <input type="number" data-id="${w.id}" value="${l?l.hours:''}" class="border border-slate-200 w-16 p-2 text-center rounded-lg font-black bg-slate-50 outline-none">
    <span class="text-[10px] font-black text-slate-400">H</span>
   </div>
  </div>`;
 }).join("");
};

window.saveHours = async ()=>{
 const date = document.getElementById("date").value;
 const inputs = document.querySelectorAll("#daily input");
 try {
     for (let i of inputs) {
      const h = parseFloat(i.value)||0;
      const id = i.dataset.id;
      const ref = doc(db, `users/${currentUserObj.uid}/logs`, date+"_"+id);
      if(h>0) await setDoc(ref,{date,workerId:id,hours:h});
      else await deleteDoc(ref);
     }
     alert("Orët u ruajtën me sukses!");
 } catch(e) { alert("Gabim gjatë ruajtjes."); }
};

/* --- TOTALS & PDF --- */
window.renderTotals = ()=>{
 const start = document.getElementById("start").value;
 const end = document.getElementById("end").value;
 let tH=0, tM=0;

 document.getElementById("totals").innerHTML = workers.map(w=>{
  const wl = logs.filter(l=>{
   if(l.workerId !== w.id) return false;
   if(start && l.date < start) return false;
   if(end && l.date > end) return false;
   return true;
  });
  const h = wl.reduce((a,b)=>a+b.hours,0);
  const m = h * w.rate;
  tH += h; tM += m;
  return `
  <div class="worker-row flex flex-col gap-2">
   <div class="flex justify-between items-center">
    <span class="font-bold text-sm text-slate-800">${w.name}</span>
    <span class="text-sm font-black text-indigo-600">${h}h | ${m.toFixed(2)}€</span>
   </div>
   <div class="flex gap-4">
    <button onclick="window.editWorker('${w.id}')" class="text-[10px] text-blue-500 font-black uppercase tracking-widest">Edito</button>
    <button onclick="window.deleteWorker('${w.id}')" class="text-[10px] text-red-500 font-black uppercase tracking-widest">Fshi Punëtorin</button>
   </div>
  </div>`;
 }).join("");

 document.getElementById("totalHours").innerText = tH+"h";
 document.getElementById("totalMoney").innerText = tM.toFixed(2)+"€";
};

window.exportPDF = ()=>{
 const { jsPDF } = window.jspdf;
 const docPDF = new jsPDF();
 const monthInput = document.getElementById("pdfMonth").value;
 if(!monthInput) return alert("Zgjidhni muajin!");

 const [year, month] = monthInput.split("-");
 const muajShqip = ["Janar", "Shkurt", "Mars", "Prill", "Maj", "Qershor", "Korrik", "Gusht", "Shtator", "Tetor", "Nëntor", "Dhjetor"];
 const monthName = muajShqip[parseInt(month)-1];

 docPDF.setFontSize(20);
 docPDF.text("LindiMaps Pagesat", 10, 20);
 docPDF.setFontSize(12);
 docPDF.text(`Orët e punës përgjatë Muajit ${monthName} ${year} sipas listës më poshtë:`, 10, 35);

 let y = 50;
 docPDF.setFont("helvetica", "bold");
 docPDF.text("Emri Mbiemri", 10, y);
 docPDF.text("Orët", 100, y);
 docPDF.text("€/h", 130, y);
 docPDF.text("Total", 170, y);
 docPDF.line(10, y+2, 200, y+2);
 y += 10;

 docPDF.setFont("helvetica", "normal");
 let totalMonth = 0;
 workers.forEach(w=>{
  const filtered = logs.filter(l => l.workerId === w.id && l.date.startsWith(monthInput));
  const h = filtered.reduce((a,b)=>a+b.hours,0);
  const m = h * w.rate;
  if(h > 0) {
    totalMonth += m;
    docPDF.text(`${w.name}`, 10, y);
    docPDF.text(`${h}`, 100, y);
    docPDF.text(`${w.rate.toFixed(2)}`, 130, y);
    docPDF.text(`${m.toFixed(2)} €`, 170, y);
    y += 10;
  }
 });
 docPDF.line(10, y, 200, y);
 docPDF.setFont("helvetica", "bold");
 docPDF.text(`TOTALI: ${totalMonth.toFixed(2)} €`, 150, y+10);
 docPDF.save(`Raporti-${monthName}-${year}.pdf`);
};

window.backupData = ()=>{
 const dataStr = JSON.stringify({workers,logs});
 const blob = new Blob([dataStr], {type: "application/json"});
 const a = document.createElement("a");
 a.href = URL.createObjectURL(blob);
 a.download = `Backup-LindiMaps-${new Date().toISOString().slice(0,10)}.json`;
 a.click();
 alert("Backup u shkarkua me sukses");
};

const t = new Date().toISOString().slice(0,10);
document.getElementById("date").value = t;
document.getElementById("start").value = t.slice(0,8)+"01";
document.getElementById("end").value = t;
document.getElementById("pdfMonth").value = t.slice(0,7);
document.getElementById("date").onchange = renderDaily;
document.getElementById("start").onchange = renderTotals;
document.getElementById("end").onchange = renderTotals;

</script>
</body>
</html>
