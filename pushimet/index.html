<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINDIMAPS Systems - Menaxhimi i Lejeve</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (Versionet e qëndrueshme) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel për të procesuar JSX direkt në shfletues -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDK (Versionet klasike që nuk kërkojnë importmap) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
    </style>
</head>
<body>
    <div id="root">
        <div class="flex items-center justify-center h-screen text-slate-400 font-bold animate-pulse uppercase tracking-widest text-xs">
            Duke hapur sistemin...
        </div>
    </div>

    <script type="text/babel">
        // Konfigurimi yt i Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDe_lLPQIhfJZaCZ0dZqRlLH0-kfyfy8Sw",
            authDomain: "pushimet.firebaseapp.com",
            projectId: "pushimet",
            storageBucket: "pushimet.firebasestorage.app",
            messagingSenderId: "1024807492402",
            appId: "1:1024807492402:web:7ccaa6f39947bc41d5952b",
            measurementId: "G-Q0K9EWJ824"
        };

        // Inicializimi i Firebase (Versioni Compat)
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const { useState, useEffect, useMemo } = React;

        const Logo = () => (
            <div className="flex items-center gap-3">
                <div className="h-10 w-10 flex items-center justify-center bg-slate-900 rounded-xl shadow-lg">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2">
                        <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z" fill="white" fillOpacity="0.2"/>
                    </svg>
                </div>
                <div className="flex flex-col">
                    <h1 className="text-xl font-black tracking-tighter leading-none">
                        <span className="text-slate-900">LINDI</span>
                        <span className="text-blue-600">MAPS</span>
                    </h1>
                    <span className="text-[7px] uppercase tracking-[0.4em] font-bold text-slate-400">Systems</span>
                </div>
            </div>
        );

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isRegistering, setIsRegistering] = useState(false);
            const [error, setError] = useState('');
            const [authLoading, setAuthLoading] = useState(false);

            const [totalAllowance, setTotalAllowance] = useState(28);
            const [selectedLeaves, setSelectedLeaves] = useState([]);
            const [currentDate, setCurrentDate] = useState(new Date(2026, 0, 1));

            useEffect(() => {
                return auth.onAuthStateChanged((u) => {
                    setUser(u);
                    setLoading(false);
                });
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubscribe = db.collection('vacation_data').doc(user.uid)
                    .onSnapshot((doc) => {
                        if (doc.exists) {
                            const data = doc.data();
                            setTotalAllowance(data.totalAllowance || 28);
                            setSelectedLeaves(data.selectedLeaves || []);
                        }
                    });
                return () => unsubscribe();
            }, [user]);

            const handleAuth = async (e) => {
                e.preventDefault();
                setError('');
                setAuthLoading(true);
                try {
                    if (isRegistering) {
                        await auth.createUserWithEmailAndPassword(email, password);
                    } else {
                        await auth.signInWithEmailAndPassword(email, password);
                    }
                } catch (err) {
                    setError("Gabim: Kontrolloni të dhënat.");
                } finally {
                    setAuthLoading(false);
                }
            };

            const toggleDay = (dStr) => {
                if (!user) return;
                const isHoliday = holidays.some(h => h.date === dStr);
                const isWknd = new Date(dStr).getDay() === 0 || new Date(dStr).getDay() === 6;
                if (isHoliday || isWknd) return;

                const nextLeaves = selectedLeaves.includes(dStr)
                    ? selectedLeaves.filter(i => i !== dStr)
                    : [...selectedLeaves, dStr];
                
                setSelectedLeaves(nextLeaves);
                db.collection('vacation_data').doc(user.uid).set({
                    totalAllowance,
                    selectedLeaves: nextLeaves
                }, { merge: true });
            };

            const holidays = [
                { date: '2026-01-01', name: 'Viti i Ri' }, { date: '2026-01-02', name: 'Viti i Ri' },
                { date: '2026-03-14', name: 'Dita e Verës' }, { date: '2026-03-20', name: 'Bajrami' },
                { date: '2026-05-01', name: 'Dita e Punës' }, { date: '2026-11-28', name: 'Pavarësia' },
                { date: '2026-12-25', name: 'Krishtlindjet' }
            ];

            if (loading) return null;

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6">
                        <div className="max-w-sm w-full bg-white rounded-[2.5rem] p-10 shadow-xl border border-slate-100">
                            <div className="flex justify-center mb-8"><Logo /></div>
                            <form onSubmit={handleAuth} className="space-y-4">
                                <input type="email" placeholder="Email" className="w-full bg-slate-50 p-4 rounded-2xl outline-none font-bold" value={email} onChange={e => setEmail(e.target.value)} />
                                <input type="password" placeholder="Fjalëkalimi" className="w-full bg-slate-50 p-4 rounded-2xl outline-none font-bold" value={password} onChange={e => setPassword(e.target.value)} />
                                {error && <p className="text-red-500 text-[10px] font-black uppercase text-center">{error}</p>}
                                <button className="w-full bg-slate-900 text-white font-black py-4 rounded-2xl uppercase text-xs tracking-widest">
                                    {authLoading ? 'Pritni...' : (isRegistering ? 'Regjistrohu' : 'Hyr')}
                                </button>
                            </form>
                            <button onClick={() => setIsRegistering(!isRegistering)} className="w-full mt-6 text-[10px] font-black text-slate-400 uppercase tracking-widest text-center">
                                {isRegistering ? 'Kthehu te Hyrja' : 'Krijo Llogari'}
                            </button>
                        </div>
                    </div>
                );
            }

            const daysInMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
            const startDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1).getDay();
            const shift = startDay === 0 ? 6 : startDay - 1;

            const calendarCells = [];
            for (let i = 0; i < shift; i++) calendarCells.push(<div key={`empty-${i}`} />);
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `2026-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const isSel = selectedLeaves.includes(dateStr);
                const isHol = holidays.some(h => h.date === dateStr);
                const isWkd = new Date(dateStr).getDay() === 0 || new Date(dateStr).getDay() === 6;

                calendarCells.push(
                    <div key={d} onClick={() => toggleDay(dateStr)} className={`h-12 flex items-center justify-center rounded-xl border text-sm font-bold transition-all cursor-pointer ${isSel ? 'bg-blue-600 border-blue-600 text-white shadow-lg' : isHol ? 'bg-red-50 border-red-100 text-red-500' : isWkd ? 'bg-slate-50 border-transparent text-slate-200' : 'bg-white border-slate-100 text-slate-600 hover:border-blue-200'}`}>
                        {d}
                    </div>
                );
            }

            return (
                <div className="max-w-4xl mx-auto p-6">
                    <div className="flex justify-between items-center mb-10">
                        <Logo />
                        <button onClick={() => auth.signOut()} className="text-red-400 font-black text-[10px] uppercase tracking-widest">Dil</button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-10">
                        <div className="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm text-center">
                            <p className="text-[10px] font-black text-slate-300 uppercase mb-1 tracking-widest">Leje Vjetore</p>
                            <input type="number" value={totalAllowance} onChange={e => setTotalAllowance(e.target.value)} className="text-3xl font-black w-full text-center outline-none" />
                        </div>
                        <div className="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm text-center">
                            <p className="text-[10px] font-black text-slate-300 uppercase mb-1 tracking-widest">Zgjedhur</p>
                            <p className="text-3xl font-black text-blue-600">{selectedLeaves.length}</p>
                        </div>
                        <div className="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm text-center">
                            <p className="text-[10px] font-black text-slate-300 uppercase mb-1 tracking-widest">Mbetur</p>
                            <p className="text-3xl font-black text-emerald-500">{totalAllowance - selectedLeaves.length}</p>
                        </div>
                    </div>

                    <div className="bg-white p-8 rounded-[3rem] border border-slate-100 shadow-xl">
                        <div className="flex justify-between items-center mb-8">
                            <h2 className="text-xl font-black uppercase tracking-tighter">{new Intl.DateTimeFormat('sq-AL', {month:'long', year:'numeric'}).format(currentDate)}</h2>
                            <div className="flex gap-2">
                                <button onClick={() => setCurrentDate(new Date(2026, currentDate.getMonth()-1, 1))} className="p-2 bg-slate-50 rounded-lg">←</button>
                                <button onClick={() => setCurrentDate(new Date(2026, currentDate.getMonth()+1, 1))} className="p-2 bg-slate-50 rounded-lg">→</button>
                            </div>
                        </div>
                        <div className="calendar-grid">
                            {['H', 'M', 'M', 'E', 'P', 'S', 'D'].map(d => <div key={d} className="text-center text-[10px] font-black text-slate-300 mb-2">{d}</div>)}
                            {calendarCells}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
