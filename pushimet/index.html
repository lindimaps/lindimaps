<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINDIMAPS Systems - Menaxhimi i Lejeve</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0;
            padding: 0;
            background-color: #f8fafc;
        }
        #root { min-height: 100vh; }
        .calendar-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 0.5rem; 
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="flex items-center justify-center h-screen">
            <p class="text-slate-400 font-bold animate-pulse">Duke u ngarkuar...</p>
        </div>
    </div>

    <!-- Firebase SDKs si Modul -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Eksportojmë Firebase në dritaren globale që React (Babel) ta shohë
        window.FirebaseLib = {
            initializeApp, getAuth, signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, onAuthStateChanged, 
            signOut, getFirestore, doc, setDoc, onSnapshot
        };
    </script>

    <!-- React App -->
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const App = () => {
            const [fbLoaded, setFbLoaded] = useState(false);
            const [user, setUser] = useState(null);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isRegistering, setIsRegistering] = useState(false);
            const [error, setError] = useState('');
            const [authLoading, setAuthLoading] = useState(false);

            const [totalAllowance, setTotalAllowance] = useState(28);
            const [selectedLeaves, setSelectedLeaves] = useState([]);
            const [currentDate, setCurrentDate] = useState(new Date(2026, 0, 1));

            // Kontrollojmë nëse Firebase u ngarkua nga moduli
            useEffect(() => {
                const interval = setInterval(() => {
                    if (window.FirebaseLib) {
                        setFbLoaded(true);
                        clearInterval(interval);
                    }
                }, 100);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                if (!fbLoaded) return;
                const { getAuth, onAuthStateChanged, initializeApp, getFirestore } = window.FirebaseLib;
                
                // Konfigurimi automatik nga mjedisi
                const config = JSON.parse(window.__firebase_config || '{}');
                const app = initializeApp(config);
                const auth = getAuth(app);
                const db = getFirestore(app);
                const appId = window.__app_id || 'default-id';

                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                });

                return () => unsubscribe();
            }, [fbLoaded]);

            // Funksionet e Autentifikimit
            const handleAuth = async (e) => {
                e.preventDefault();
                if (!window.FirebaseLib) return;
                const { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, initializeApp } = window.FirebaseLib;
                const config = JSON.parse(window.__firebase_config || '{}');
                const auth = getAuth(initializeApp(config));

                setError('');
                setAuthLoading(true);

                try {
                    if (isRegistering) {
                        await createUserWithEmailAndPassword(auth, email, password);
                    } else {
                        await signInWithEmailAndPassword(auth, email, password);
                    }
                } catch (err) {
                    console.error(err);
                    setError(err.code.split('/')[1].replace(/-/g, ' ').toUpperCase());
                } finally {
                    setAuthLoading(false);
                }
            };

            const handleLogout = () => {
                const { getAuth, signOut, initializeApp } = window.FirebaseLib;
                const auth = getAuth(initializeApp(JSON.parse(window.__firebase_config)));
                signOut(auth);
            };

            if (!fbLoaded) return (
                <div className="h-screen flex items-center justify-center">
                    <div className="text-center">
                        <div className="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                        <p className="text-slate-400 font-bold uppercase text-[10px] tracking-widest">Duke lidhur Firebase...</p>
                    </div>
                </div>
            );

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="max-w-md w-full bg-white rounded-[2.5rem] p-10 shadow-2xl border border-slate-100 text-center">
                            <h1 className="text-2xl font-black mb-8 text-slate-900">LINDI<span className="text-blue-600">MAPS</span></h1>
                            <form onSubmit={handleAuth} className="space-y-4 text-left">
                                <div className="space-y-1">
                                    <label className="text-[10px] font-bold text-slate-400 uppercase ml-2">Email</label>
                                    <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-slate-50 border-none rounded-xl p-4 font-bold outline-none focus:ring-2 focus:ring-blue-100" />
                                </div>
                                <div className="space-y-1">
                                    <label className="text-[10px] font-bold text-slate-400 uppercase ml-2">Fjalëkalimi</label>
                                    <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-slate-50 border-none rounded-xl p-4 font-bold outline-none focus:ring-2 focus:ring-blue-100" />
                                </div>
                                {error && <div className="bg-red-50 p-3 rounded-lg border border-red-100 text-red-500 text-[10px] font-black text-center uppercase">{error}</div>}
                                <button type="submit" disabled={authLoading} className="w-full bg-slate-900 text-white font-black py-4 rounded-xl uppercase text-xs tracking-widest hover:bg-blue-600 transition-all shadow-lg">
                                    {authLoading ? 'Pritni...' : (isRegistering ? 'Krijo Llogari' : 'Hyr')}
                                </button>
                            </form>
                            <button onClick={() => { setIsRegistering(!isRegistering); setError(''); }} className="mt-6 text-[10px] font-black text-slate-400 uppercase tracking-widest hover:text-blue-600 transition-colors">
                                {isRegistering ? 'Ke llogari? Hyr këtu' : 'Nuk ke llogari? Regjistrohu'}
                            </button>
                        </div>
                    </div>
                );
            }

            // Interface i Aplikacionit (Pasi je futur)
            return (
                <div className="max-w-4xl mx-auto p-4 md:p-10">
                    <div className="flex justify-between items-center mb-10">
                        <h1 className="text-xl font-black">LINDI<span className="text-blue-600">MAPS</span></h1>
                        <button onClick={handleLogout} className="text-red-400 font-bold text-[10px] uppercase border border-red-100 px-4 py-2 rounded-lg hover:bg-red-50">Dil</button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                        <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm text-center">
                            <p className="text-[10px] font-black text-slate-300 uppercase mb-2">Ditë Vjetore</p>
                            <p className="text-3xl font-black text-slate-900">{totalAllowance}</p>
                        </div>
                        <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm text-center">
                            <p className="text-[10px] font-black text-slate-300 uppercase mb-2">Konsumuar</p>
                            <p className="text-3xl font-black text-blue-600">{selectedLeaves.length}</p>
                        </div>
                        <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm text-center">
                            <p className="text-[10px] font-black text-slate-300 uppercase mb-2">Mbetur</p>
                            <p className="text-3xl font-black text-emerald-500">{totalAllowance - selectedLeaves.length}</p>
                        </div>
                    </div>

                    <div className="bg-white p-8 rounded-[3rem] border border-slate-100 shadow-xl">
                         <div className="text-center mb-8">
                            <h2 className="text-xl font-black uppercase tracking-widest">Sistemi i Lejeve 2026</h2>
                            <p className="text-slate-400 text-xs mt-2 italic">Klikoni mbi datat për të zgjedhur pushimin</p>
                         </div>
                         <p className="text-center text-slate-300 font-bold py-10 border-2 border-dashed border-slate-50 rounded-2xl">
                            Kalendari po ngarkohet...
                         </p>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
