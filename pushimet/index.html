<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINDIMAPS Systems - Menaxhimi i Lejeve</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
            -webkit-tap-highlight-color: transparent;
        }

        .logo-gradient {
            background: linear-gradient(to right, #3b82f6, #2dd4bf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes pulse-dot {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .animate-dot {
            animation: pulse-dot 2s infinite ease-in-out;
            transform-origin: center;
        }

        .logo-bg { transition: background-color 0.3s ease; }
        .logo-container:hover .logo-bg { background-color: #2563eb; }

        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }

        @media (max-width: 640px) {
            .calendar-grid { gap: 4px; }
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="flex items-center justify-center h-screen text-slate-400 font-bold animate-pulse uppercase tracking-[0.3em] text-[10px]">
            Duke hapur LINDIMAPS Systems...
        </div>
    </div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyDe_lLPQIhfJZaCZ0dZqRlLH0-kfyfy8Sw",
            authDomain: "pushimet.firebaseapp.com",
            projectId: "pushimet",
            storageBucket: "pushimet.firebasestorage.app",
            messagingSenderId: "1024807492402",
            appId: "1:1024807492402:web:7ccaa6f39947bc41d5952b",
            measurementId: "G-Q0K9EWJ824"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        const { useState, useEffect, useMemo } = React;

        const Logo = ({ size = "normal" }) => (
            <div className={`flex items-center gap-3 group logo-container ${size === 'large' ? 'mb-10' : ''}`}>
                <div className={`logo-bg flex items-center justify-center bg-slate-900 rounded-xl shadow-lg ${size === 'large' ? 'h-14 w-14' : 'h-10 w-10'}`}>
                    <svg width={size === 'large' ? "32" : "24"} height={size === 'large' ? "32" : "24"} viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z" fill="white" fill-opacity="0.15"/>
                        <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                        <circle className="animate-dot" cx="12" cy="11" r="2.5" fill="#3b82f6" stroke="white" stroke-width="1.2"/>
                    </svg>
                </div>
                <div className="flex flex-col text-left">
                    <h1 className={`${size === 'large' ? 'text-3xl' : 'text-xl'} font-black tracking-tighter leading-none`}>
                        <span className="text-slate-900">LINDI</span><span className="logo-gradient">MAPS</span>
                    </h1>
                    <span className="text-[8px] uppercase tracking-[0.4em] font-bold text-slate-400 mt-1">Systems</span>
                </div>
            </div>
        );

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isRegistering, setIsRegistering] = useState(false);
            const [error, setError] = useState('');
            const [authLoading, setAuthLoading] = useState(false);
            const [activeTab, setActiveTab] = useState('selected');

            const [carryOver2025, setCarryOver2025] = useState(0);
            const [allowance2026, setAllowance2026] = useState(28);
            const [selectedLeaves, setSelectedLeaves] = useState([]);
            const [currentDate, setCurrentDate] = useState(new Date(2026, 0, 1));

            const holidays2026 = useMemo(() => ({
                '2026-01-01': 'Viti i Ri', '2026-01-02': 'Viti i Ri',
                '2026-03-14': 'Dita e Verës', '2026-03-16': 'Pushim (Verës)',
                '2026-03-20': 'Bajrami i Madh', '2026-03-22': 'Dita e Nevruzit',
                '2026-03-23': 'Pushim (Nevruzit)', '2026-04-05': 'Pashkët Katolike',
                '2026-04-06': 'Pushim (Katolike)', '2026-04-12': 'Pashkët Ortodokse',
                '2026-04-13': 'Pushim (Ortodokse)', '2026-05-01': 'Dita e Punës',
                '2026-05-27': 'Kurban Bajrami', '2026-09-05': 'Nënë Tereza',
                '2026-09-07': 'Pushim (Nënë Tereza)', '2026-11-22': 'Dita e Alfabetit',
                '2026-11-23': 'Pushim (Alfabetit)', '2026-11-28': 'Pavarësia',
                '2026-11-29': 'Çlirimi', '2026-11-30': 'Pushim (Pavarësia)',
                '2026-12-01': 'Pushim (Çlirimi)', '2026-12-08': 'Dita Kombëtare e Rinisë',
                '2026-12-25': 'Krishtlindjet'
            }), []);

            useEffect(() => {
                return auth.onAuthStateChanged((u) => {
                    setUser(u);
                    setLoading(false);
                });
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubscribe = db.collection('user_leaves').doc(user.uid)
                    .onSnapshot((doc) => {
                        if (doc.exists) {
                            const data = doc.data();
                            setCarryOver2025(data.carryOver2025 || 0);
                            setAllowance2026(data.allowance2026 || 28);
                            setSelectedLeaves(data.selectedLeaves || []);
                        }
                    });
                return () => unsubscribe();
            }, [user]);

            const handleAuth = async (e) => {
                e.preventDefault();
                setError('');
                setAuthLoading(true);
                try {
                    if (isRegistering) {
                        await auth.createUserWithEmailAndPassword(email, password);
                    } else {
                        await auth.signInWithEmailAndPassword(email, password);
                    }
                } catch (err) {
                    setError("Gabim në autentifikim.");
                } finally {
                    setAuthLoading(false);
                }
            };

            const saveData = (carry, allowance, leaves) => {
                if (!user) return;
                db.collection('user_leaves').doc(user.uid).set({
                    carryOver2025: Number(carry),
                    allowance2026: Number(allowance),
                    selectedLeaves: leaves,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
            };

            const toggleDay = (dStr) => {
                const isHol = holidays2026[dStr];
                const dayObj = new Date(dStr);
                const isWkd = dayObj.getDay() === 0 || dayObj.getDay() === 6;
                if (isHol || isWkd) return;

                const next = selectedLeaves.includes(dStr)
                    ? selectedLeaves.filter(i => i !== dStr)
                    : [...selectedLeaves, dStr].sort();
                
                setSelectedLeaves(next);
                saveData(carryOver2025, allowance2026, next);
            };

            if (loading) return null;

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-white">
                        <div className="max-w-md w-full text-center">
                            <div className="flex justify-center mb-8"><Logo size="large" /></div>
                            <div className="bg-white rounded-[2.5rem] p-10 shadow-2xl border border-slate-100">
                                <h2 className="text-xl font-black mb-6 uppercase tracking-widest text-slate-800">
                                    {isRegistering ? 'Regjistrohu' : 'Hyrje në Sistem'}
                                </h2>
                                <form onSubmit={handleAuth} className="space-y-4">
                                    <input type="email" placeholder="Email" className="w-full bg-slate-50 border-none rounded-2xl p-4 outline-none font-bold text-slate-700" value={email} onChange={e => setEmail(e.target.value)} />
                                    <input type="password" placeholder="Fjalëkalimi" className="w-full bg-slate-50 border-none rounded-2xl p-4 outline-none font-bold text-slate-700" value={password} onChange={e => setPassword(e.target.value)} />
                                    {error && <div className="text-red-500 text-[10px] font-black uppercase py-2">{error}</div>}
                                    <button type="submit" disabled={authLoading} className="w-full bg-slate-900 text-white font-black py-5 rounded-2xl hover:bg-blue-600 transition-all uppercase text-xs tracking-[0.2em] shadow-xl">
                                        {authLoading ? 'Pritni...' : (isRegistering ? 'Regjistrohu' : 'Hyr')}
                                    </button>
                                </form>
                                <button onClick={() => setIsRegistering(!isRegistering)} className="mt-8 text-[10px] font-black text-slate-400 uppercase tracking-widest hover:text-blue-600 transition-colors">
                                    {isRegistering ? 'Shko te Hyrja' : 'Krijo Llogari'}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // Kalkulimet e mbetjeve per secilin vit
            const usedTotal = selectedLeaves.length;
            const remainingFrom2025 = Math.max(0, carryOver2025 - usedTotal);
            const usedFrom2026 = Math.max(0, usedTotal - carryOver2025);
            const remainingFrom2026 = Math.max(0, allowance2026 - usedFrom2026);
            const totalRemaining = remainingFrom2025 + remainingFrom2026;

            const month = currentDate.getMonth();
            const year = currentDate.getFullYear();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDay = new Date(year, month, 1).getDay();
            const shift = firstDay === 0 ? 6 : firstDay - 1;

            const cells = [];
            for (let i = 0; i < shift; i++) cells.push(<div key={`b-${i}`} />);
            for (let d = 1; d <= daysInMonth; d++) {
                const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const holName = holidays2026[dStr];
                const isSel = selectedLeaves.includes(dStr);
                const isWkd = new Date(dStr).getDay() === 0 || new Date(dStr).getDay() === 6;

                cells.push(
                    <div 
                        key={d} 
                        onClick={() => toggleDay(dStr)} 
                        className={`group relative h-12 md:h-16 rounded-2xl border flex flex-col items-center justify-center cursor-pointer transition-all active:scale-90
                        ${holName ? 'bg-red-50 border-red-100 text-red-600 font-bold' : 
                          isWkd ? 'bg-slate-50 border-transparent text-slate-200' : 
                          isSel ? 'bg-blue-600 border-blue-600 text-white shadow-lg' : 
                          'bg-white border-slate-100 text-slate-600 hover:border-blue-200 shadow-sm'}`}
                    >
                        <span className="text-sm font-black">{d}</span>
                        {holName && <span className="absolute bottom-1 px-1 text-[5px] text-center font-bold leading-tight uppercase truncate w-full">{holName}</span>}
                    </div>
                );
            }

            return (
                <div className="min-h-screen p-4 md:p-10 max-w-6xl mx-auto space-y-6">
                    {/* Header */}
                    <div className="flex justify-between items-center bg-white p-4 rounded-3xl border border-slate-100 shadow-sm">
                        <Logo />
                        <div className="flex items-center gap-4">
                            <div className="text-right hidden sm:block">
                                <p className="text-[8px] font-black text-slate-300 uppercase tracking-widest leading-none mb-1">Llogaria Aktive</p>
                                <p className="text-xs font-bold text-slate-600">{user.email}</p>
                            </div>
                            <button onClick={() => auth.signOut()} className="p-3 bg-white rounded-2xl border border-slate-100 text-red-400 shadow-sm hover:bg-red-50 transition-all">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                            </button>
                        </div>
                    </div>

                    {/* Dashboard i Detajuar */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        {/* Blloku 2025 */}
                        <div className="bg-white p-5 rounded-[2.5rem] border border-slate-100 shadow-sm">
                            <p className="text-[9px] font-black text-slate-300 uppercase tracking-widest mb-3 text-center">Buxheti 2025 (Mbartur)</p>
                            <div className="flex flex-col gap-2">
                                <div className="flex items-center justify-between px-4 py-2 bg-blue-50/50 rounded-xl">
                                    <span className="text-[10px] font-bold text-slate-400 uppercase">Totali:</span>
                                    <input 
                                        type="number" 
                                        value={carryOver2025} 
                                        onChange={(e) => {setCarryOver2025(e.target.value); saveData(e.target.value, allowance2026, selectedLeaves);}} 
                                        className="text-lg font-black w-12 text-right outline-none bg-transparent text-blue-600" 
                                    />
                                </div>
                                <div className="flex items-center justify-between px-4 py-2">
                                    <span className="text-[10px] font-bold text-slate-400 uppercase">Mbetur:</span>
                                    <span className="text-lg font-black text-slate-800">{remainingFrom2025}</span>
                                </div>
                            </div>
                        </div>

                        {/* Blloku 2026 */}
                        <div className="bg-white p-5 rounded-[2.5rem] border border-slate-100 shadow-sm">
                            <p className="text-[9px] font-black text-slate-300 uppercase tracking-widest mb-3 text-center">Buxheti 2026 (Aktual)</p>
                            <div className="flex flex-col gap-2">
                                <div className="flex items-center justify-between px-4 py-2 bg-slate-50 rounded-xl">
                                    <span className="text-[10px] font-bold text-slate-400 uppercase">Totali:</span>
                                    <input 
                                        type="number" 
                                        value={allowance2026} 
                                        onChange={(e) => {setAllowance2026(e.target.value); saveData(carryOver2025, e.target.value, selectedLeaves);}} 
                                        className="text-lg font-black w-12 text-right outline-none bg-transparent text-slate-900" 
                                    />
                                </div>
                                <div className="flex items-center justify-between px-4 py-2">
                                    <span className="text-[10px] font-bold text-slate-400 uppercase">Mbetur:</span>
                                    <span className="text-lg font-black text-slate-800">{remainingFrom2026}</span>
                                </div>
                            </div>
                        </div>

                        {/* Konsumi Total */}
                        <div className="bg-slate-900 p-5 rounded-[2.5rem] shadow-xl flex flex-col justify-center items-center text-center">
                            <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Përzgjedhur Gjithsej</p>
                            <p className="text-4xl font-black text-white">{usedTotal}</p>
                            <p className="text-[8px] font-bold text-slate-500 mt-2 uppercase">Ditë të regjistruara</p>
                        </div>

                        {/* Mbetja Totale */}
                        <div className="bg-emerald-50 p-5 rounded-[2.5rem] border border-emerald-100 shadow-sm flex flex-col justify-center items-center text-center">
                            <p className="text-[9px] font-black text-emerald-800/40 uppercase tracking-widest mb-1">Mbetja Totale</p>
                            <p className={`text-4xl font-black ${totalRemaining < 0 ? 'text-red-500' : 'text-emerald-600'}`}>{totalRemaining}</p>
                            <div className="mt-2 px-3 py-1 bg-white rounded-full text-[8px] font-black text-emerald-500 uppercase tracking-tighter shadow-sm">
                                2025 + 2026
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        {/* Kalendari */}
                        <div className="lg:col-span-2 bg-white p-8 rounded-[3.5rem] border border-slate-100 shadow-xl">
                            <div className="flex items-center justify-between mb-8">
                                <h2 className="text-lg font-black uppercase tracking-tighter text-slate-900">
                                    {new Intl.DateTimeFormat('sq-AL', { month: 'long', year: 'numeric' }).format(currentDate)}
                                </h2>
                                <div className="flex bg-slate-50 p-1 rounded-2xl">
                                    <button onClick={() => setCurrentDate(new Date(year, month - 1, 1))} className="p-3 hover:bg-white rounded-xl transition-all shadow-sm">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="m15 18-6-6 6-6"/></svg>
                                    </button>
                                    <button onClick={() => setCurrentDate(new Date(year, month + 1, 1))} className="p-3 hover:bg-white rounded-xl transition-all shadow-sm">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="m9 18 6-6-6-6"/></svg>
                                    </button>
                                </div>
                            </div>
                            <div className="calendar-grid">
                                {['Hën', 'Mar', 'Mër', 'Enj', 'Pre', 'Sht', 'Die'].map(d => <div key={d} className="text-center text-[10px] font-black text-slate-300 mb-4">{d}</div>)}
                                {cells}
                            </div>
                        </div>

                        {/* Paneli me Tab-e */}
                        <div className="bg-white p-6 rounded-[3.5rem] border border-slate-100 shadow-xl flex flex-col h-[520px]">
                            <div className="flex p-1 bg-slate-100 rounded-2xl mb-6">
                                <button onClick={() => setActiveTab('selected')} className={`flex-1 py-3 text-[9px] font-black uppercase tracking-widest rounded-xl transition-all ${activeTab === 'selected' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-400'}`}>Lejet e Mia</button>
                                <button onClick={() => setActiveTab('holidays')} className={`flex-1 py-3 text-[9px] font-black uppercase tracking-widest rounded-xl transition-all ${activeTab === 'holidays' ? 'bg-white text-red-600 shadow-sm' : 'text-slate-400'}`}>Festa 2026</button>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto no-scrollbar">
                                {activeTab === 'selected' ? (
                                    <div className="space-y-2">
                                        {selectedLeaves.length === 0 ? (
                                            <div className="h-40 flex flex-col items-center justify-center text-slate-300 text-center opacity-40">
                                                <p className="text-[9px] font-bold uppercase tracking-widest">Nuk ka përzgjedhje</p>
                                            </div>
                                        ) : (
                                            selectedLeaves.map((date, index) => {
                                                const d = new Date(date);
                                                const isFromCarry = index < carryOver2025;
                                                return (
                                                    <div key={date} className={`flex items-center justify-between p-3 rounded-2xl transition-all group ${isFromCarry ? 'bg-blue-50/50 border border-blue-100' : 'bg-slate-50'}`}>
                                                        <div className="flex flex-col">
                                                            <span className="text-xs font-black text-slate-700">{d.getDate()} {new Intl.DateTimeFormat('sq-AL', { month: 'short' }).format(d)} {d.getFullYear()}</span>
                                                            <span className={`text-[8px] font-bold uppercase tracking-tighter ${isFromCarry ? 'text-blue-400' : 'text-slate-400'}`}>
                                                                {isFromCarry ? 'Konsum nga Mbartja 2025' : 'Konsum nga Leja 2026'}
                                                            </span>
                                                        </div>
                                                        <button onClick={() => toggleDay(date)} className="p-2 text-slate-300 group-hover:text-red-500 transition-colors">
                                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M18 6L6 18M6 6l12 12"/></svg>
                                                        </button>
                                                    </div>
                                                );
                                            })
                                        )}
                                    </div>
                                ) : (
                                    <div className="space-y-2">
                                        {Object.entries(holidays2026).map(([date, name]) => (
                                            <div key={date} className="flex items-center gap-3 p-3 bg-red-50/30 rounded-2xl border border-red-50">
                                                <div className="h-8 w-8 bg-white rounded-lg flex items-center justify-center text-red-600 text-[10px] font-black border border-red-100">{new Date(date).getDate()}</div>
                                                <div className="flex flex-col shrink-0 overflow-hidden">
                                                    <span className="text-[9px] font-black text-red-800 uppercase tracking-tight truncate w-32">{name}</span>
                                                    <span className="text-[8px] font-bold text-red-400 uppercase">{new Intl.DateTimeFormat('sq-AL', { month: 'long' }).format(new Date(date))}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    <footer className="text-center pt-8 border-t border-slate-100 pb-10">
                        <p className="text-[8px] font-black text-slate-300 uppercase tracking-[0.5em]">LINDIMAPS Systems &copy; 2026</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
