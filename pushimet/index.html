<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINDIMAPS Systems - Menaxhimi i Lejeve</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
            -webkit-tap-highlight-color: transparent;
        }

        .logo-gradient {
            background: linear-gradient(to right, #3b82f6, #2dd4bf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes pulse-dot {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .animate-dot {
            animation: pulse-dot 2s infinite ease-in-out;
            transform-origin: center;
        }

        .logo-bg { transition: background-color 0.3s ease; }
        .logo-container:hover .logo-bg { background-color: #2563eb; }

        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }

        @media (max-width: 640px) {
            .calendar-grid { gap: 4px; }
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="flex items-center justify-center h-screen text-slate-400 font-bold animate-pulse uppercase tracking-[0.3em] text-[10px]">
            Duke hapur LINDIMAPS Systems...
        </div>
    </div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyDe_lLPQIhfJZaCZ0dZqRlLH0-kfyfy8Sw",
            authDomain: "pushimet.firebaseapp.com",
            projectId: "pushimet",
            storageBucket: "pushimet.firebasestorage.app",
            messagingSenderId: "1024807492402",
            appId: "1:1024807492402:web:7ccaa6f39947bc41d5952b"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        const { useState, useEffect, useMemo } = React;

        const getAlbanianHolidays = (year) => {
            const fixed = {
                [`${year}-01-01`]: 'Viti i Ri', [`${year}-01-02`]: 'Viti i Ri',
                [`${year}-03-14`]: 'Dita e Verës', [`${year}-03-22`]: 'Dita e Nevruzit',
                [`${year}-05-01`]: 'Dita e Punës', [`${year}-09-05`]: 'Nënë Tereza',
                [`${year}-11-22`]: 'Dita e Alfabetit', [`${year}-11-28`]: 'Pavarësia',
                [`${year}-11-29`]: 'Çlirimi', [`${year}-12-08`]: 'Dita e Rinisë',
                [`${year}-12-25`]: 'Krishtlindjet'
            };
            const movable = {
                '2025-03-31': 'Bajrami Madh', '2025-04-20': 'Pashket Katolike', '2025-06-07': 'Kurban Bajrami',
                '2026-03-20': 'Bajrami Madh', '2026-04-05': 'Pashket Katolike', '2026-04-12': 'Pashket Ortodokse', '2026-05-27': 'Kurban Bajrami',
                '2027-03-09': 'Bajrami Madh', '2027-03-28': 'Pashket Katolike', '2027-05-02': 'Pashket Ortodokse', '2027-05-16': 'Kurban Bajrami'
            };
            return { ...fixed, ...movable };
        };

        const Logo = ({ size = "normal" }) => (
            <div className={`flex items-center gap-3 group logo-container ${size === 'large' ? 'mb-10' : ''}`}>
                <div className={`logo-bg flex items-center justify-center bg-slate-900 rounded-xl shadow-lg ${size === 'large' ? 'h-14 w-14' : 'h-10 w-10'}`}>
                    <svg width={size === 'large' ? "32" : "24"} height={size === 'large' ? "32" : "24"} viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z" fill="white" fill-opacity="0.15"/>
                        <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                        <circle className="animate-dot" cx="12" cy="11" r="2.5" fill="#3b82f6" stroke="white" stroke-width="1.2"/>
                    </svg>
                </div>
                <div className="flex flex-col text-left">
                    <h1 className={`${size === 'large' ? 'text-3xl' : 'text-xl'} font-black tracking-tighter leading-none`}>
                        <span className="text-slate-900">LINDI</span><span className="logo-gradient">MAPS</span>
                    </h1>
                    <span className="text-[8px] uppercase tracking-[0.4em] font-bold text-slate-400 mt-1">Systems</span>
                </div>
            </div>
        );

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isRegistering, setIsRegistering] = useState(false);
            const [error, setError] = useState('');
            const [authLoading, setAuthLoading] = useState(false);
            const [activeTab, setActiveTab] = useState('selected');

            const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());
            const [currentDate, setCurrentDate] = useState(new Date(selectedYear, new Date().getMonth(), 1));
            
            const [yearData, setYearData] = useState({ allowance: 28, selected: [] });
            const [prevYearRemaining, setPrevYearRemaining] = useState(0);

            useEffect(() => {
                return auth.onAuthStateChanged((u) => {
                    setUser(u);
                    setLoading(false);
                });
            }, []);

            useEffect(() => {
                if (!user) return;
                
                const unsubCurrent = db.collection('users').doc(user.uid).collection('years').doc(String(selectedYear))
                    .onSnapshot(doc => {
                        if (doc.exists) setYearData(doc.data());
                        else setYearData({ allowance: 28, selected: [] });
                    });

                const unsubPrev = db.collection('users').doc(user.uid).collection('years').doc(String(selectedYear - 1))
                    .onSnapshot(doc => {
                        if (doc.exists) {
                            const d = doc.data();
                            const totalPrev = Number(d.allowance || 28);
                            const usedPrev = d.selected?.length || 0;
                            setPrevYearRemaining(Math.max(0, totalPrev - usedPrev));
                        } else {
                            setPrevYearRemaining(0);
                        }
                    });

                return () => { unsubCurrent(); unsubPrev(); };
            }, [user, selectedYear]);

            const handleAuth = async (e) => {
                e.preventDefault();
                setError('');
                setAuthLoading(true);
                try {
                    if (isRegistering) {
                        await auth.createUserWithEmailAndPassword(email, password);
                    } else {
                        await auth.signInWithEmailAndPassword(email, password);
                    }
                } catch (err) {
                    setError("Të dhënat janë të pasakta.");
                } finally {
                    setAuthLoading(false);
                }
            };

            const updateFirebase = (newData) => {
                if (!user) return;
                db.collection('users').doc(user.uid).collection('years').doc(String(selectedYear)).set(newData, { merge: true });
            };

            const toggleDay = (dStr) => {
                const holidays = getAlbanianHolidays(selectedYear);
                const isWkd = [0, 6].includes(new Date(dStr).getDay());
                if (holidays[dStr] || isWkd) return;

                const next = yearData.selected.includes(dStr)
                    ? yearData.selected.filter(i => i !== dStr)
                    : [...yearData.selected, dStr].sort();
                
                updateFirebase({ ...yearData, selected: next });
            };

            if (loading) return null;

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-white">
                        <div className="max-w-md w-full text-center">
                            <div className="flex justify-center mb-8"><Logo size="large" /></div>
                            <div className="bg-white rounded-[2.5rem] p-10 shadow-2xl border border-slate-100">
                                <h2 className="text-xl font-black mb-6 uppercase tracking-widest text-slate-800">
                                    {isRegistering ? 'Regjistrohu' : 'LINDIMAPS Login'}
                                </h2>
                                <form onSubmit={handleAuth} className="space-y-4">
                                    <input type="email" placeholder="Email" className="w-full bg-slate-50 border-none rounded-2xl p-4 outline-none font-bold text-slate-700" value={email} onChange={e => setEmail(e.target.value)} />
                                    <input type="password" placeholder="Fjalëkalimi" className="w-full bg-slate-50 border-none rounded-2xl p-4 outline-none font-bold text-slate-700" value={password} onChange={e => setPassword(e.target.value)} />
                                    {error && <div className="text-red-500 text-[10px] font-black uppercase py-2">{error}</div>}
                                    <button type="submit" disabled={authLoading} className="w-full bg-slate-900 text-white font-black py-5 rounded-2xl hover:bg-blue-600 transition-all uppercase text-xs tracking-[0.2em] shadow-xl">
                                        {authLoading ? 'Pritni...' : (isRegistering ? 'Krijo Llogari' : 'Hyr')}
                                    </button>
                                </form>
                                <button onClick={() => setIsRegistering(!isRegistering)} className="mt-8 text-[10px] font-black text-slate-400 uppercase tracking-widest hover:text-blue-600 transition-colors">
                                    {isRegistering ? 'Shko te Hyrja' : 'Regjistrim i Ri'}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            const totalCombined = Number(yearData.allowance) + Number(prevYearRemaining);
            const remaining = totalCombined - yearData.selected.length;

            return (
                <div className="min-h-screen p-4 md:p-10 max-w-6xl mx-auto space-y-6">
                    {/* Header me Emailin e Llogarise */}
                    <div className="flex flex-wrap justify-between items-center bg-white p-4 rounded-3xl border border-slate-100 shadow-sm gap-4">
                        <Logo />
                        <div className="flex items-center bg-slate-100 p-1 rounded-2xl">
                            {[selectedYear-1, selectedYear, selectedYear+1].map(y => (
                                <button key={y} onClick={() => {setSelectedYear(y); setCurrentDate(new Date(y, 0, 1));}} 
                                    className={`px-4 py-2 rounded-xl text-[10px] font-black transition-all ${selectedYear === y ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-400 uppercase'}`}>
                                    {y}
                                </button>
                            ))}
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="text-right hidden sm:block">
                                <p className="text-[8px] font-black text-slate-300 uppercase tracking-widest leading-none mb-1">Llogaria aktive</p>
                                <p className="text-[10px] font-bold text-slate-600 truncate max-w-[150px]">{user.email}</p>
                            </div>
                            <button onClick={() => auth.signOut()} className="p-3 bg-white rounded-2xl border border-slate-100 text-red-400 shadow-sm hover:bg-red-50 transition-all">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                            </button>
                        </div>
                    </div>

                    {/* Dashboard */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div className="bg-white p-5 rounded-[2.5rem] border border-slate-100 shadow-sm text-center">
                            <p className="text-[9px] font-black text-slate-300 uppercase tracking-widest mb-2">Mbartur nga {selectedYear-1}</p>
                            <p className="text-2xl font-black text-blue-500">{prevYearRemaining}</p>
                        </div>
                        <div className="bg-white p-5 rounded-[2.5rem] border border-slate-100 shadow-sm text-center">
                            <p className="text-[9px] font-black text-slate-300 uppercase tracking-widest mb-2">Leja {selectedYear}</p>
                            <input 
                                type="number" 
                                value={yearData.allowance} 
                                onChange={(e) => updateFirebase({...yearData, allowance: e.target.value})} 
                                className="text-2xl font-black w-full text-center outline-none bg-slate-50 rounded-xl py-1" 
                            />
                        </div>
                        <div className="bg-slate-900 p-5 rounded-[2.5rem] shadow-xl text-center">
                            <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-2">Shfrytëzuar</p>
                            <p className="text-2xl font-black text-white">{yearData.selected.length}</p>
                        </div>
                        <div className="bg-emerald-50 p-5 rounded-[2.5rem] border border-emerald-100 shadow-sm text-center">
                            <p className="text-[9px] font-black text-emerald-800/40 uppercase tracking-widest mb-2">Mbetja {selectedYear}</p>
                            <p className={`text-2xl font-black ${remaining < 0 ? 'text-red-500' : 'text-emerald-600'}`}>{remaining}</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        {/* Kalendari */}
                        <div className="lg:col-span-2 bg-white p-8 rounded-[3.5rem] border border-slate-100 shadow-xl">
                            <div className="flex items-center justify-between mb-8">
                                <h2 className="text-lg font-black uppercase tracking-tighter text-slate-900">
                                    {new Intl.DateTimeFormat('sq-AL', { month: 'long', year: 'numeric' }).format(currentDate)}
                                </h2>
                                <div className="flex bg-slate-50 p-1 rounded-2xl">
                                    <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1))} className="p-3 hover:bg-white rounded-xl transition-all shadow-sm">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="m15 18-6-6 6-6"/></svg>
                                    </button>
                                    <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1))} className="p-3 hover:bg-white rounded-xl transition-all shadow-sm">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="m9 18 6-6-6-6"/></svg>
                                    </button>
                                </div>
                            </div>
                            <div className="calendar-grid">
                                {['Hën', 'Mar', 'Mër', 'Enj', 'Pre', 'Sht', 'Die'].map(d => <div key={d} className="text-center text-[10px] font-black text-slate-300 mb-4">{d}</div>)}
                                {(() => {
                                    const cells = [];
                                    const year = currentDate.getFullYear();
                                    const month = currentDate.getMonth();
                                    const dInM = new Date(year, month + 1, 0).getDate();
                                    const first = new Date(year, month, 1).getDay();
                                    const shift = first === 0 ? 6 : first - 1;
                                    const holidays = getAlbanianHolidays(selectedYear);

                                    for (let i = 0; i < shift; i++) cells.push(<div key={`b-${i}`} />);
                                    for (let d = 1; d <= dInM; d++) {
                                        const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                                        const isHol = holidays[dStr];
                                        const isSel = yearData.selected.includes(dStr);
                                        const isWkd = [0, 6].includes(new Date(dStr).getDay());

                                        cells.push(
                                            <div key={d} onClick={() => toggleDay(dStr)} 
                                                className={`h-12 md:h-16 rounded-2xl border flex flex-col items-center justify-center cursor-pointer transition-all active:scale-90
                                                ${isHol ? 'bg-red-50 text-red-500 font-bold border-red-100' : 
                                                  isWkd ? 'bg-slate-50 text-slate-200 border-transparent' : 
                                                  isSel ? 'bg-blue-600 text-white shadow-lg border-blue-600' : 
                                                  'bg-white border-slate-100 text-slate-600 hover:border-blue-200 shadow-sm'}`}>
                                                <span className="text-sm font-black">{d}</span>
                                                {isHol && <span className="text-[5px] uppercase truncate w-full px-1 text-center font-bold">{isHol}</span>}
                                            </div>
                                        );
                                    }
                                    return cells;
                                })()}
                            </div>
                        </div>

                        {/* Listat */}
                        <div className="bg-white p-6 rounded-[3.5rem] border border-slate-100 shadow-xl flex flex-col h-[520px]">
                            <div className="flex p-1 bg-slate-100 rounded-2xl mb-6">
                                <button onClick={() => setActiveTab('selected')} className={`flex-1 py-3 text-[9px] font-black uppercase rounded-xl transition-all ${activeTab === 'selected' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-400'}`}>Shfrytëzuar</button>
                                <button onClick={() => setActiveTab('holidays')} className={`flex-1 py-3 text-[9px] font-black uppercase rounded-xl transition-all ${activeTab === 'holidays' ? 'bg-white text-red-600 shadow-sm' : 'text-slate-400'}`}>Festa {selectedYear}</button>
                            </div>
                            <div className="flex-1 overflow-y-auto no-scrollbar space-y-2">
                                {activeTab === 'selected' ? (
                                    yearData.selected.length > 0 ? yearData.selected.map((date, idx) => {
                                        const isFromCarry = idx < prevYearRemaining;
                                        return (
                                            <div key={date} className={`flex justify-between items-center p-3 rounded-2xl ${isFromCarry ? 'bg-blue-50/50 border border-blue-100' : 'bg-slate-50'}`}>
                                                <div className="flex flex-col">
                                                    <span className="text-xs font-black text-slate-700">{date}</span>
                                                    <span className="text-[8px] font-bold uppercase text-slate-400">{isFromCarry ? 'Nga Mbartja' : `Buxheti ${selectedYear}`}</span>
                                                </div>
                                                <button onClick={() => toggleDay(date)} className="p-2 text-slate-300 hover:text-red-500"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
                                            </div>
                                        )
                                    }) : <div className="text-center py-20 text-[10px] font-black text-slate-300 uppercase opacity-40 tracking-widest">Nuk ka data</div>
                                ) : (
                                    Object.entries(getAlbanianHolidays(selectedYear)).sort().map(([d, n]) => (
                                        <div key={d} className="flex items-center gap-3 p-3 bg-red-50/30 rounded-2xl border border-red-50">
                                            <div className="h-8 w-8 bg-white border border-red-100 rounded-lg flex items-center justify-center text-red-500 text-[10px] font-black">{d.split('-')[2]}</div>
                                            <div className="flex flex-col">
                                                <span className="text-[10px] font-black text-red-800 uppercase leading-none">{n}</span>
                                                <span className="text-[8px] font-bold text-red-300 uppercase mt-1">{new Intl.DateTimeFormat('sq-AL', { month: 'long' }).format(new Date(d))}</span>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    </div>

                    <footer className="text-center pt-8 border-t border-slate-100 pb-10 text-[8px] font-black text-slate-300 uppercase tracking-[0.5em]">
                        LINDIMAPS Systems &copy; {selectedYear}
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
