<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINDIMAPS Systems - Menaxhimi i Lejeve</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.5rem; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        
        // Firebase Scripts (Imported via modules in browser)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Konfigurimi i Firebase (Plotësohet automatikisht nga mjedisi ose manualisht)
        const firebaseConfig = JSON.parse('{"apiKey": "", "authDomain": "", "projectId": "", "storageBucket": "", "messagingSenderId": "", "appId": ""}'); // Shënim: Këtu duhen vendosur të dhënat tuaja reale nëse nuk jeni në këtë sandbox
        
        // Në këtë mjedis sandbox, përdorim variablat globale
        const config = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : firebaseConfig;
        const app = initializeApp(config);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'lindimaps-systems-vacation';

        const Logo = () => (
            <div className="flex items-center gap-3 group">
                <div className="h-10 w-10 flex items-center justify-center bg-slate-900 rounded-xl shadow-lg transition-colors group-hover:bg-blue-600">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinejoin="round">
                        <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z" fill="white" fillOpacity="0.15"/>
                        <circle cx="12" cy="11" r="2.5" fill="#3b82f6" stroke="white" strokeWidth="1"/>
                    </svg>
                </div>
                <div className="flex flex-col text-left">
                    <h1 className="text-xl font-black tracking-tighter leading-none">
                        <span className="text-slate-900">LINDI</span>
                        <span className="text-blue-600">MAPS</span>
                    </h1>
                    <span className="text-[8px] uppercase tracking-[0.4em] font-bold text-slate-400">Systems</span>
                </div>
            </div>
        );

        const App = () => {
            const [user, setUser] = useState(null);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isRegistering, setIsRegistering] = useState(false);
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(true);
            const [authLoading, setAuthLoading] = useState(false);

            const [totalAllowance, setTotalAllowance] = useState(28);
            const [selectedLeaves, setSelectedLeaves] = useState([]);
            const [currentDate, setCurrentDate] = useState(new Date(2026, 0, 1));

            useEffect(() => {
                return onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    setLoading(false);
                });
            }, []);

            useEffect(() => {
                if (!user) return;
                const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'data', 'vacation_data');
                return onSnapshot(docRef, (snap) => {
                    if (snap.exists()) {
                        const d = snap.data();
                        setTotalAllowance(d.totalAllowance ?? 28);
                        setSelectedLeaves(d.selectedLeaves ?? []);
                    }
                });
            }, [user]);

            const handleAuth = async (e) => {
                e.preventDefault();
                setError('');
                setAuthLoading(true);
                try {
                    if (isRegistering) {
                        await createUserWithEmailAndPassword(auth, email, password);
                    } else {
                        await signInWithEmailAndPassword(auth, email, password);
                    }
                } catch (err) {
                    setError(err.code.toUpperCase().replace('AUTH/', '').replace(/-/g, ' '));
                } finally {
                    setAuthLoading(false);
                }
            };

            const updateCloud = async (total, leaves) => {
                if (!user) return;
                await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'data', 'vacation_data'), {
                    totalAllowance: total,
                    selectedLeaves: leaves,
                    lastUpdated: new Date().toISOString()
                }, { merge: true });
            };

            const holidays2026 = [
                { date: '2026-01-01', name: 'Viti i Ri' }, { date: '2026-01-02', name: 'Viti i Ri' },
                { date: '2026-03-14', name: 'Dita e Verës' }, { date: '2026-03-16', name: 'Pushim' },
                { date: '2026-03-20', name: 'Bajrami' }, { date: '2026-03-22', name: 'Nevruzi' },
                { date: '2026-03-23', name: 'Pushim' }, { date: '2026-04-05', name: 'Pashkët' },
                { date: '2026-05-01', name: 'Dita e Punës' }, { date: '2026-05-27', name: 'Kurban Bajrami' },
                { date: '2026-09-05', name: 'Nënë Tereza' }, { date: '2026-11-28', name: 'Pavarësia' },
                { date: '2026-11-29', name: 'Çlirimi' }, { date: '2026-12-25', name: 'Krishtlindjet' }
            ];

            const toggleDay = (dStr) => {
                const dayObj = new Date(dStr);
                const dayIdx = dayObj.getDay();
                if (holidays2026.some(h => h.date === dStr) || dayIdx === 0 || dayIdx === 6) return;

                const next = selectedLeaves.includes(dStr) 
                    ? selectedLeaves.filter(i => i !== dStr) 
                    : [...selectedLeaves, dStr];
                
                setSelectedLeaves(next);
                updateCloud(totalAllowance, next);
            };

            if (loading) return <div className="h-screen flex items-center justify-center font-bold text-slate-400">Duke u ngarkuar...</div>;

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="max-w-md w-full bg-white rounded-[2.5rem] p-10 shadow-xl border border-slate-100 text-center">
                            <div className="flex justify-center mb-8"><Logo /></div>
                            <form onSubmit={handleAuth} className="space-y-4 text-left">
                                <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-slate-50 border-none rounded-2xl p-4 font-bold outline-none" placeholder="Email" />
                                <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-slate-50 border-none rounded-2xl p-4 font-bold outline-none" placeholder="Fjalëkalimi" />
                                {error && <p className="text-red-500 text-[10px] font-black uppercase text-center">{error}</p>}
                                <button className="w-full bg-slate-900 text-white font-black py-4 rounded-2xl uppercase text-xs tracking-widest">
                                    {authLoading ? 'Pritni...' : (isRegistering ? 'Regjistrohu' : 'Hyrje')}
                                </button>
                            </form>
                            <button onClick={() => setIsRegistering(!isRegistering)} className="mt-6 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                {isRegistering ? 'Shko te Hyrja' : 'Krijo llogari të re'}
                            </button>
                        </div>
                    </div>
                );
            }

            const month = currentDate.getMonth();
            const year = currentDate.getFullYear();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDay = new Date(year, month, 1).getDay();
            const shift = firstDay === 0 ? 6 : firstDay - 1;

            const cells = [];
            for (let i = 0; i < shift; i++) cells.push(<div key={`b-${i}`} />);
            for (let d = 1; d <= daysInMonth; d++) {
                const ds = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const isHol = holidays2026.some(h => h.date === ds);
                const isSel = selectedLeaves.includes(ds);
                const isWkd = new Date(ds).getDay() === 0 || new Date(ds).getDay() === 6;

                cells.push(
                    <div key={d} onClick={() => toggleDay(ds)} className={`h-12 rounded-xl flex items-center justify-center cursor-pointer transition-all border ${isHol ? 'bg-red-50 border-red-100 text-red-600 font-bold' : isWkd ? 'bg-slate-50 border-transparent text-slate-200' : isSel ? 'bg-blue-600 border-blue-600 text-white font-bold' : 'bg-white border-slate-100 text-slate-600'}`}>
                        {d}
                    </div>
                );
            }

            return (
                <div className="max-w-4xl mx-auto p-4 md:p-8">
                    <div className="flex justify-between items-center mb-8">
                        <Logo />
                        <button onClick={() => signOut(auth)} className="text-red-400 font-black text-[10px] uppercase tracking-widest">Dil</button>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                        <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                            <p className="text-[10px] font-black text-slate-400 uppercase mb-1">Totali</p>
                            <input type="number" value={totalAllowance} onChange={e => {setTotalAllowance(Number(e.target.value)); updateCloud(Number(e.target.value), selectedLeaves);}} className="text-3xl font-black w-full outline-none" />
                        </div>
                        <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                            <p className="text-[10px] font-black text-slate-400 uppercase mb-1">Konsumuar</p>
                            <p className="text-3xl font-black text-blue-600">{selectedLeaves.length}</p>
                        </div>
                        <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                            <p className="text-[10px] font-black text-slate-400 uppercase mb-1">Mbetur</p>
                            <p className="text-3xl font-black text-emerald-500">{totalAllowance - selectedLeaves.length}</p>
                        </div>
                    </div>

                    <div className="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-xl">
                        <div className="flex justify-between items-center mb-8">
                            <h2 className="text-xl font-black uppercase">{new Intl.DateTimeFormat('sq-AL', {month:'long', year:'numeric'}).format(currentDate)}</h2>
                            <div className="flex gap-2">
                                <button onClick={() => setCurrentDate(new Date(year, month-1, 1))} className="p-2 bg-slate-50 rounded-lg">←</button>
                                <button onClick={() => setCurrentDate(new Date(year, month+1, 1))} className="p-2 bg-slate-50 rounded-lg">→</button>
                            </div>
                        </div>
                        <div className="calendar-grid">
                            {['H', 'M', 'M', 'E', 'P', 'S', 'D'].map(d => <div key={d} className="text-center text-[10px] font-black text-slate-300 mb-2">{d}</div>)}
                            {cells}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
