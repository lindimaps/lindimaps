<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINDIMAPS Systems - Menaxhimi i Lejeve</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .logo-gradient { background: linear-gradient(to right, #3b82f6, #2dd4bf); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        @keyframes pulse-dot { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
        .animate-dot { animation: pulse-dot 2s infinite ease-in-out; transform-origin: center; }
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes slide-up { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-up { animation: slide-up 0.3s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyDe_lLPQIhfJZaCZ0dZqRlLH0-kfyfy8Sw",
            authDomain: "pushimet.firebaseapp.com",
            projectId: "pushimet",
            storageBucket: "pushimet.firebasestorage.app",
            messagingSenderId: "1024807492402",
            appId: "1:1024807492402:web:7ccaa6f39947bc41d5952b"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const { useState, useEffect, useMemo } = React;

        const Logo = ({ size = "normal" }) => (
            <div className={`flex items-center gap-3 group ${size === 'large' ? 'mb-10' : ''}`}>
                <div className={`flex items-center justify-center bg-slate-900 rounded-xl shadow-lg ${size === 'large' ? 'h-14 w-14' : 'h-10 w-10'}`}>
                    <svg width={size === 'large' ? "32" : "24"} height={size === 'large' ? "32" : "24"} viewBox="0 0 24 24" fill="none">
                        <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z" fill="white" fillOpacity="0.15"/>
                        <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z" stroke="white" strokeWidth="2" strokeLinejoin="round"/>
                        <circle className="animate-dot" cx="12" cy="11" r="2.5" fill="#3b82f6" stroke="white" strokeWidth="1.2"/>
                    </svg>
                </div>
                <div className="flex flex-col text-left">
                    <h1 className={`${size === 'large' ? 'text-3xl' : 'text-xl'} font-black tracking-tighter leading-none`}>
                        <span className="text-slate-900">LINDI</span><span className="logo-gradient">MAPS</span>
                    </h1>
                    <span className="text-[8px] uppercase tracking-[0.4em] font-bold text-slate-400 mt-1">Systems</span>
                </div>
            </div>
        );

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isRegistering, setIsRegistering] = useState(false);
            const [isForgotPass, setIsForgotPass] = useState(false);
            const [error, setError] = useState('');
            const [success, setSuccess] = useState('');
            const [authLoading, setAuthLoading] = useState(false);
            const [activeTab, setActiveTab] = useState('selected');
            const [selectionMode, setSelectionMode] = useState('vacation');
            const [confirmDelete, setConfirmDelete] = useState(null);
            const [undoData, setUndoData] = useState(null);

            const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());
            const [currentDate, setCurrentDate] = useState(new Date(selectedYear, new Date().getMonth(), 1));
            const [yearData, setYearData] = useState({ 
                allowance: 28, 
                selected: [], 
                medical: [],
                movableDates: {}, 
                manualCarryover: null 
            });
            const [calculatedCarryover, setCalculatedCarryover] = useState(0);

            useEffect(() => {
                return auth.onAuthStateChanged((u) => { setUser(u); setLoading(false); });
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsub = db.collection('users').doc(user.uid).collection('years').doc(String(selectedYear))
                    .onSnapshot(doc => {
                        if (doc.exists) {
                            const data = doc.data();
                            setYearData({
                                allowance: data.allowance ?? 28,
                                selected: data.selected || [],
                                medical: data.medical || [],
                                movableDates: data.movableDates || {},
                                manualCarryover: (data.manualCarryover !== undefined && data.manualCarryover !== "") ? data.manualCarryover : null
                            });
                        } else {
                            setYearData({ allowance: 28, selected: [], medical: [], movableDates: {}, manualCarryover: null });
                        }
                    });

                const fetchCarryover = async () => {
                    let chainValue = 0;
                    for (let y = 2024; y < selectedYear; y++) {
                        const snap = await db.collection('users').doc(user.uid).collection('years').doc(String(y)).get();
                        if (snap.exists) {
                            const data = snap.data();
                            const currentYearStart = (data.manualCarryover !== undefined && data.manualCarryover !== null && data.manualCarryover !== "") ? Number(data.manualCarryover) : chainValue;
                            chainValue = Math.max(0, (currentYearStart + (Number(data.allowance) || 28)) - (data.selected || []).length);
                        } else { chainValue += 28; }
                    }
                    setCalculatedCarryover(chainValue);
                };
                fetchCarryover();
                return () => unsub();
            }, [user, selectedYear]);

            const holidays = useMemo(() => {
                const year = selectedYear;
                const defaults = {
                    'Bajrami i Madh': year === 2026 ? `${year}-03-20` : `${year}-03-31`,
                    'Pashkët Katolike': year === 2026 ? `${year}-04-05` : `${year}-04-20`,
                    'Pashkët Ortodokse': year === 2026 ? `${year}-04-12` : `${year}-04-12`,
                    'Kurban Bajrami': year === 2026 ? `${year}-05-27` : `${year}-06-07`
                };
                const currentMovable = { ...defaults, ...(yearData.movableDates || {}) };
                let baseHolidays = {
                    [`${year}-01-01`]: 'Viti i Ri', [`${year}-01-02`]: 'Viti i Ri',
                    [`${year}-03-14`]: 'Dita e Verës', [`${year}-03-22`]: 'Dita e Nevruzit',
                    [`${year}-05-01`]: 'Dita e Punës', [`${year}-09-05`]: 'Nënë Tereza',
                    [`${year}-11-22`]: 'Dita e Alfabetit', [`${year}-11-28`]: 'Pavarësia',
                    [`${year}-11-29`]: 'Çlirimi', [`${year}-12-08`]: 'Dita e Rinisë',
                    [`${year}-12-25`]: 'Krishtlindjet'
                };
                Object.entries(currentMovable).forEach(([name, date]) => { baseHolidays[date] = name; });
                let finalHolidays = { ...baseHolidays };
                Object.entries(baseHolidays).sort().forEach(([dateStr, name]) => {
                    const date = new Date(dateStr);
                    const dayOfWeek = date.getDay();
                    if (dayOfWeek === 0 || dayOfWeek === 6) {
                        let nextWorkDay = new Date(date);
                        let offset = (dayOfWeek === 0) ? 1 : 2;
                        nextWorkDay.setDate(date.getDate() + offset);
                        let nextStr = nextWorkDay.toISOString().split('T')[0];
                        while (finalHolidays[nextStr]) { nextWorkDay.setDate(nextWorkDay.getDate() + 1); nextStr = nextWorkDay.toISOString().split('T')[0]; }
                        finalHolidays[nextStr] = `${name} (Shtyrë)`;
                    }
                });
                return finalHolidays;
            }, [selectedYear, yearData.movableDates]);

            const activeCarryover = (yearData.manualCarryover !== null) ? Number(yearData.manualCarryover) : calculatedCarryover;
            const allowanceVal = Number(yearData.allowance) || 28;
            const totalRemaining = (allowanceVal + activeCarryover) - yearData.selected.length;
            const carryoverRemaining = Math.max(0, activeCarryover - yearData.selected.length);

            const updateFirebase = (newData) => {
                if (!user) return;
                setUndoData(yearData);
                db.collection('users').doc(user.uid).collection('years').doc(String(selectedYear)).set(newData, { merge: true });
                setTimeout(() => setUndoData(null), 5000);
            };

            const toggleDay = (dStr) => {
                const isWkd = [0, 6].includes(new Date(dStr).getDay());
                if (holidays[dStr] || isWkd) return;
                
                const isVacation = yearData.selected.includes(dStr);
                const isMedical = yearData.medical?.includes(dStr);

                if (isVacation || isMedical) {
                    setConfirmDelete({ date: dStr, type: isVacation ? 'selected' : 'medical' });
                } else {
                    if (selectionMode === 'vacation') {
                        const next = [...yearData.selected, dStr].sort();
                        updateFirebase({ ...yearData, selected: next });
                    } else {
                        const next = [...(yearData.medical || []), dStr].sort();
                        updateFirebase({ ...yearData, medical: next });
                    }
                }
            };

            const confirmRemoval = () => {
                if (!confirmDelete) return;
                const { date, type } = confirmDelete;
                const next = yearData[type].filter(i => i !== date);
                updateFirebase({ ...yearData, [type]: next });
                setConfirmDelete(null);
            };

            const handleUndo = () => {
                if (undoData) {
                    db.collection('users').doc(user.uid).collection('years').doc(String(selectedYear)).set(undoData);
                    setUndoData(null);
                }
            };

            const generatePDF = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                doc.setFillColor(15, 23, 42); doc.rect(0, 0, 210, 40, 'F');
                doc.setTextColor(255, 255, 255); doc.setFontSize(22); doc.setFont("helvetica", "bold"); doc.text("LINDIMAPS SYSTEMS", 20, 25);
                doc.setFontSize(10); doc.text(`RAPORTI I LEJEVE DHE RAPORTEVE - VITI ${selectedYear}`, 20, 32);
                doc.setTextColor(0, 0, 0); doc.setFontSize(11); doc.text(`Perdoruesi: ${user.email}`, 20, 55); doc.text(`Data e gjenerimit: ${new Date().toLocaleDateString('sq-AL')}`, 20, 62);
                
                const tableRows = [
                    ...yearData.selected.map((date, index) => [
                        date, new Intl.DateTimeFormat('sq-AL', { weekday: 'long' }).format(new Date(date)),
                        index < activeCarryover ? `Leje (Mbartur ${selectedYear - 1})` : `Leje (Buxheti ${selectedYear})`
                    ]),
                    ...(yearData.medical || []).map((date) => [
                        date, new Intl.DateTimeFormat('sq-AL', { weekday: 'long' }).format(new Date(date)),
                        "Raport Mjekesor"
                    ])
                ].sort((a, b) => a[0].localeCompare(b[0]));

                doc.autoTable({ startY: 75, head: [['Data', 'Dita', 'Lloji']], body: tableRows, theme: 'grid', headStyles: { fillColor: [59, 130, 246] } });

                const finalY = doc.lastAutoTable.finalY + 15;
                doc.setFontSize(12); doc.setFont("helvetica", "bold"); doc.text("PERMBLEDHJA E BILANCIT:", 20, finalY);
                doc.setFont("helvetica", "normal"); doc.setFontSize(10);
                doc.text(`Mbartur nga ${selectedYear - 1}: ${activeCarryover} dite`, 20, finalY + 8);
                doc.text(`Buxheti i vitit ${selectedYear}: ${allowanceVal} dite`, 20, finalY + 14);
                doc.text(`Gjithesej shfrytezuar (Leje): ${yearData.selected.length} dite`, 20, finalY + 20);
                doc.text(`Gjithesej Raporte Mjekesore: ${yearData.medical?.length || 0} dite`, 20, finalY + 26);
                
                doc.setFont("helvetica", "bold");
                doc.text(`MBETJA ${selectedYear - 1}: ${carryoverRemaining} dite`, 20, finalY + 36);
                doc.text(`MBETJA TOTALE ${selectedYear}: ${totalRemaining} dite`, 20, finalY + 42);
                doc.save(`Raport_Komplet_${selectedYear}.pdf`);
            };

            const handleAuth = async (e) => {
                e.preventDefault(); setError(''); setSuccess(''); setAuthLoading(true);
                try {
                    if (isForgotPass) { await auth.sendPasswordResetEmail(email); setSuccess("Emaili për resetimin u dërgua!"); }
                    else if (isRegistering) { await auth.createUserWithEmailAndPassword(email, password); }
                    else { await auth.signInWithEmailAndPassword(email, password); }
                } catch (err) { setError("Veprimi dështoi. Kontrolloni të dhënat."); } finally { setAuthLoading(false); }
            };

            if (loading) return null;

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-white">
                        <div className="max-w-md w-full text-center">
                            <Logo size="large" />
                            <div className="bg-white rounded-[2.5rem] p-10 shadow-2xl border border-slate-100">
                                <h2 className="text-xl font-black mb-6 uppercase tracking-widest text-slate-800">
                                    {isForgotPass ? 'Reset Password' : (isRegistering ? 'Regjistrim i Ri' : 'LINDIMAPS PUSHIMET LOGIN')}
                                </h2>
                                <form onSubmit={handleAuth} className="space-y-4">
                                    <input type="email" placeholder="Email" className="w-full bg-slate-50 border-none rounded-2xl p-4 outline-none font-bold text-slate-700" value={email} onChange={e => setEmail(e.target.value)} required />
                                    {!isForgotPass && <input type="password" placeholder="Fjalëkalimi" className="w-full bg-slate-50 border-none rounded-2xl p-4 outline-none font-bold text-slate-700" value={password} onChange={e => setPassword(e.target.value)} required />}
                                    {error && <div className="text-red-500 text-[10px] font-black uppercase py-2">{error}</div>}
                                    {success && <div className="text-emerald-500 text-[10px] font-black uppercase py-2">{success}</div>}
                                    <button type="submit" disabled={authLoading} className="w-full bg-slate-900 text-white font-black py-5 rounded-2xl hover:bg-blue-600 transition-all uppercase text-xs tracking-[0.2em] shadow-xl">
                                        {authLoading ? 'Pritni...' : (isForgotPass ? 'Dërgo Email' : (isRegistering ? 'Regjistrohu' : 'Hyr'))}
                                    </button>
                                </form>
                                <div className="mt-8 flex flex-col gap-3">
                                    <button onClick={() => { setIsForgotPass(!isForgotPass); setIsRegistering(false); }} className="text-[10px] font-black text-slate-400 uppercase tracking-widest hover:text-blue-600 transition-colors">
                                        {isForgotPass ? 'Kthehu te Hyrja' : 'Harruat fjalëkalimin?'}
                                    </button>
                                    {!isForgotPass && (
                                        <button onClick={() => setIsRegistering(!isRegistering)} className="text-[10px] font-black text-slate-400 uppercase tracking-widest hover:text-blue-600 transition-colors">
                                            {isRegistering ? 'Shko te Hyrja' : 'Nuk keni llogari? Regjistrohuni'}
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            const usedInYear = yearData.selected.length;
            const subText = usedInYear < activeCarryover 
                ? `mbetur ${selectedYear - 1} (${carryoverRemaining} ditë)` 
                : `mbetur ${selectedYear} (${totalRemaining} ditë)`;

            return (
                <div className="min-h-screen p-4 md:p-10 max-w-6xl mx-auto space-y-6 relative">
                    {confirmDelete && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-6">
                            <div className="bg-white rounded-[2.5rem] p-8 max-w-sm w-full shadow-2xl animate-slide-up text-center">
                                <h3 className="text-lg font-black text-slate-900 uppercase tracking-tight mb-2">Heqja e ditës</h3>
                                <p className="text-sm font-medium text-slate-400 mb-8">Dëshironi të hiqni datën <span className="text-slate-900 font-bold">{confirmDelete.date}</span>?</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setConfirmDelete(null)} className="flex-1 py-4 bg-slate-100 text-slate-400 font-black rounded-2xl uppercase text-[10px] tracking-widest">Anulo</button>
                                    <button onClick={confirmRemoval} className="flex-1 py-4 bg-red-500 text-white font-black rounded-2xl uppercase text-[10px] tracking-widest">Po, fshije</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {undoData && (
                        <div className="fixed bottom-10 left-1/2 -translate-x-1/2 z-[90] w-[90%] max-w-md">
                            <div className="bg-slate-900 text-white p-4 rounded-2xl shadow-2xl flex justify-between items-center animate-slide-up">
                                <span className="text-[10px] font-black uppercase tracking-widest">Veprimi u krye</span>
                                <button onClick={handleUndo} className="px-4 py-2 bg-white/10 rounded-xl text-[10px] font-black uppercase">Zhbëj (Back)</button>
                            </div>
                        </div>
                    )}

                    <div className="flex flex-wrap justify-between items-center bg-white p-4 rounded-3xl border border-slate-100 shadow-sm gap-4">
                        <Logo />
                        <div className="flex items-center bg-slate-100 p-1 rounded-2xl">
                            {[selectedYear-2, selectedYear-1, selectedYear, selectedYear+1, selectedYear+2].map(y => (
                                <button key={y} onClick={() => {setSelectedYear(y); setCurrentDate(new Date(y, 0, 1));}} className={`px-4 py-2 rounded-xl text-[10px] font-black transition-all ${selectedYear === y ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-400 uppercase'}`}>{y}</button>
                            ))}
                        </div>
                        <button onClick={() => auth.signOut()} className="p-3 bg-white rounded-2xl border border-slate-100 text-red-400"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                        <div className="bg-white p-5 rounded-[2.5rem] border border-slate-100 shadow-sm text-center">
                            <p className="text-[9px] font-black text-slate-300 uppercase tracking-widest mb-2">Mbartur nga {selectedYear-1}</p>
                            <input type="number" value={yearData.manualCarryover ?? ""} placeholder={calculatedCarryover} onChange={(e) => updateFirebase({...yearData, manualCarryover: e.target.value === "" ? null : e.target.value})} className="text-2xl font-black w-full text-center outline-none rounded-xl py-1 bg-slate-50 text-slate-400" />
                        </div>
                        <div className="bg-white p-5 rounded-[2.5rem] border border-slate-100 shadow-sm text-center">
                            <p className="text-[9px] font-black text-slate-300 uppercase tracking-widest mb-2">Leja {selectedYear}</p>
                            <input type="number" value={yearData.allowance} onChange={(e) => updateFirebase({...yearData, allowance: e.target.value})} className="text-2xl font-black w-full text-center outline-none bg-slate-50 rounded-xl py-1 text-slate-700" />
                        </div>
                        <div className="bg-slate-900 p-5 rounded-[2.5rem] shadow-xl text-center">
                            <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-2">Shfrytëzuar</p>
                            <p className="text-2xl font-black text-white">{yearData.selected.length}</p>
                        </div>
                        <div className="bg-orange-50 p-5 rounded-[2.5rem] border border-orange-100 shadow-sm text-center">
                            <p className="text-[9px] font-black text-orange-400 uppercase tracking-widest mb-2">Raport Mjekësor</p>
                            <p className="text-2xl font-black text-orange-600">{yearData.medical?.length || 0}</p>
                        </div>
                        <div className="bg-emerald-50 p-5 rounded-[2.5rem] border border-emerald-100 shadow-sm text-center">
                            <p className="text-[9px] font-black text-emerald-800/40 uppercase tracking-widest mb-1">Mbetja Totale</p>
                            <p className={`text-2xl font-black ${totalRemaining < 0 ? 'text-red-500' : 'text-emerald-600'}`}>{totalRemaining}</p>
                            <p className="text-[9px] font-bold text-emerald-700/60 mt-1 uppercase">{subText}</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div className="lg:col-span-2 bg-white p-8 rounded-[3.5rem] border border-slate-100 shadow-xl">
                            <div className="flex flex-col md:flex-row items-center justify-between mb-8 gap-4">
                                <h2 className="text-lg font-black uppercase tracking-tighter text-slate-900">{new Intl.DateTimeFormat('sq-AL', { month: 'long', year: 'numeric' }).format(currentDate)}</h2>
                                
                                <div className="flex items-center gap-2 bg-slate-50 p-1.5 rounded-2xl border border-slate-100">
                                    <button onClick={() => setSelectionMode('vacation')} className={`px-4 py-2 rounded-xl text-[9px] font-black uppercase transition-all ${selectionMode === 'vacation' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400'}`}>Leje</button>
                                    <button onClick={() => setSelectionMode('medical')} className={`px-4 py-2 rounded-xl text-[9px] font-black uppercase transition-all ${selectionMode === 'medical' ? 'bg-orange-500 text-white shadow-md' : 'text-slate-400'}`}>Raport</button>
                                </div>

                                <div className="flex bg-slate-50 p-1 rounded-2xl">
                                    <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1))} className="p-3"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="m15 18-6-6 6-6"/></svg></button>
                                    <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1))} className="p-3"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="m9 18 6-6-6-6"/></svg></button>
                                </div>
                            </div>
                            <div className="calendar-grid">
                                {['Hën', 'Mar', 'Mër', 'Enj', 'Pre', 'Sht', 'Die'].map(d => <div key={d} className="text-center text-[10px] font-black text-slate-300 mb-4">{d}</div>)}
                                {(() => {
                                    const cells = [];
                                    const y = currentDate.getFullYear(); const m = currentDate.getMonth();
                                    const dInM = new Date(y, m + 1, 0).getDate();
                                    const first = new Date(y, m, 1).getDay();
                                    const shift = first === 0 ? 6 : first - 1;
                                    for (let i = 0; i < shift; i++) cells.push(<div key={`b-${i}`} />);
                                    for (let d = 1; d <= dInM; d++) {
                                        const dStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                                        const isHol = holidays[dStr]; 
                                        const isSel = yearData.selected.includes(dStr); 
                                        const isMed = yearData.medical?.includes(dStr);
                                        const isWkd = [0, 6].includes(new Date(dStr).getDay());
                                        
                                        cells.push(
                                            <div key={d} onClick={() => toggleDay(dStr)} className={`h-12 md:h-16 rounded-2xl border flex flex-col items-center justify-center cursor-pointer transition-all ${isHol ? 'bg-red-50 text-red-500 font-bold border-red-100' : isWkd ? 'bg-slate-50 text-slate-200 border-transparent' : isSel ? 'bg-blue-600 text-white shadow-lg border-blue-600' : isMed ? 'bg-orange-500 text-white shadow-lg border-orange-500' : 'bg-white border-slate-100 text-slate-600 shadow-sm'}`}>
                                                <span className="text-sm font-black">{d}</span>
                                                {isHol && <span className="text-[5px] uppercase truncate w-full px-1 text-center font-bold">{isHol}</span>}
                                                {isMed && !isHol && <span className="text-[5px] uppercase font-bold">Raport</span>}
                                                {isSel && !isHol && <span className="text-[5px] uppercase font-bold">Leje</span>}
                                            </div>
                                        );
                                    }
                                    return cells;
                                })()}
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-[3.5rem] border border-slate-100 shadow-xl flex flex-col h-[600px]">
                            <div className="flex p-1 bg-slate-100 rounded-2xl mb-6">
                                <button onClick={() => setActiveTab('selected')} className={`flex-1 py-3 text-[9px] font-black uppercase rounded-xl ${activeTab === 'selected' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-400'}`}>Të Dhënat</button>
                                <button onClick={() => setActiveTab('holidays')} className={`flex-1 py-3 text-[9px] font-black uppercase rounded-xl ${activeTab === 'holidays' ? 'bg-white text-red-600 shadow-sm' : 'text-slate-400'}`}>Pushimet</button>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto pr-2 space-y-4 no-scrollbar">
                                {activeTab === 'selected' ? (
                                    <>
                                        <button onClick={generatePDF} className="w-full mb-4 bg-slate-900 text-white py-4 rounded-2xl text-[9px] font-black uppercase tracking-widest shadow-lg">Shkarko Raportin</button>
                                        
                                        {[
                                            ...yearData.selected.map((d, i) => ({ date: d, type: 'vacation', idx: i })),
                                            ...(yearData.medical || []).map(d => ({ date: d, type: 'medical' }))
                                        ].sort((a, b) => b.date.localeCompare(a.date)).map((item) => (
                                            <div key={item.date + item.type} className={`flex justify-between items-center p-3 rounded-2xl ${item.type === 'medical' ? 'bg-orange-50 border border-orange-100' : item.idx < activeCarryover ? 'bg-blue-50/50 border border-blue-100' : 'bg-slate-50'}`}>
                                                <div className="flex flex-col">
                                                    <span className="text-xs font-black text-slate-700">{item.date}</span>
                                                    <span className={`text-[8px] font-bold uppercase ${item.type === 'medical' ? 'text-orange-400' : 'text-slate-400'}`}>
                                                        {item.type === 'medical' ? 'Raport Mjekësor' : item.idx < activeCarryover ? `Mbartje ${selectedYear-1}` : `Buxheti ${selectedYear}`}
                                                    </span>
                                                </div>
                                                <button onClick={() => toggleDay(item.date)} className="p-2 text-slate-300 hover:text-red-500"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
                                            </div>
                                        ))}
                                    </>
                                ) : (
                                    <div className="space-y-4">
                                        <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest px-2">Festat e Lëvizshme</p>
                                        {['Bajrami i Madh', 'Pashkët Katolike', 'Pashkët Ortodokse', 'Kurban Bajrami'].map(name => (
                                            <div key={name} className="p-4 bg-slate-50 rounded-3xl border border-slate-100 space-y-2">
                                                <span className="text-[10px] font-black uppercase text-slate-800 block">{name}</span>
                                                <input type="date" value={Object.entries(holidays).find(([d, n]) => n === name)?.[0] || ''} onChange={(e) => { const updated = { ...(yearData.movableDates || {}) }; updated[name] = e.target.value; updateFirebase({ ...yearData, movableDates: updated }); }} className="w-full p-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-600 bg-white outline-none" />
                                            </div>
                                        ))}
                                        <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest px-2 mt-6">Festat zyrtare</p>
                                        {Object.entries(holidays).sort().map(([d, n]) => (
                                            <div key={d} className="flex items-center gap-3 p-3 rounded-2xl bg-red-50/40">
                                                <div className="text-[10px] font-black text-red-300 w-8">{d.split('-')[2]}</div>
                                                <div className="flex flex-col">
                                                    <span className="text-[9px] font-black uppercase text-slate-700">{n}</span>
                                                    <span className="text-[8px] font-bold text-slate-300 uppercase">{d}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                    <footer className="text-center pt-8 text-[8px] font-black text-slate-300 uppercase tracking-[0.5em] pb-10">LINDIMAPS Systems &copy; {selectedYear}</footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
